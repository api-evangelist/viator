supplier_side_testing:
  name: Viator Contract Testing Tool
  kind: local Docker web application
  image: public.ecr.aws/viator/cica:latest
  install: docker pull public.ecr.aws/viator/cica:latest
  run: >-
    docker run -it --rm --name viator-contract-testing -p 5173:5173 -p 8989:8989 -e
    API_KEY=$API_KEY -e SUPPLIER_ID=$SUPPLIER_ID --add-host=host.docker.internal:host-gateway
    public.ecr.aws/viator/cica:latest
  ui: http://localhost:5173
  scope: v2 Reservation System APIs only; v1 endpoints are not supported
  description: >-
    Runs Viator's own contract-test scenarios against a reservation system's endpoints. Endpoints do
    not need to be publicly exposed - a locally running API is reached at
    http://host.docker.internal:PORT. Test inputs resolve Test Case Input > Test Product Option
    Config > Global Defaults.
  credentials_required: [API_KEY, SUPPLIER_ID]
  credentials_issued_by: Viator, after the integration kick-off meeting
  source: https://docs.viator.com/supplier-api/technical/
test_clocks: false
fixture_tooling: false
