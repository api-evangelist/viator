generated: '2026-07-28'
method: searched
source: >-
  https://docs.viator.com/partner-api/technical/ (Testing, Booking confirmation types / Building in
  the sandbox environment sections), the four published Postman collections, and
  https://docs.viator.com/supplier-api/technical/ (Contract testing section)
summary: >-
  Viator runs a named, fully separate sandbox environment that mirrors production products and
  functionality, and mandates that all partner testing happens there. There are no test-mode key
  prefixes - the same organisation exp-api-key is used against a different host - and no test cards
  are published for the demand-side booking flow. Behaviour simulation is done with the exp-demo
  request header, and the final supplier decision on a manual-confirmation test booking is set by
  Viator support on request. On the supplier side Viator ships a Dockerised contract-testing tool
  instead of a sandbox.
environments:
- name: sandbox
  base_url: https://api.sandbox.viator.com/partner
  api: Viator Partner API v2
  declared_in: openapi/viator-partner-api-v2-openapi.json servers[1]
  live: true
  probe:
    url: https://api.sandbox.viator.com/partner/products/tags
    status: 400
    note: host answers; 400 is the documented response when the version header is absent
- name: production
  base_url: https://api.viator.com/partner
  api: Viator Partner API v2
  declared_in: openapi/viator-partner-api-v2-openapi.json servers[0]
- name: sandbox
  base_url: https://viatorapi.sandbox.viator.com/service
  api: Viator Merchant API v1 (legacy)
  declared_in: openapi/viator-merchant-api-v1-openapi.json servers[1]
- name: production
  base_url: https://viatorapi.viator.com/service
  api: Viator Merchant API v1 and Affiliate API v1 (legacy)
key_separation:
  model: same-key-different-host
  test_key_prefix: null
  note: >-
    Viator issues one API key per organisation. There is no separate test key and no key prefix that
    distinguishes test from live; the environment is selected by hostname alone.
policy:
  verbatim: >-
    "All testing must be done in Sandbox. Production endpoints are for live bookings only and must
    not be used for testing under any circumstances. Sandbox provides access to the same products
    and functionality as Production unless stated otherwise."
  source: https://docs.viator.com/partner-api/technical/#section/Testing
behaviour_simulation:
  header: exp-demo
  in: header
  description: >-
    Marks a request as a demo/test booking. Demo bookings send no notifications and are
    automatically confirmed, and manual-confirmation products behave as if they were instant
    confirmation.
  values:
  - value: 'true'
    effect: demo booking; no notifications; auto-confirmed
  - value: 'false'
    effect: >-
      In sandbox, forces manual-confirmation products to return bookingStatus = PENDING, which is
      the real production behaviour for those products.
    applies_to_operations: [bookingsBook, bookingsCartBook]
  source: https://docs.viator.com/partner-api/technical/#section/Booking-concepts/Booking-confirmation-types
manual_confirmation_test_flow:
  steps:
  - Make the booking in sandbox with exp-demo set to false and observe bookingStatus = PENDING.
  - >-
    Email apitechsupport@viator.com with the bookingRef and request the status be moved to CONFIRMED
    or REJECTED.
  - Poll bookingsStatus to observe the resolved state.
  note: >-
    The final supplier decision cannot be self-served; Viator support flips it. There is no test
    clock or time-simulation facility.
  source: https://docs.viator.com/partner-api/technical/#section/Booking-concepts/Booking-confirmation-types
