    status: 404
  - url: https://api.viator.com/.well-known/oauth-protected-resource
    status: 404
server:
  name: viator
  transport: http
  url: null
  note: Candidate only. This is the tool surface a Viator-operated MCP server would expose if it were
    projected one-to-one from the published Partner API v2 OpenAPI. It is not a live endpoint.
auth:
  scheme: apiKey
  header: exp-api-key
  version_header: 'Accept: application/json;version=2.0'
  note: One organisation-wide key, no OAuth and no scopes, so an MCP deployment cannot delegate per-user
    authority - every tool call carries the full authority of the partner account. Tool exposure must
    therefore be gated by the partner access tier (see conventions/viator-conventions.yml access_tiers)
    and, for the booking tools, by human approval.
