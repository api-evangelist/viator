provenance:
  method: >-
    Viator does not serve a standalone OpenAPI file - every attempt at /openapi.json,
    /openapi.yaml and /api-docs returned 403. All four specifications were recovered verbatim from
    the __redoc_state JSON that Viator's own Redoc-rendered documentation pages embed and hydrate
    in the browser. Each was parsed with the standard JSON decoder, confirmed to carry an openapi
    version, info, servers, paths and components, and written unmodified. Nothing was synthesised,
    inferred, or completed by hand.
  harvestedOn: '2026-07-28'
  artifacts:
  - path: openapi/viator-partner-api-v2-openapi.json
    sourceURL: https://docs.viator.com/partner-api/technical/
    httpStatus: 200
    parses: true
  - path: openapi/viator-reservation-system-api-openapi.json
    sourceURL: https://docs.viator.com/supplier-api/technical/
