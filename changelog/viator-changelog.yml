- api: Viator Reservation System API
  spec: openapi/viator-reservation-system-api-openapi.json
  url: https://docs.viator.com/supplier-api/technical/
  entries:
  - version: '2.0'
    breaking: true
    type: major-release
    highlight: >-
      Introduced endpoint versioning (legacy endpoints are v1.0, new endpoints start at v2.0), moved
      the API key onto HTTP headers, made JSON the only supported format, added the productOptionId
      single product-variant identifier, added full pricing capabilities (per-person, tiered
      per-person and unit pricing), added Viator-hosted notification webhooks for salability,
      capacity, pricing and special offers, added the Reserve endpoint that holds inventory and
      price before booking, and shipped a self-service contract-testing tool.
    deprecations:
    - Real-time Availability API (availability) superseded by availabilityCheck and reserve
    - Batch Availability API (batchAvailability) superseded by calendar
    - Batch Pricing API (batchPricing) superseded by calendar
    - Availability Notifications (2) API (availabilityNotification2) superseded by eventNotification
    - XML (application/xml) request and response bodies
    - the legacy SOAP WSDL/XSD interface
