- aid: viator:viator-partner-auxiliary-api
  name: Viator Partner Auxiliary API
  description: >-
    Supporting reference and content services for the Partner API v2 - free-text search across
    products, destinations and attractions, bulk location resolution, exchange rates, product
    reviews, supplier product-code lookup and the destination taxonomy.
  humanURL: https://docs.viator.com/partner-api/technical/
  baseURL: https://api.viator.com/partner
  tags:
  - Search
