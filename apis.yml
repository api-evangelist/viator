- aid: viator:viator-reservation-system-api
  name: Viator Reservation System API
  description: >-
    The supplier-side connectivity contract, formerly the Viator Supplier API. This specification
    is inverted - it defines the endpoints a tour operator's reservation system or booking
    software must itself implement and expose for Viator to call, covering tour list mapping,
    real-time and batch availability, batch pricing, reserve, booking, amendment, cancellation
    and redemption, alongside the Viator-hosted event and special-offer notification endpoints.
    It carries published uptime, latency and error-rate SLAs and Viator-operated circuit breakers.
  humanURL: https://docs.viator.com/supplier-api/technical/
  tags:
  - Supplier
  - Connectivity
  - Channel Manager
  - Inventory
  - Reservation System
  properties:
  - type: OpenAPI
    url: openapi/viator-reservation-system-api-openapi.json
  - type: Documentation
    url: https://docs.viator.com/supplier-api/technical/
  - type: Documentation
    url: https://docs.viator.com/supplier-api/technical/api-overview/
  - type: Documentation
    url: https://docs.viator.com/supplier-api/technical/connectivity-overview/index.html
  - type: Documentation
    url: https://docs.viator.com/supplier-api/technical/sapi-manual-latest/
- aid: viator:viator-merchant-api-v1
  name: Viator Merchant API v1
  description: >-
    The legacy v1 merchant-partner specification still published by Viator, exposing taxonomy,
    product, photo, review, availability, pricing-matrix, booking, voucher and cancellation
    services under viatorapi.viator.com/service. Superseded by the Partner API v2 but retained in
    the public documentation.
  humanURL: https://docs.viator.com/partner-api/merchant/technical/
  baseURL: https://viatorapi.viator.com/service
  tags:
  - Merchant
  - Legacy
  - Bookings
  - Products
  properties:
  - type: OpenAPI
    url: openapi/viator-merchant-api-v1-openapi.json
  - type: Documentation
    url: https://docs.viator.com/partner-api/merchant/technical/
- aid: viator:viator-affiliate-api-v1
  name: Viator Affiliate API v1
  description: >-
    The legacy v1 affiliate-partner specification, a non-transactional subset covering utility
    services, destination and category taxonomy, product and attraction search, product detail,
    reviews and photos under viatorapi.viator.com/service. Superseded by the Partner API v2.
  humanURL: https://docs.viator.com/partner-api/affiliate/technical/
  baseURL: https://viatorapi.viator.com/service
  tags:
  - Affiliate
