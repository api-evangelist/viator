  name: Viator Partner Products API
  description: >-
    Product content and catalogue ingestion for the Viator Partner API v2 - full product detail,
    bulk retrieval, incremental modified-since ingestion, the product tag taxonomy, booking
    questions, product search and product-to-product recommendations.
  humanURL: https://docs.viator.com/partner-api/technical/
  baseURL: https://api.viator.com/partner
  tags:
  - Products
  - Catalog
  - Content
  - Search
  properties:
  - type: OpenAPI
    url: openapi/viator-partner-api-v2-openapi.json
  - type: Documentation
    url: https://docs.viator.com/partner-api/technical/
  - type: APIReference
    url: https://docs.viator.com/partner-api/technical/#tag/Products
  - type: PostmanCollection
    url: collections/Viator-Merchant-API-v2.postman_collection.json
- aid: viator:viator-partner-availability-api
  name: Viator Partner Availability API
  description: >-
    Real-time availability and price checking plus availability-schedule retrieval for a single
    product, in bulk, or incrementally by modification date, so partners can hold a local mirror
    of bookable capacity and pricing.
  humanURL: https://docs.viator.com/partner-api/technical/
  baseURL: https://api.viator.com/partner
  tags:
  - Availability
  - Pricing
  - Schedules
  properties:
  - type: OpenAPI
    url: openapi/viator-partner-api-v2-openapi.json
  - type: Documentation
    url: https://docs.viator.com/partner-api/technical/
  - type: APIReference
    url: https://docs.viator.com/partner-api/technical/#tag/Availability
- aid: viator:viator-partner-bookings-api
  name: Viator Partner Bookings API
  description: >-
    Transactional booking surface - cart and single-item hold and book, booking status, cancel
    reasons, cancellation quote and cancellation, amendment check, quote and amend, and the
    modified-since booking feed with an acknowledgement cursor for pulling a partner's own
    booking records.
  humanURL: https://docs.viator.com/partner-api/technical/
  baseURL: https://api.viator.com/partner
  tags:
  - Bookings
  - Orders
  - Cancellation
  - Amendments
  properties:
  - type: OpenAPI
    url: openapi/viator-partner-api-v2-openapi.json
  - type: Documentation
