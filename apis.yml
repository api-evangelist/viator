- aid: viator:viator-deprecated-api
  name: Viator Deprecated API
  description: >-
    This section lists endpoints that are no longer recommended for new or updated integrations. These
    endpoints remain available for existing connections only, will stop receiving new features or behavior
    improvements, and will eventually be retired once an end-of-life procedure is agreed with Viator (see
    the [v2 migration guide](#tag/v2-migration-guide) for details).


    For all new development, use the current, fully supported endpoints documented in the main sections
    of this guide.


    ### REST v1.0 endpoints — deprecated


    - [Real-time Availability API](#operation/availability) — superseded by the Availability Check API
    and Reserve API

    - [Batch Availability API](#operation/batchAvailability) — superseded by the Calendar API

    - [Batch Pricing API](#operation/batchPricing) — superseded by the Calendar API

    - [Availability Notifications (2) API](#operation/availabilityNotification2) — superseded by the Event
    Notifications API


    ### Data format: XML — deprecated


    XML (`application/xml`) requests and responses are deprecated. **New integrations must use JSON (`application/json`)
    exclusively.** XML remains available for existing v1.0 integrations only and will receive no new features
    or behavior improvements. All v2.0 endpoints are JSON-only. XML will eventually be retired once an
    end-of-life procedure is agreed with Viator.


    ### SOAP interface (WSDL/XSD) — deprecated


    The legacy SOAP interface definitions are deprecated. SOAP is no longer supported for new or updated
    integrations; use the REST endpoints documented in the main sections of this guide instead.


    The WSDL and XSD files are kept for historical reference only:


    - [Reseller-to-supplier WSDL](resources/api_specs/wsdl/tgds-reseller-to-supplier.wsdl)

    - [Supplier-to-reseller WSDL](resources/api_specs/wsdl/tgds-supplier-to-reseller.wsdl)

    - [API XSD](resources/api_specs/xsd/api.xsd)
