aid: viator
url: https://raw.githubusercontent.com/api-evangelist/viator/refs/heads/main/apis.yml
name: Viator
kind: company
description: >-
  Viator is a Tripadvisor company and the largest online marketplace for tours, activities and
  travel experiences, headquartered in the United States and listing more than 300,000 bookable
  products across roughly 2,500 destinations. It sits on the demand side of the travel
  distribution chain as an aggregator and reseller of third-party operator inventory, and on the
  supply side as the channel counterparty that tour operators' reservation systems connect into.
  Its API posture is unusually open for travel: the full Viator Partner API v2 OpenAPI, the legacy
  v1 affiliate and merchant specifications, the Viator Reservation System (supplier) API and four
  Postman collections are all published without a login at docs.viator.com, and Basic Access
  affiliate keys are issued self-serve at no cost on account creation. Everything beyond that is
  gated - Full Access, Full Access plus Booking, Merchant and supplier connectivity all require
  qualification by Viator and, for transactional integrations, passing a two-part front-end and
  back-end certification. No open travel standard is referenced anywhere in the specifications:
  the contract is entirely Viator-proprietary, product identifiers are Viator-internal, and
  partners are contractually required to prevent search engines indexing Viator reviews and
  unique content.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
