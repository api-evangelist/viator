    VideoVariants:
      type: object
      description: 'An object of available video delivery options for the same content, structured by delivery strategy.

        Each variant defines how the video can be retrieved and played, optimized for different playback capabilities and network conditions.

        Clients should select the best-supported variant and ignore unknown variant keys for forward compatibility.

        '
      required:
      - streaming
      - progressive
      properties:
        streaming:
          type: array
          description: "Streaming-optimized video source, intended for real-time playback. \nStreaming variants provide a single entry point that allows the player to automatically select bitrate and resolution based on network conditions and device capabilities.\n"
          items:
            $ref: '#/components/schemas/StreamingVideoVariant'
        progressive:
          type: array
          description: Progressive download video source intended for immediate or offline playback
          items:
            $ref: '#/components/schemas/ProgressiveVideoVariant'
    StreamingVideoVariant:
      type: object
      description: Streaming video variant
      required:
      - protocol
      - format
      - url
      properties:
        protocol:
          type: string
          description: The streaming protocol used to deliver the video (e.g. `HLS`). This defines how the playlist and media segments are interpreted by the player.
          example: HLS
        format:
          type: string
          description: The playlist or manifest format for the streaming protocol (e.g. `M3U8`).
          example: M3U8
        url:
          type: string
          description: The URL of the streaming playlist that serves as the entry point for video playback.
          example: https://hare-dynamic-media-cdn.tripadvisor.com/media/video-v/31/1f/5b/68/vid-693-rome-2017-vatican_1080.m3u8
