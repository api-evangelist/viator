    ProductSearchPricing:
      type: object
      description: "High-level summary of product prices\n  \n  - **Note**: This price may not be available during the date range specified in the `filtering` section of the request\n"
      required:
      - fromPrice
      - currency
      properties:
        summary:
          allOf:
          - type: object
            properties:
              fromPriceBeforeDiscount:
                type: number
                description: If the product is presently discounted, this field shows what the value of `fromPrice` would be if no discount had been applied; otherwise, it will be equal to `fromPrice`.
          - $ref: '#/components/schemas/AvailabilityScheduleSummary'
        currency:
          type: string
          description: Currency code for the currency in which the prices in `summary` are denominated
        partnerNetFromPrice:
          type: number
          description: "Lowest per-person price for this product expressed as the amount (excluding the booking fee)that merchant partners using the markup/booking-fee pricing scheme would be invoiced. \n\nThis value is calculated according to the price for a group of at least two standard participants (or, the smallest bookable group if more than two participants are required) for a period not exceeding 384 days into the future.\n\n**Note**: This property is only relevant to you and will only be returned if you are a markup merchant partner (i.e., you are a merchant and are not using the commission-based pricing model).\n"
        extraChargesSummary:
          $ref: '#/components/schemas/AvailabilityScheduleExtraChargesSummary'
    ProductReviewsSummary:
      type: object
      description: "Summary of reviews and ratings for this attraction\n\n**Note**:\n  - Review data is updated daily; i.e., all reviews received on a day will be added and averages re-calculated in a single event.\n  - Viator performs checks on reviews - for more information, see [Review authenticity](#section/Key-concepts/Review-authenticity)\n"
