          pattern: (?s).*[\S].*
          description: "Whether this supplier is a business or an individual\n\nOne of:\n  - `\"BUSINESS\"`\n  - `\"INDIVIDUAL\"`\n\nNote: BUSINESS includes individuals who are acting as sole traders\n"
        logo:
          type: string
