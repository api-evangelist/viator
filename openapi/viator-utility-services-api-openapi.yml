  description: Utility services
paths:
  /util/sitedetails:
    get:
      tags:
      - Utility services
      summary: /util/sitedetails
      operationId: utilSitedetails
      description: Get site details – show the site settings for your organization
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/defaultCurrencyCode'
      - in: query
        name: centralURL
        description: '**URL** for multi-URL sites that have a central URL for processing etc like www.alllasvegastours.com has content.allsightseeingtours.com'
        example: alllasvegastours.com
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        showLogo:
                          type: boolean
                        showFavicon:
                          type: boolean
                        hasCustomHeaderHtml:
                          type: boolean
                        hasCustomFooterHtml:
                          type: boolean
                        hasCustomCss:
                          type: boolean
                        homepageDestIds:
                          type: boolean
                        piiSetting:
                          type: boolean
                        partnerPrivacyPolicyUrl:
                          type: boolean
                        pointsProgram:
                          type: boolean
                        pointsProgramName:
                          type: boolean
                        pointsProgramUserType:
                          type: boolean
                        pointsProgramHelpText:
                          type: boolean
                        puid:
                          type: boolean
                        retailSiteId:
                          type: boolean
                        companyName:
                          type: boolean
                        defaultCurrency:
                          type: boolean
                        centralURL:
                          type: boolean
                        permissionsDenied:
                          type: array
                          items:
                            type: integer
                        allowMultiCurrency:
                          type: boolean
                        mobileSiteDomain:
                          type: string
                          description: ignore (Viator only)
                        showSupplierName:
                          type: boolean
                        showAllLangServices:
                          type: boolean
                        showPassbook:
                          type: boolean
                        urlPostFixedValue:
                          type: string
                          description: ignore (Viator only)
                        canDisableBookEmail:
                          type: boolean
                        clientId:
                          type: string
                        locale:
                          type: string
                        enabled:
                          type: boolean
                        url:
                          type: string
                        id:
                          type: integer
                        channel:
                          type: string
              examples:
                '1':
                  $ref: '#/components/examples/util-sitedetails-example'
  /util/countrymap:
    get:
      tags:
      - Utility services
      summary: /util/countrymap
      operationId: utilCountrymap
      description: Get a dictionary mapping coutry-codes to their natural-language names and international dialling prefixes
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        AF:
                          type: object
                          properties:
                            countryName:
                              type: string
                              description: '**natural-language name** of the country that the country-code identifies'
                            phoneCode:
                              type: string
                              description: '**[International Direct Dialling (IDD)](https://en.wikipedia.org/wiki/International_direct_dialing) prefix** for the country in question'
                            countryId:
                              type: string
                              description: '**country-code** for the country in question'
                        AX:
                          type: object
                          properties:
                            countryName:
                              type: string
                              description: '**natural-language name** of the country that the country-code identifies'
                            phoneCode:
                              type: string
                              description: '**[International Direct Dialling (IDD)](https://en.wikipedia.org/wiki/International_direct_dialing) prefix** for the country in question'
                            countryId:
                              type: string
                              description: '**country-code** for the country in question'
              examples:
                '1':
                  $ref: '#/components/examples/util-countrymap-example'
  /util/guid:
    get:
      tags:
      - Utility services
      summary: /util/guid
      operationId: utilGuid
      description: This service can be used to generate a GUID if necessary
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: string
                      description: '**[GUID (globally unique identifier)](https://en.wikipedia.org/wiki/Universally_unique_identifier)** for the request'
              examples:
                '1':
                  $ref: '#/components/examples/util-guid-example'
  /util/siteBinaryData:
    post:
      tags:
      - Utility services
      summary: /util/siteBinaryData
      operationId: utilSiteBinaryData
      description: Get partner custom information, such as Logo, Favicon or quick links (only necessary for some partners)
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                partnerCustomTypes:
                  type: array
                  items:
                    type: string
                    enum:
                    - LOGO
                    - LOGO_URL
                    - FAVICON
                    - HEADER_HTML
                    - FOOTER_HTML
                    - CSS
                  description: '- `LOGO` - show base64-encoded data of partner''s logo

                    - `LOGO_URL` - show base64-encoded data of partner''s logo URL

                    - `FAVICON` - show base64-encoded data of partner''s favicon

                    - `HEADER_HTML` - show base64-encoded data of the partner''s header HTML

                    - `FOOTER_HTML` - show base64-encoded data of the partner''s footer HTML

                    - `CSS` - show base64 based data of partner Site CSS

                    '
                  example:
                  - LOGO
                  - LOGO_URL
                  - FAVICON
                  - HEADER_HTML
                  - FOOTER_HTML
                  - CSS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        favicon:
                          type: string
                          description: '**base64-encoded image** of the partner''s favicon'
                        logo:
                          type: string
                          description: '**base64-encoded image** of the partner''s logo'
                        logoUrl:
                          type: string
                          description: '**base64-encoded data** of the partner''s logo URL'
                        headerHtml:
                          type: string
                          description: '**base64-encoded data** of the partner sites header HTML'
                        footerHtml:
                          type: string
                          description: '**base64-encoded data** of the partner site''s footer HTMl'
                        css:
                          type: string
                          description: '**base64-encoded image** of the partner''s site''s CSS'
              examples:
                '1':
                  $ref: '#/components/examples/util-siteBinaryData-example'
components:
  parameters:
    defaultCurrencyCode:
      name: defaultCurrencyCode
      in: query
      description: '**currency code** (default) for pricing

        - countries with standard currencies will default to *this* currency for pricing display prices displayed in this currency as the default currency

        - other countries will default to `''USD''`

        - e.g., Australia would be `''AUD''`; Vietnam would be `''USD''`

        - See: [supported currencies](#section/Appendices/Supported-currency-codes)

        '
      schema:
        type: string
      example: USD
    acceptLanguage:
