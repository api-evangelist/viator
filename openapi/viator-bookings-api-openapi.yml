                          $ref: '#/components/schemas/BookingQuestionUnit'
    PricingLineItem-2:
      type: object
      required:
      - ageBand
      - numberOfTravelers
      - subtotalPrice
      properties:
        ageBand:
          $ref: '#/components/schemas/AgeBand-2'
        numberOfTravelers:
          $ref: '#/components/schemas/NumberOfTravelers'
        subtotalPrice:
          description: Subtotal pricing for this line item.
          allOf:
          - $ref: '#/components/schemas/PricingLineItemPriceSubtotal'
    CancellationConditionType:
      type: string
      description: "Machine-interpretable value encoding the type of cancellation policy for this product; one of:\n\n  - `STANDARD` - Products in this category are cancellable up to 24 hours before the travel date (local supplier time) for a full refund. However, a 100% cancellation penalty applies for cancellations submitted less than 24 hours before the start time. Most products (about 85%) fall into this category.\n  - `ALL_SALES_FINAL` - Products in this category cannot be cancelled or amended without incurring a 100% penalty; i.e., the refund amount will be zero. Around 10% of products fall into this category.\n  - `CUSTOM` - The refund amount for products in this category varies depending on how long before its start time the product is cancelled. Many products on a custom policy are multi-day tours, which require more sophisticated planning on the supplier’s end. Only a small number of products (around 5%) fall into this category.\n\nFor more information, see our in-depth guide about cancellation policies and how to handle cancellations: [All you need to know about cancellation policies](https://partnerresources.viator.com/travel-commerce/merchant/cancellation-policies?source=specs).\n"
    BookingStatusResponseRejected:
      allOf:
      - $ref: '#/components/schemas/BookingStatusResponseCommon'
      - type: object
        properties:
          rejectionReasonCode:
            type: string
            description: "In the case that `status` is `\"REJECTED\"`, this field provides a code as to the reason for the rejection; one of:\n\n  - `\"BOOKABLE_ITEM_IS_NO_LONGER_AVAILABLE\"` – this bookable item is no longer available\n  - `\"WEATHER\"` – this booking was rejected on account of the weather\n  - `\"DUPLICATE_BOOKING\"` – this is a duplicate booking\n  - `\"PRODUCT_NO_LONGER_OPERATING\"` – the product is no longer operating\n  - `\"MINIMUM_NUMBER_OF_PASSENGERS_NOT_MET\"` – there are too few passengers for the product to operate\n  - `\"SIGNIFICANT_GLOBAL_EVENT_FORCE_MAJEURE\"` – the booking was rejected due to a natural disaster or other large-scale catastrophe \n  - `\"TOUR_WAS_CANCELLED\"` – the product was cancelled\n  - `\"ISSUE_WITH_TICKET\"` – there was an issue with the ticket\n  - `\"ISSUE_WITH_PICKUP\"` – there was an issue with pickup\n  - `\"ISSUE_WITH_PAYMENT\"` – the customer’s payment was declined due to an issue trying to process the payment. This could be caused by generic errors, suspected fraud, or incomplete billing information.\n  - `\"INSUFFICIENT_FUNDS\"` - the customer's payment was declined due to insufficient funds\n  - `\"INVALID_PAYMENT_DETAILS\"` - the customer's payment was declined due to invalid payment details\n  - `\"SOFT_DECLINE\"` - the customer’s payment was declined due to fixable issues (eg insufficient funds)\n  - `\"HARD_DECLINE\"` - the customer’s payment was declined due to an error or issue which can't be resolved immediately. Action such a new payment method or the customer contacting their bank will need to be taken to resolve the issue before the transaction can be retried.\n  - `\"THREE_D_SECURE_REQUIRED\"` - the customer’s payment was declined due to unsuccessful authentication through 3DS\n  - `\"INTERNAL_ERROR\"` - the customer’s payment was declined due to an internal error in our system\n  - `\"PROCESSOR_UNAVAILABLE\"` - the customer’s payment was declined due to temporary unavailability on the processor’s end\n  - `\"PROCESSOR_ISSUE_WITH_PAYMENT\"` - the customer’s payment was declined due to an issue on the processor’s end\n  - `\"OTHER\"` – other/unlisted reason\n"
        required:
        - rejectionReasonCode
    ProductOptionCode:
      type: string
      description: 'Product option identifier.


        For more information see: [Key concepts: Product options](#section/Key-concepts/Product-options)

        '
      example: BCLM
    CartReference:
      type: string
      description: '**Viator-generated** unique reference for this cart of bookable items, e.g.`CR-44e4a3f8b65d11edafa10242ac120002`

        '
    QuoteValidUntil:
      type: string
      format: date-time
      description: Timestamp (UTC) indicating when the quote expires.
      example: '2019-04-03T02:54:29.082753Z'
    BookingHoldStatus:
      type: string
      description: 'The status of this bookable item; one of:


        - `BOOKABLE` – This item can currently be booked. Check `bookingHoldInfo` for availability and pricing hold statuses.

        - `REJECTED` – This item is unavailable to be booked.

        '
    AmendmentQuoteRequestCommon:
      type: object
      required:
      - bookingRef
      properties:
        bookingRef:
          $ref: '#/components/schemas/BookingRef'
    StartTime:
      type: string
      description: 'Starting time for the item in the case that the `product`/`product option` has multiple start times.


        **Note**: This element must be included for products that have multiple starting times.

        '
    PriceObjectSubtotal:
      description: Components of this price
      allOf:
      - $ref: '#/components/schemas/PriceObject'
    AmendmentQuoteResponseRejected:
      allOf:
      - $ref: '#/components/schemas/AmendmentQuoteResponseCommon'
      - type: object
        required:
        - rejectionReasonCode
        properties:
          rejectionReasonCode:
            $ref: '#/components/schemas/QuoteRejectionReasonCode'
    TranslationDetails:
      type: object
      description: Information about whether the text in this response was machine-translated
      required:
      - containsMachineTranslatedText
      - translationSource
      properties:
        containsMachineTranslatedText:
          type: boolean
          description: Indicates whether this product description utilizes text in any of its natural language fields that was automatically machine-translated with no human oversight
        translationSource:
          type: string
          description: "One of:\n- `\"MACHINE\"` – The text provided by the supplier is in a **different language** and has been **automatically translated** by our systems with no human oversight.\n- `\"ORIGINAL\"` – The text provided by the supplier is in the language that is standard for their locale.\n- `\"MANUAL\"` – The text provided by the supplier was in a different language to the standard for their locale; however, whether this is a direct translation of the original text (performed either by machine or human) or whether it is a customised description for speakers of this language is not known. \n"
        translationAttribution:
          type: string
          description: "Value specifying the machine-translation service vendor. At present, translation attribution is not a requirement.\n\n  - **Example**: `\"GOOGLE\"`\n"
    AdditionalBookingDetails-2:
      type: object
      description: Optional extra details to include with booking
      properties:
        voucherDetails:
          $ref: '#/components/schemas/VoucherDetails'
    BookingsCartHoldRequest:
      allOf:
      - type: object
        required:
        - currency
        - partnerCartRef
        - items
        properties:
          partnerCartRef:
            $ref: '#/components/schemas/PartnerCartReference'
          currency:
            $ref: '#/components/schemas/Currency'
          items:
            type: array
            description: List of bookable items (Limited to 16)
            items:
              $ref: '#/components/schemas/BookingsCartHoldRequestItem'
          paymentDataSubmissionMode:
            type: string
            description: "Defines the payment solution used to submit payment details, two modes are supported: \n- `PARTNER_FORM` for partners hosting their own payment form.\n- `VIATOR_FORM` for partners using the Viator iframe payment form.\n\n**Note**: This element is only applicable for <u>affiliate partners with API access level \"Full Access + Booking\"</u>. \n"
          hostingUrl:
            type: string
            description: 'The **origin** of the site where the Viator payment form is hosted (the same value the browser exposes as

              `window.location.origin` on that page). Required if `paymentDataSubmissionMode` is set to `VIATOR_FORM`.


              Use **only** the scheme, hostname, and a non-default port when one is in use. **Do not** include a path, query

              string, or fragment. The Viator payment script and the browser compare this value to `window.location.origin`; sending a full

              page URL (for example a checkout path such as `https://example.com/checkout`) will not match and client-side

              validation will fail.


              E.g.: `https://www.yourdomain.com` or `https://www.yourdomain.com:8443` for a non-default port.

              '
    ProductCode:
      type: string
      pattern: (?s).*[\S].*
      description: Unique identifier for this product.
      example: 5657BRIDGECLIMB
    PartnerBookingReference:
      type: string
      description: Partner-generated unique booking reference for this bookable item.
      pattern: (?s).*[\S].*
      maxLength: 100
    BookingsCartBookResponsePendingItem:
      allOf:
      - $ref: '#/components/schemas/BookingsCartBookResponseItemBase'
      - type: object
        properties:
          cancellationPolicy:
            $ref: '#/components/schemas/CancellationPolicy'
    LineItemPriceObject:
      type: object
      required:
      - price
      properties:
        price:
          description: Current price
          allOf:
          - $ref: '#/components/schemas/PriceObject'
        priceBeforeDiscount:
          description: Non-discounted price if `price` has a discount applied to it
          allOf:
          - $ref: '#/components/schemas/PriceObject'
    HoldInfo:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          pattern: (?s).*[\S].*
          description: "Status of the booking hold; one of:\n\n  - `HOLD_NOT_PROVIDED`\n  - `HOLDING`\n"
        validUntil:
          type: string
          format: date-time
          description: Timestamp (UTC) indicating when the booking hold expires.
    BookingStatusResponseCommon:
      type: object
      properties:
        bookingRef:
          type: string
          description: Viator-generated booking reference number
        partnerBookingRef:
          type: string
          description: Partner-generated booking reference number (if sent in the request)
        status:
          type: string
          description: "Indicates the outcome of the booking request; one of:\n\n  - `\"CONFIRMED\"` – the booking has been confirmed\n  - `\"REJECTED\"` – the booking request was declined\n  - `\"CANCELED\"` – the booking has been canceled\n  - `\"PENDING\"` – the booking request has been submitted to the supplier and is awaiting their response\n  - `\"IN_PROGRESS\"` – the booking is still being processed by the booking server\n  - `\"ON_HOLD\"` – booking hold made but no booking request made yet\n  - `\"FAILED\"` – the booking request failed\n"
      required:
      - bookingRef
      - status
    BookingHoldResponse:
      type: object
      required:
      - bookingRef
      - bookingHoldInfo
      properties:
        bookingRef:
          type: string
          pattern: (?s).*[\S].*
          description: "**Viator-generated** booking reference for this booked item in format `BR-123456789` \n\nThis value can be used in the request to:\n  - [/bookings/book](#operation/bookingsBook) (`bookingRef`)\n  - [/bookings/status](#operation/bookingsStatus) (`bookingRef`)\n  - [/bookings/{booking-reference}/cancel-quote](#operation/bookingsCancelQuote) (in-query parameter)\n  - [/bookings/{booking-reference}/cancel](#operation/bookingsCancel) (in-query parameter)\n"
        bookingHoldInfo:
          $ref: '#/components/schemas/BookingHoldInfo'
        currency:
          type: string
          description: "Three-letter currency code for the currency in which pricing information is displayed; one of:\n\n  - `\"USD\"`\n  - `\"CAD\"`\n  - `\"GBP\"`\n  - `\"AUD\"`\n  - `\"EUR\"`\n"
        lineItems:
          type: array
          description: Array of pricing details for each traveler in this booking
          items:
            $ref: '#/components/schemas/PricingLineItem'
        totalPrice:
          description: Details about the total price of this booking
          allOf:
          - $ref: '#/components/schemas/LineItemPriceObject'
        extraChargesSummary:
          $ref: '#/components/schemas/ExtraChargesSummary'
        translationInfo:
          $ref: '#/components/schemas/TranslationDetails'
    VoucherFormat:
      type: string
      pattern: (?s).*[\S].*
      description: "File format of the voucher; one of:\n  - `PDF`\n  - `HTML`\n\nDefault is `HTML` if not specified.\n"
    BookingsCartHoldResponseItemBase:
      type: object
      required:
      - partnerBookingRef
      - bookingRef
      - status
      properties:
        partnerBookingRef:
          $ref: '#/components/schemas/PartnerBookingReference'
        bookingRef:
          $ref: '#/components/schemas/BookingReference'
        status:
          $ref: '#/components/schemas/BookingHoldStatus'
    BookingStatusResponse:
      oneOf:
      - $ref: '#/components/schemas/BookingStatusResponseConfirmed'
      - $ref: '#/components/schemas/BookingStatusResponseTransient'
      - $ref: '#/components/schemas/BookingStatusResponseRejected'
      - $ref: '#/components/schemas/BookingStatusResponseOther'
      discriminator:
        propertyName: status
        mapping:
          CONFIRMED: '#/components/schemas/BookingStatusResponseConfirmed'
          PENDING: '#/components/schemas/BookingStatusResponseTransient'
          REJECTED: '#/components/schemas/BookingStatusResponseRejected'
          CANCELED: '#/components/schemas/BookingStatusResponseOther'
          IN_PROGRESS: '#/components/schemas/BookingStatusResponseTransient'
          ON_HOLD: '#/components/schemas/BookingStatusResponseOther'
          FAILED: '#/components/schemas/BookingStatusResponseOther'
    BookingsCartHoldResponse:
      type: object
      required:
      - cartRef
      - partnerCartRef
      - currency
      - items
      - totalHeldPrice
      properties:
        cartRef:
          $ref: '#/components/schemas/CartReference'
        partnerCartRef:
          $ref: '#/components/schemas/PartnerCartReference'
        currency:
          $ref: '#/components/schemas/Currency'
        items:
          type: array
          description: List of bookable items.
          items:
            oneOf:
            - $ref: '#/components/schemas/BookingsCartHoldResponseBookableItem'
            - $ref: '#/components/schemas/BookingsCartHoldResponseRejectedItem'
            discriminator:
              propertyName: status
              mapping:
                BOOKABLE: '#/components/schemas/BookingsCartHoldResponseBookableItem'
                REJECTED: '#/components/schemas/BookingsCartHoldResponseRejectedItem'
        totalHeldPrice:
          description: The total price of all bookable items.
          allOf:
          - $ref: '#/components/schemas/CartLineItemPrice'
        paymentDataSubmissionUrl:
          type: string
          description: The API URL to provide payment details to the Viator payment gateway. Only returned if `paymentDataSubmissionMode` is set to `PARTNER_FORM`.
        paymentSessionToken:
          type: string
          description: The payment session token, if `paymentDataSubmissionMode` is set, used to facilitate fraud prevention when <a href="https://partnerresources.viator.com/travel-commerce/api-payments/#api" target="_blank">Implementing the API Solution</a> or providing payment details when <a href="https://partnerresources.viator.com/travel-commerce/api-payments/#iframe" target="_blank">Implementing the iFrame Solution</a>.
        extraChargesSummary:
          type: object
          description: Total amount of Extra Charges considering all cart bookable items.
          required:
          - price
          - totalExtraCharges
          properties:
            price:
              type: object
              description: Pricing information applicable to all bookable items including extra charges.
              required:
              - recommendedRetailPrice
              properties:
                recommendedRetailPrice:
                  description: Total RRP including Extra Charges for all cart bookable items.
                  type: number
            productPriceBeforeDiscount:
              type: object
              description: Pricing information applicable to all bookable items including extra charges if no discount had been applied.
              required:
              - recommendedRetailPrice
              properties:
                recommendedRetailPrice:
                  description: Total RRP including Extra Charges for all cart bookable items if no discount had been applied.
                  type: number
            totalExtraCharges:
              type: number
              description: Total Extra Charges for all cart bookable items.
        translationInfo:
          $ref: '#/components/schemas/TranslationDetails'
    AgeBand-2:
      type: string
      pattern: (?s).*[\S].*
      description: "Machine-interpretable value indicating the age-band that this/these\ntraveler(s) fall into; one of:\n\n  - `ADULT`\n  - `SENIOR`\n  - `YOUTH`\n  - `CHILD`\n  - `INFANT`\n  - `TRAVELER`\n\nThe valid age-band identifiers for the product are provided in the `pricingInfo.ageBands[]` array in the [product content response](#section/Key-concepts/Content-ingestion-endpoints). The `TRAVELER` age-band is to be used when the `pricingInfo.type` is `UNIT`; i.e., unit or group pricing.\n\nTo learn more about how to implement age bands, see the following guide: [Implementing age bands & pax mix](https://partnerresources.viator.com/travel-commerce/merchant/agebands-pax-mix?source=specs)\n"
    CancellationPolicy:
      type: object
      description: Cancellation policy details for this product.
      required:
      - type
      - cancelIfBadWeather
      - cancelIfInsufficientTravelers
      - refundEligibility
      properties:
        type:
          $ref: '#/components/schemas/CancellationConditionType'
        description:
          type: string
          description: 'Description of this product''s cancellation policy.


            **Note**: This field contains natural language suitable for display to the user;

            content will be translated (if necessary) into the language specified in the Accept-Language header parameter.

            '
        cancelIfBadWeather:
          type: boolean
          description: '**True** if the supplier of this product may cancel on account of weather conditions.'
        cancelIfInsufficientTravelers:
          type: boolean
          description: '**True** if the supplier of this product can cancel due to too few participants.'
        refundEligibility:
          type: array
          description: Cancellation policy definitions for this product.
          items:
            $ref: '#/components/schemas/CancellationCondition'
    TravelDate:
      type: string
      format: date
      description: 'Date of travel (according to the time zone in which the product operates).

        '
    CancelBookingQuoteResponse:
      type: object
      required:
      - bookingId
      - status
      properties:
        bookingId:
          type: string
          description: 'Booking reference number for this booking

            - **Note**: For bookings made with v1 of this API, this code corresponds to `data.itemSummaries[].itemId` (in the response from v1''s [/booking/book](https://docs.viator.com/partner-api/merchant/technical/#tag/Booking-services/paths/~1booking~1book/post) endpoint) but prepended with `BR-`. For example, if the `itemId` is `580669678`, this field should be `BR-580669678`.

            '
        refundDetails:
          $ref: '#/components/schemas/RefundDetails'
        status:
          $ref: '#/components/schemas/CancellationQuoteBookingStatus'
    LoyaltyProgramDetails:
      type: object
      description: "Additional booking details used to associate partner's Loyalty Program Information with the booking.\n\n**Note**:\n  This data will be used only by Viator’s internal teams (eg, by Customer Service in the event the traveler contacts Viator for any reason).\n"
      properties:
        memberId:
          type: string
          description: A unique identifier assigned to the member of partner’s loyalty program.
          maxLength: 100
        points:
          type: integer
          description: The amount of loyalty points redeemed in this booking.
        totalPriceAfterPoints:
          type: number
          description: Actual amount paid for the booking after redeeming loyalty points.
    AmendmentAmendResponse:
      oneOf:
      - $ref: '#/components/schemas/AmendmentAmendResponseAmended'
      - $ref: '#/components/schemas/AmendmentAmendResponseInProgress'
      - $ref: '#/components/schemas/AmendmentAmendResponseRejected'
      discriminator:
        propertyName: status
        mapping:
          AMENDED: '#/components/schemas/AmendmentAmendResponseAmended'
          IN_PROGRESS: '#/components/schemas/AmendmentAmendResponseInProgress'
          REJECTED: '#/components/schemas/AmendmentAmendResponseRejected'
    PaymentMethod:
      type: object
      description: "Information about the payment method to be used for this transaction.\n\n**Notes:**\n  - The transaction will be processed using the payment method already associated with the booking being amended.\n  - Payment method is only relevant for transactional affiliates.\n"
      required:
      - type
      - identifierType
      - identifier
      properties:
        type:
          type: string
          description: "Payment method type. Possible values:\n  - `CARD`\n\n**Note:** new values may be added over time, allowing flexibility for different use cases.\n"
        identifierType:
          type: string
          description: "Determines how the value of the identifier should be interpreted. One of the following.\n  - `CARD_LAST_FOUR`\n\n**Note:** new values may be added over time, allowing flexibility for different use cases.\n"
        identifier:
          type: string
          description: 'Value which should be used to identify the payment method.

            '
    AmendmentAmendResponseInProgress:
      allOf:
      - $ref: '#/components/schemas/AmendmentAmendResponseCommon'
      - type: object
        properties:
          initialBookingPrice:
            $ref: '#/components/schemas/QuoteInitialPrice'
          quotePriceDifference:
            $ref: '#/components/schemas/QuotePriceDifference'
          amendedBookingPrice:
            $ref: '#/components/schemas/QuoteAmendedPrice'
          currency:
            type: string
            description: 'Currency in which the amendment will be processed.

              **Merchant Partners:** One of `USD`, `EUR`, `GBP`, `AUD`, `CAD`


              **Affiliate Partners with API access level "Full Access + Booking":** One of `USD`, `EUR`, `GBP`, `AUD`, `CAD`,

              `CHF`, `DKK`, `FJD`, `HKD`, `JPY`, `NOK`, `NZD`, `SEK`, `SGD`, `THB`, `ZAR`, `INR`, `BRL`, `TWD`, `MXN`, `CLP`, `IDR`, `ILS`, `KRW`, `PHP`, `PLN`, `TRY`


              **Note:** The currency for all price values will always match the currency used in the original booking.

              '
          paymentMethod:
            $ref: '#/components/schemas/PaymentMethod'
    CancellationReasonsResponse:
      type: object
      properties:
        reasons:
          type: array
          description: Array of cancellation reason codes and their asssociated texts for display to the user
          items:
            $ref: '#/components/schemas/CancellationReason'
    AmendmentCheckResponse:
      type: object
      required:
      - bookingRef
      - isAmendable
      properties:
        bookingRef:
          $ref: '#/components/schemas/BookingRef'
        isAmendable:
          type: boolean
          description: "Indicates whether the booking can be amended.  \nIf `false`, the booking cannot be amended.\n"
        reason:
          type: string
          description: "Machine-interpretable reason code indicating why the amendment can not proceed. One of:\n  - `\"UNSUPPORTED_PRODUCT\"`: This booking cannot be amended due to product configurations\n  - `\"UNSUPPORTED_CANCELLATION_POLICY\"`: The booking cannot be amended because of its cancellation policy\n  - `\"OTHER\"`\n\n**Notes**:\n  - This field will not be present in the response if `isAmendable` is `true`\n  - New values may be added over time, allowing flexibility for different use cases.\n"
        amendmentTypes:
          $ref: '#/components/schemas/AmendmentTypes'
        paxMixSummary:
          $ref: '#/components/schemas/PaxMixSummary'
    CancellationBookingStatus:
      type: string
      description: "Machine-interpretable string indicating the outcome of the booking cancellation request. One of: \n\n  - `\"ACCEPTED\"`: The cancellation was successful\n  - `\"DECLINED\"`: The cancellation failed\n"
