      properties:
        price:
          $ref: '#/components/schemas/PriceObjectSubtotal'
        priceBeforeDiscount:
          $ref: '#/components/schemas/PriceObjectSubtotal'
    BookingQuestionAnswers:
      type: object
      required:
      - question
      - answer
      properties:
        question:
          type: string
          pattern: (?s).*[\S].*
          description: "Booking question identifier - `id` field in response from [/products/booking-questions](#operation/productsBookingQuestions) endpoint.\nPossible values:\n\n  - `DATE_OF_BIRTH`\n  - `HEIGHT`\n  - `PASSPORT_EXPIRY`\n  - `PASSPORT_NATIONALITY`\n  - `PASSPORT_PASSPORT_NO`\n  - `PICKUP_POINT`\n  - `TRANSFER_AIR_ARRIVAL_AIRLINE`\n  - `TRANSFER_AIR_ARRIVAL_FLIGHT_NO`\n  - `TRANSFER_AIR_DEPARTURE_AIRLINE`\n  - `TRANSFER_AIR_DEPARTURE_FLIGHT_NO`\n  - `TRANSFER_ARRIVAL_DROP_OFF`\n  - `TRANSFER_ARRIVAL_TIME`\n  - `TRANSFER_DEPARTURE_DATE`\n  - `TRANSFER_DEPARTURE_PICKUP`\n  - `TRANSFER_DEPARTURE_TIME`\n  - `TRANSFER_PORT_ARRIVAL_TIME`\n  - `TRANSFER_PORT_CRUISE_SHIP`\n  - `TRANSFER_PORT_DEPARTURE_TIME`\n  - `TRANSFER_RAIL_ARRIVAL_LINE`\n  - `TRANSFER_RAIL_ARRIVAL_STATION`\n  - `TRANSFER_RAIL_DEPARTURE_LINE`\n  - `TRANSFER_RAIL_DEPARTURE_STATION`\n  - `WEIGHT`\n  - `FULL_NAMES_FIRST`\n  - `FULL_NAMES_LAST`\n  - `DISEMBARKATION_TIME`\n  - `SPECIAL_REQUIREMENTS`\n  - `AGEBAND`\n  - `TRANSFER_ARRIVAL_MODE`\n  - `TRANSFER_DEPARTURE_MODE`\n"
        answer:
          type: string
          description: 'Answer to the booking question.


            **Note**: Emojis are not supported in this field; therefore, please ensure that only ordinary natural-language characters and numerals are included.

            '
        unit:
          type: string
          description: Unit in which the answer is provided; one of `units` in response from [/products/booking-questions](#operation/productsBookingQuestions) endpoint.
        travelerNum:
          description: Number of the traveler to which this booking question answer pertains.
          type: integer
    CancellationResultItemReason:
      type: string
      description: "Machine-interpretable reason code indicating why the cancellation was not successful\n\n  - `\"ALREADY_CANCELLED\"`: The booking has already been cancelled\n  - `\"NOT_CANCELLABLE\"`: The booking cannot be canceled because the product start time was in the past\n\n\n**Note**: This field will not be present in the response if the cancellation was successful\n"
    AmendPerTravelerQuestions:
      type: object
      title: Per Traveler Questions
      allOf:
      - $ref: '#/components/schemas/AmendmentQuoteRequestCommon'
      - type: object
        required:
