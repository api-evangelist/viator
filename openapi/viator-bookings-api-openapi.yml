          items:
            $ref: '#/components/schemas/BookingsCartBookRequestItem'
        paymentToken:
          type: string
          description: The payment token obtained from the payments endpoint or from the iframe Javascript library.
    AmendmentAmendResponseRejected:
      allOf:
