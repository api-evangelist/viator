            required:
            - travelerNum
            - bookingQuestions
            properties:
              travelerNum:
                type: integer
                description: 'Traveler number identifying the traveler to be amended.

                  '
              bookingQuestions:
                type: object
                description: 'Booking questions for the existing traveler (pax mix).

                  '
                required:
                - question
                - answer
                properties:
                  question:
                    type: string
                    pattern: (?s).*[\S].*
                    description: "Booking question to be amended. Identifier - `id` field in response from [/products/booking-questions](#operation/productsBookingQuestions) endpoint. Possible values:\n  - `DATE_OF_BIRTH`\n  - `HEIGHT`\n  - `PASSPORT_EXPIRY`\n  - `PASSPORT_NATIONALITY`\n  - `PASSPORT_PASSPORT_NO`\n  - `WEIGHT`\n  - `FULL_NAMES_FIRST`\n  - `FULL_NAMES_LAST`\n\n**Note**: only the Booking questions on the list provided are eligible to be amended\n"
                  answer:
                    type: string
                    description: 'Amended answer to the booking question.


                      **Note**: Emojis are not supported in this field; therefore, please ensure that only ordinary natural-language characters and numerals are included.

                      '
                  unit:
                    $ref: '#/components/schemas/BookingQuestionUnit'
    BookingsCartBookResponseRejectedItem:
      allOf:
      - $ref: '#/components/schemas/BookingsCartBookResponseItemBase'
      - type: object
        required:
        - rejectionReasonCode
        properties:
          rejectionReasonCode:
            $ref: '#/components/schemas/CartBookRejectionReasonCode'
    AmendmentStatus:
      type: string
      description: "Machine-interpretable string indicating the outcome of the booking amendment request. One of:\n  - `AMENDED`: The amendment was successful\n  - `REJECTED`: The amendment was rejected\n  - `PENDING`: The amendment is pending\n\n**Note**: If booking has been amended multiple times, this field will only reflect the latest amendment request status (ie, if the booking was amended once and a second amendment request is rejected, the amendment status response will be `REJECTED`)\n"
    BookingsCartBookResponseConfirmedItem:
