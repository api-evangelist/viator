            '
        refundDetails:
          allOf:
          - $ref: '#/components/schemas/RefundDetails'
          - type: object
            description: Details of the refund
            properties:
              refundPercentage:
                description: "Percentage of the item price that will be refunded. \n\n**Note**: Because the cancellation was carried out by the supplier, this will always be `100`.\n"
              refundAmount:
                description: Numeric currency amount that will be refunded
    BookingsCartBookResponseItemBase:
      type: object
