    BookingReference:
      type: string
      description: Unique Viator-generated booking reference for this bookable item.
      example: BR-23345456
    QuoteInitialPrice:
      type: number
      description: Total price of the booking at the time of purchase.
    PartnerNetPrice-2:
      type: number
      description: 'The non-booking fee component of the amount that Viator will invoice the merchant.



        For affiliate partners with API access level "Full Access + Booking" this is the amount Viator charges exclusive of commission.

        '
    BookingEvent:
      type: object
      required:
      - transactionRef
      - eventType
      - acknowledgeBy
      - bookingRef
      - partnerBookingRef
      - lastUpdated
      - bookedItem
      properties:
        transactionRef:
          type: string
          description: "A unique reference code for this booking event notification. \n\nExample: `\"PBE-e60bb92c-f1fc-11ec-b939-0242ac120002\"`\n"
        campaignValue:
          type: string
          description: '**Affiliate partners only:** Specifies the campaign tracking identifier that was appended to the URL returned in productUrl as a query parameter. Campaigns allow you to track how specific links perform, with metrics such as sessions, bookings, and commission.

            '
        eventType:
          type: string
          description: "The type of this booking notification event\n\nOne of: \n  - `\"CONFIRMATION\"` - The booking was confirmed\n  - `\"REJECTION\"` - The booking was rejected by the supplier\n  - `\"AMENDMENT\"` - The booking was amended. Amendments actioned via /bookings/amendment/amend endpoint will not be returned\n  - `\"CANCELLATION\"` - The booking was canceled by the supplier\n  - `\"CUSTOMER_CANCELLATION\"` - The booking was canceled by the customer. Cancellations initiated by the Customer and actioned via [/bookings/{booking-reference}/cancel](#operation/bookingsCancel) endpoint will not be returned\n\nNotes: \n- By default, the response will **not** include events **initiated via the API.** Bookings, Cancellations and Amendments made through the API will not be returned. Rejections of API bookings are also excluded.\n"
        bookingRef:
          type: string
          description: 'The Viator-generated-booking-reference code for the booking to which this event notification pertains


            **Example**: `"BR-204104078"`

            '
        partnerBookingRef:
          type: string
          description: 'The partner-nominated-booking-reference code for the booking to which this event notification pertains


            **Note:** For Affiliates with Basic or Full API access, this returns the same value as `bookingRef`, without the `BR-` prefix

            '
        lastUpdated:
          type: string
          format: date-time
          description: 'Timestamp indicating when this booking event occurred. This can be used for the value of the `modified-since` query parameter in a request to this endpoint.

            '
        acknowledgeBy:
          type: string
          format: date-time
          description: 'Timestamp for the point in time before which this event notification must be acknowledged by the merchant partner (using the [/bookings/modified-since/acknowledge](#operation/bookingsModifiedSinceAcknowledge) endpoint) to take ownership of the customer-communications responsibilities resulting from this event. It only applies to Supplier cancellations.


            Notes:

            - It only applies to Supplier cancellations.

            - No action required for eventTypes: CONFIRMATION, REJECTION, AMENDMENT, CUSTOMER_CANCELLATION

            '
        bookedItem:
          allOf:
          - type: object
            description: Details about the booked item to which this event notification pertains
          - $ref: '#/components/schemas/BookingEventItem'
        cancellation:
          allOf:
          - type: object
            description: "Details about the supplier-initiated-booking-cancellation event\n\n**Notes**: \n- This element is only returned when `eventType` is `\"CANCELLATION\"`\n- This element is not returned for Affiliate with API access level Basic or Full\n"
          - $ref: '#/components/schemas/BookingEventCancellation'
    BookingsModifiedSinceResponse:
      type: object
      required:
      - bookings
      properties:
        bookings:
          type: array
          description: List of booking event notifications
          items:
            $ref: '#/components/schemas/BookingEvent'
        nextCursor:
