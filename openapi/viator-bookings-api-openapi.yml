          type: array
          items:
            type: string
    BookingStatusResponseOther:
      allOf:
      - $ref: '#/components/schemas/BookingStatusResponseCommon'
    CartBookCommunicationInfo:
      type: object
      required:
      - phone
      description: 'Details for correspondence regarding this booking.


        **See**: [Booking concepts – Supplier communications](#section/Booking-concepts/Supplier-communications) for information about closed-loop communication.

        '
      properties:
        phone:
          type: string
          pattern: ^[+](?s).*[\S].*
          maxLength: 30
          description: 'Telephone number to be used for correspondence from the supplier regarding the booking. This can be a mobile or land-line number and should be the phone number at which the booker is most easily contactable.


            **Note**: You must perform some additional validation to ensure that this field is correctly formatted prior to sending the booking request. It is essential that this string include the plus `+` symbol at the beginning, followed by the country code, followed by the remaining numerals. Spaces, hyphens and parentheses can be included or omitted, but the string **must** start with the plus symbol and country code; e.g. `+61 400 580 860`.

            '
        email:
          type: string
          maxLength: 200
          description: "Email address of the customer to be used for correspondence from the supplier regarding the booking. For affiliate partners with API access level \"Full Access + Booking\" email field is required.\n\n**Note**: \n- Including this field enables CLC between supplier and customer. \n- For Merchant partners, omitting the field will result in supplier communications being sent only to your customer support address.\n- For partners with API access level \"Full Access + Booking\", if multiple email addresses are provided, the traveler’s email address should always be in the first position.\n- When providing multiple email addresses in this field, all email addresses must be separated by a comma.\n"
    BookingsCartBookRequest:
