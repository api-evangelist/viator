        trackingId:
          type: string
          description: "Tracking identifier for this error response. \n\n**Example**: `\"0A871A13:DE2A_0A8712F9:01BB_5DCCC98C_260DAA:0D5B\"`\n"
    FraudPreventionDetails:
      type: object
      description: 'Additional booking details used to enhance fraud detection accuracy.


        **Note**: Fraud Prevention Details only apply to <u>affiliate partners with API access level "Full Access + Booking"</u>.

        '
      properties:
        subChannelId:
          type: string
          description: For partners that operate multiple channels, a unique identifier of the channel making the booking. (i.e. different websites)
          maxLength: 100
        agencyId:
          type: string
          description: For partners that operate multiple agencies, a unique identifier representing the agency making the booking. (i.e. Agencies in different geographic locations)
          maxLength: 100
        agentId:
          type: string
          description: For partners that have agents making bookings, a unique identifier for the agent making the booking.
          maxLength: 100
        voucherDeliveryType:
          type: string
          description: "Method of voucher delivery. One of: \n  - `EMAIL_TO_CUSTOMER` - The voucher is emailed only to the customer.\n  - `EMAIL_TO_AGENT` - The voucher is emailed only to the agent making the booking on behalf of the customer.\n  - `EMAIL_TO_CUSTOMER_AND_AGENT` - The voucher is emailed to both the customer and agent making the booking on behalf of the customer.\n"
        customerMemberSince:
          type: string
          format: date
          description: For partners whose customers have a membership with the partner and the customer is making the booking, the date when the customer first became a member. e.g. `2019-09-17`
          example: '2019-09-17'
    PriceObject:
