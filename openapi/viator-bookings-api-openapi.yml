    ## Updates


    ### Latest updates:


    | Date | Description…'
  version: '2.0'
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/au/
servers:
- url: https://api.viator.com/partner
  description: Production server (uses live data)
- url: https://api.sandbox.viator.com/partner
  description: Sandbox server (uses test data)
security:
- API-key: []
tags:
- name: Bookings
paths:
  /bookings/cart/hold:
    post:
      tags:
      - Bookings
      operationId: bookingsCartHold
      summary: /bookings/cart/hold
      description: 'Requests the creation of a hold for each item in the cart.


        A hold is a guarantee that either the price or availability (or both) of the product will be retained until a booking

        request is made using the /bookings/cart/book endpoint.


        A hold consists of two components - **availability** and **pricing**. The response to this service indicates whether one, both or neither has been granted, and until when for each item.


        - The length of time for which the availability hold will be granted is determined by the supplier, and therefore varies between products.

        - The length of time for the pricing hold is determined by Viator, and is therefore standard across all products.


        This endpoint must not be used to check availability of a product. Instead, always use the /availability/check endpoint to perform the final availability check.


        **Note**: This endpoint is only available to affiliate partners with API access level "Full Access + Booking" and merchant partners.'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/accept'
      requestBody:
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/BookingsCartHoldRequest'
            examples:
              viator-form:
                $ref: '#/components/examples/bookings-cart-hold-request-viator-form-example'
              partner-form:
                $ref: '#/components/examples/bookings-cart-hold-request-partner-form-example'
              merchant:
                $ref: '#/components/examples/bookings-cart-hold-request-merchant-example'
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/BookingsCartHoldResponse'
              examples:
                viator-form:
                  $ref: '#/components/examples/bookings-cart-hold-response-viator-form-example'
                partner-form:
                  $ref: '#/components/examples/bookings-cart-hold-response-partner-form-example'
                merchant:
                  $ref: '#/components/examples/bookings-cart-hold-response-merchant-example'
                Extra Charges:
                  $ref: '#/components/examples/bookings-cart-hold-response-extra-charges-example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings/cart/book:
    post:
      tags:
      - Bookings
      operationId: bookingsCartBook
      summary: /bookings/cart/book
      description: 'Requests a booking for each item in the cart.


        - As some products are booked on external supplier systems, it may take > 90s to receive a response from this endpoint. For this reason, we recommend setting your internal time-out for this service to **120s**.

        In the event that this service does time-out, or you receive a HTTP 500 error, you should check the status of the booking using the /bookings/status endpoint to ensure the booking was not created before you attempt to make the booking again.

        - The status of each item will indicate if the item booking:

        - is still awaiting confirmation (`PENDING`); or,

        - was `CONFIRMED` if it was eventually successful, or

        - was `REJECTED` if there are valid reasons why it could not be booked; such as, if it was booked-out or other changes to availability occurred; or,

        - failed for an unknown reason if it did eventually fail. In this scenario, a new booking can be attempted using a new `partnerBookingRef`


        **Note**: This endpoint is only available to affiliate partners with API access level "Full Access + Booking" and merchant partners.'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/accept'
      requestBody:
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/BookingsCartBookRequest'
            examples:
              viator-form:
                $ref: '#/components/examples/bookings-cart-book-request-viator-form-example'
              partner-form:
                $ref: '#/components/examples/bookings-cart-book-request-partner-form-example'
              merchant:
                $ref: '#/components/examples/bookings-cart-book-request-merchant-example'
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/BookingsCartBookResponse'
              examples:
                viator-form:
                  $ref: '#/components/examples/bookings-cart-book-response-viator-form-example'
                partner-form:
                  $ref: '#/components/examples/bookings-cart-book-response-partner-form-example'
                merchant:
                  $ref: '#/components/examples/bookings-cart-book-response-merchant-example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings/hold:
    post:
      tags:
      - Bookings
      description: '**Note**: This endpoint is only available to merchant partners.


        Requests the creation of a booking-hold - a guarantee that either the price

        or availability (or both) of the product will be retained until a booking

        request is made using the /bookings/book

        endpoint.


        The booking-hold consists of two components - **availability** and

        **pricing**. The response to this service indicates whether one, both or

        neither has been granted, and until when.


        - The length of time for which the availability hold will be granted is determined by the supplier, and therefore varies between products.


        - The length of time for the pricing-hold is determined by Viator, and is therefore standard across all products.


        This endpoint must not be used to check availability of a product. Instead, always use the /availability/check endpoint to perform the final availability check.


        (Response sample generated on: 2020-08-25)'
      operationId: bookingsHold
      summary: /bookings/hold
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/accept'
      - $ref: '#/components/parameters/exp-demo'
      requestBody:
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/BookingHoldRequest'
            example:
              productCode: 3857NYCNIA
              productOptionCode: NIA
              travelDate: '2021-04-01'
              currency: AUD
              startTime: 06:30
              paxMix:
              - ageBand: ADULT
                numberOfTravelers: 2
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/BookingHoldResponse'
              examples:
                '1':
                  $ref: '#/components/examples/bookings-hold-example'
                extra charges:
                  $ref: '#/components/examples/bookings-hold-extra-charges-example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings/book:
    post:
      tags:
      - Bookings
      summary: /bookings/book
      description: 'Requests a booking for a product.


        **Note**:

        - This endpoint is only available to merchant partners.

        - The amount that you will be invoiced for the sale of this tour (in the specified currency) is given in the `totalPrice` element in the response from this endpoint.

        - As some products are booked on external supplier systems, it may take > 90s to receive a response from this endpoint. For this reason, we recommend setting your internal time-out for this service to **120s**. In the event that this service does time-out, or you receive a HTTP 500 error, you should check the status of the booking using the /bookings/status endpoint to ensure the booking was not created before you attempt to make the booking again.

        - The booking status will indicate if the booking:

        - is still awaiting confirmation (`"PENDING"`); or,

        - was `"CONFIRMED"` if it was eventually successful, or

        - was `"REJECTED"` if there are valid reasons why it could not be booked; such as, if it was booked-out or other changes to availability occurred; or,

        - failed for an unknown reason if it did eventually fail. In this scenario, a new booking can be attempted using a new `"partnerBookingRef"`


        (Response sample generated on: 2020-08-25)'
      operationId: bookingsBook
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/accept'
      - $ref: '#/components/parameters/exp-demo'
      requestBody:
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/BookingBookRequest'
            example:
              productCode: 5010SYDNEY
              productOptionCode: 48HOUR
              currency: AUD
              partnerBookingRef: BR-581567752
              travelDate: '2020-11-30'
              paxMix:
              - ageBand: ADULT
                numberOfTravelers: 1
              languageGuide:
                type: AUDIO
                language: en
                legacyGuide: en/SERVICE_AUDIO
              bookingRef: BR-581567752
              bookerInfo:
                firstName: Simon
                lastName: Nettle
              bookingQuestionAnswers:
              - question: AGEBAND
                answer: ADULT
                travelerNum: 1
              - question: FULL_NAMES_LAST
                answer: Nettle
                travelerNum: 1
              - question: FULL_NAMES_FIRST
                answer: Simon
                travelerNum: 1
              - question: SPECIAL_REQUIREMENTS
                answer: 'NO'
                travelerNum: 1
              communication:
                email: snettle@tripadvisor.com
                phone: +61 431532778
              additionalBookingDetails:
                voucherDetails:
                  companyName: Booking King
                  email: support@bookingking.com
                  phone: '+61400500600'
                  voucherText: For any enquiries, please visit our customer support page at https://support.bookingking.com
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/BookingBookResponse'
              examples:
                '1':
                  $ref: '#/components/examples/bookings-book-example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings/status:
    post:
      tags:
      - Bookings
      summary: /bookings/status
      description: '**Note**: This endpoint is only available to affiliate partners with API access level "Full Access + Booking" and merchant partners.


        Requests the status of an existing booking using either the Viator-generated booking reference (`bookingRef`) or the reference generated by the partner (`partnerBookingRef`). For bookings made through v1 endpoints, only Viator-generated booking reference is supported.


        Checking the status of a booking is only necessary to retrieve updates on:


        - manual confirmation products status

        - bookings that were left in `"PENDING"`/`"IN_PROGRESS"` status at time of /booking call for other reasons

        - bookings that timed out at time of /booking call

        - amendments that were left in `"IN_PROGRESS"` status at time of /amend call


        The endpoint should only be called intermittently and based on the cadence recommended at nextPollAt. To avoid unnecessary calls, do not poll the endpoint before the next recommended polling time, as no updates will be returned.


        (Response sample generated on: 2020-11-10)'
      operationId: bookingsStatus
      parameters:
      - $ref: '#/components/parameters/accept'
      - $ref: '#/components/parameters/optionalAcceptLanguage'
      requestBody:
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/BookingStatusRequest'
            example:
              bookingRef: BR-791143912
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/BookingStatusResponse'
              examples:
                '1':
                  $ref: '#/components/examples/bookings-status-example'
                '2':
                  $ref: '#/components/examples/bookings-status-pending-example'
                '3':
                  $ref: '#/components/examples/bookings-status-example-2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings/cancel-reasons:
    get:
      tags:
      - Bookings
      description: 'Retrieves a dictionary of unique identification codes (`cancellationReasonCode`) and their associated natural-language descriptions (`cancellationReasonText`). Cancellation reasons should be cached and refreshed monthly.

        **Note**:

        - This endpoint is only available to affiliate partners with API access level "Full Access + Booking" and merchant partners.

        - As the data returned by this endpoint may change from time to time, it is recommended that you retrieve the latest cancellation reasons at a fixed cadence – we recommend monthly. For more information, see: Update frequency.


        (Response sample generated on: 2022-07-22)'
      operationId: bookingsCancelReasons
      summary: /bookings/cancel-reasons
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/accept'
      - name: type
        in: query
        description: 'Specifies which set of cancellation reasons to retrieve; one of:


          - `"CUSTOMER"` – (default) gets the set of **customer**-initiated cancellation reasons (for use with the [/bookings/{booking-reference}/cancel](#operation/bookingsCancel) endpoint)

          - `"SUPPLIER"` – gets the set of **supplier**-initiated cancellation reasons (for use with the [/bookings/modified-since](#operation/bookingsModifiedSince) endpoint)

          '
        required: false
        schema:
          type: string
          default: CUSTOMER
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/CancellationReasonsResponse'
              examples:
                '1':
                  $ref: '#/components/examples/bookings-cancel-reasons-example'
                '2':
                  $ref: '#/components/examples/bookings-cancel-reasons-example-2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings/{booking-reference}/cancel-quote:
    get:
      tags:
      - Bookings
      description: 'Gets the cancellation quote for an existing booking.


        **Note**: This endpoint is only available to affiliate partners with API access level "Full Access + Booking" and merchant partners.


        For more information about how to perform cancellations using this API, see the Cancellation API workflow section and our in-depth guide about cancellation policies and how to handle cancellations: All you need to know about cancellation policies.


        (Response sample generated on: 2020-08-25)'
      operationId: bookingsCancelQuote
      summary: /bookings/{booking-reference}/cancel-quote
      parameters:
      - $ref: '#/components/parameters/accept'
      - name: booking-reference
        in: path
        required: true
        description: 'The booking reference code (in format `BR-123456789`, which is generated by Viator and returned in the `bookingRef` element in the response from [/bookings/book](#operation/bookingsBook)) of the booking for which to retrieve a cancellation quote

          '
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/CancelBookingQuoteResponse'
              examples:
                '1':
                  $ref: '#/components/examples/bookings-cancel-quote-example'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings/{booking-reference}/cancel:
    post:
      tags:
      - Bookings
      description: 'Cancels existing booking with given Viator-generated booking-reference


        **Note**: This endpoint is only available to affiliate partners with API access level "Full Access + Booking" and merchant partners.


        For more information about how to perform cancellations using this API, see the Cancellation API workflow section and our in-depth guide about cancellation policies and how to handle cancellations: All you need to know about cancellation policies.


        (Response sample generated on: 2020-08-25)'
      operationId: bookingsCancel
      summary: /bookings/{booking-reference}/cancel
      parameters:
      - name: booking-reference
        in: path
        required: true
        description: 'The booking reference code (in format `BR-123456789`, which is generated by Viator and returned in the `bookingRef` element in the response from [/bookings/book](#operation/bookingsBook)) of the booking for which to request cancellation

          '
        schema:
          type: string
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/accept'
      requestBody:
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
            example:
              reasonCode: Customer_Service.I_canceled_my_entire_trip
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/CancelBookingResponse'
              examples:
                '1':
                  $ref: '#/components/examples/bookings-cancel-example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings/modified-since:
    get:
      tags:
      - Bookings
      summary: /bookings/modified-since
      description: 'Gets all booking-event notifications relevant to the partner since a point in time indicated by a timestamp or pagination cursor. This endpoint should be polled hourly, except in supplier cancellation scenarios, in which case polling should occur every 5 minutes.


        **Merchant partners only:** In order to stop notification emails sent by Viator for **supplier cancellations of bookings made through the API** you must **poll this endpoint every 5 minutes** and send an acknowledge using

        /bookings/modified-since/acknowledge endpoint. See the guide on how to automate the flow for supplier cancellations in this article: Automating supplier cancellations in V.2 Partner API.

        Viator will not send notification emails to partners for customer-initiated cancellations.


        **Affiliate partners only:** affiliate partners with API access level Basic or Full will only have access to events of bookings made past September 2025. Whitelabel affiliate partners will only have access to events of bookings made past December 2025.'
      operationId: bookingsModifiedSince
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/accept'
      - name: modified-since
        in: query
        description: "Only retrieve booking events that have occurred since the point in time indicated by this timestamp.\n\n**Note**: \n\n- As this is a query parameter, colons (i.e., `:`) in the timestamp should be URL-encoded as `%3A`; e.g.: \"`2020-09-30T00%3A00%3A01.737043Z`\"\n- Using this parameter is <u>not recommended</u> as the standard pagination method; instead, we recommend using the `cursor` parameter to ensure all booking event notifications are captured.\n"
        required: false
        schema:
          type: string
          format: date-time
          pattern: ^(-?(?:[1-9][0-9]*)?[0-9]{4})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9])T(2[0-3]|[01][0-9])\%3A([0-5][0-9])\%3A([0-5][0-9])(\.[0-9]+)?(Z|[+-](?:2[0-3]|[01][0-9]):[0-5][0-9])?$
      - name: cursor
        in: query
        description: 'Pagination cursor received from a previous call to **this** endpoint that points to the starting point for the next page of results.


          **Note**: Pagination will come into play when the number of results exceeds the figure given in the `count` parameter. In this case, pass the content of the `nextCursor` element for the value of `cursor` to receive the next page of results. The final page of results will not include the `nextCursor` element.

          '
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: 'Specifies the maximum number of booking events to be included in each page of results returned from this endpoint.

          '
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
