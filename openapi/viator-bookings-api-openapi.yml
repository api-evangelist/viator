          description: Total amount of all Extra Charges for a given item.
        inDestination:
          $ref: '#/components/schemas/ExtraChargesItemInDestinationCurrency'
    AmendmentLineItemPriceObject:
      type: object
      required:
      - price
      properties:
        price:
          type: object
          description: Current price
          required:
          - recommendedRetailPrice
          - partnerNetPrice
          - bookingFee
          - partnerTotalPrice
          properties:
            recommendedRetailPrice:
              $ref: '#/components/schemas/RecommendedRetailPrice'
            partnerNetPrice:
              type: number
              description: "The non-booking fee component of the total amount that Viator will invoice the merchant for this item.  \n\nFor <u>affiliate partners with API access level \"Full Access + Booking\"</u> this is the amount Viator charges exclusive of commission.\n"
            bookingFee:
              type: number
              description: "The booking fee component of the total amount that Viator will invoice the merchant for the sale of this item.  \n\n**Note**:\n  - The rate applied is given in the merchant's contract with Viator.\n  - This element is only relevant to <u>merchant partners</u> using the <u>markup pricing model</u>\n"
            commission:
              type: number
              description: "The amount the merchant will receive as a commission for the sale of this item.  \n\nNote: This element is only relevant to <u>merchant partners</u> using the <u>commission-based pricing model</u> and <u>affiliate partners with API access level \"Full Access + Booking\"</u>.\n"
            partnerTotalPrice:
              type: number
              description: "The total amount that Viator will invoice the merchant for the sale of this item.  \n\nFor <u>affiliate partners with API access level \"Full Access + Booking\"</u> this is the total amount that Viator charges exclusive of commission.  \n\nSee the following article to learn more about how pricing works in this API: [Calculating Product Pricing](https://partnerresources.viator.com/travel-commerce/merchant/pricing?source=specs).\n"
    CartPrice:
      type: object
      required:
      - recommendedRetailPrice
      - partnerNetPrice
      - partnerTotalPrice
      - bookingFee
      - commission
      properties:
        recommendedRetailPrice:
          $ref: '#/components/schemas/RecommendedRetailPrice-2'
        partnerNetPrice:
          $ref: '#/components/schemas/PartnerNetPrice-2'
        bookingFee:
          type: number
          description: "The booking fee component of the amount that Viator will invoice the merchant for the sale of this item.\n\n**Note:**\n  - The rate applied is given in the merchant's contract with Viator.\n  - This element is only relevant to <u>merchant partners</u> using the <u>markup pricing model</u>\n"
        commission:
          type: number
          description: 'The amount the merchant or affiliate  will receive as a commission for the sale of this item.



            **Note:** This element is only relevant to merchant partners using the commission-based pricing model and affiliate partners with API access level "Full Access + Booking".

            '
        partnerTotalPrice:
          type: number
          description: 'The total amount that Viator will invoice the merchant for the sale of this item.



            For affiliate partners with API access level "Full Access + Booking" this is the total amount that Viator charges exclusive of commission.



            See the following article to learn more about how pricing works in this API: [Calculating Product Pricing](https://partnerresources.viator.com/travel-commerce/merchant/pricing?source=specs)

            '
    BookingsCartResponseItemPrice:
      type: object
      required:
      - lineItems
      - itemTotalPrice
      properties:
        lineItems:
          type: array
          description: List of pricing details for each age band in this bookable item.
          items:
            $ref: '#/components/schemas/PricingLineItem-2'
        itemTotalPrice:
          description: Details about the total price of this item.
          allOf:
          - $ref: '#/components/schemas/CartLineItemPrice'
    RecommendedRetailPrice-2:
      type: number
      description: The recommended retail price for the item and the price at which the product is sold on the Viator.com site.
    PricingLineItem:
      type: object
      required:
      - numberOfTravelers
      - subtotalPrice
      properties:
        ageBand:
          type: string
          description: "Machine-interpretable value indicating the age-band of the travelers that\nthis line-item describes the subtotal price for; one of:\n\n  - `\"TRAVELER\"`\n  - `\"ADULT\"`\n  - `\"CHILD\"`\n  - `\"YOUTH\"`\n  - `\"INFANT\"`\n  - `\"SENIOR\"`\n\n  To learn more about how to implement age bands, see the following guide: [Implementing age bands & pax mix](https://partnerresources.viator.com/travel-commerce/merchant/agebands-pax-mix?source=specs)\n"
        numberOfTravelers:
          $ref: '#/components/schemas/NumberOfTravelers'
        subtotalPrice:
          $ref: '#/components/schemas/LineItemPriceObjectSubtotal'
    PaxMixItem:
      type: object
      required:
      - ageBand
      - numberOfTravelers
      properties:
        ageBand:
          type: string
          pattern: (?s).*[\S].*
          description: "Machine-interpretable value indicating the age-band that this/these\ntraveler(s) fall into; one of:\n\n  - `\"ADULT\"`\n  - `\"SENIOR\"`\n  - `\"YOUTH\"`\n  - `\"CHILD\"`\n  - `\"INFANT\"`\n  - `\"TRAVELER\"`\n\nThe valid age-band identifiers for the product are provided in the `pricingInfo.ageBands[]` array in the [product content response](#section/Key-concepts/Content-ingestion-endpoints). The `\"TRAVELER\"` age-band is to be used when the `pricingInfo.type` is `\"UNIT\"`; i.e., unit or group pricing.\n\nTo learn more about how to implement age bands, see the following guide: [Implementing age bands & pax mix](https://partnerresources.viator.com/travel-commerce/merchant/agebands-pax-mix?source=specs)\n"
        numberOfTravelers:
          type: integer
          description: Number of travelers/passengers in this age-band
    CommunicationInfo:
      type: object
      required:
      - phone
      description: 'Details for correspondence regarding this booking.


        **See**: [Booking concepts – Supplier communications](#section/Booking-concepts/Supplier-communications) for information about closed-loop communication.

        '
      properties:
        phone:
          type: string
          pattern: ^[+](?s).*[\S].*
          maxLength: 30
          description: 'Telephone number to be used for correspondence from the supplier regarding the booking. This can be a mobile or land-line number and should be the phone number at which the booker is most easily contactable.


            **Note**: You must perform some additional validation to ensure that this field is correctly formatted prior to sending the booking request. It is essential that this string include the plus `+` symbol at the beginning, followed by the country code, followed by the remaining numerals. Spaces, hyphens and parentheses can be included or omitted, but the string **must** start with the plus symbol and country code; e.g. `+61 400 580 860`.

            '
        email:
          type: string
          maxLength: 200
          description: 'Email addresses to be used for correspondence from the supplier regarding the booking.


            **Note**: Including this field enables CLC between supplier and the email(s) provided in the booking request; omitting the field will result in supplier communications being sent only to your customer support address.


            To have a CC of each message a supplier sends to their customer sent to your (the partner''s) customer support email address (in case further assistance is required) you must include your customer support email address in the email field, after the customer''s email and separated from that address with a comma.

            '
    CartBookRejectionReasonCode:
      type: string
      description: "In the case that `status` is `REJECTED`, this field provides a code as to the reason for the rejection; one of:\n\n  - `\"BOOKABLE_ITEM_IS_NO_LONGER_AVAILABLE\"` – this bookable item is no longer available\n  - `\"DUPLICATE_BOOKING\"` – this is a duplicate booking\n  - `\"ISSUE_WITH_PAYMENT\"` – the customer’s payment was declined due to an issue trying to process the payment. This could be caused by generic errors, suspected fraud, or incomplete billing information.\n  - `\"INSUFFICIENT_FUNDS\"` - the customer's payment was declined due to insufficient funds\n  - `\"INVALID_PAYMENT_DETAILS\"` - the customer's payment was declined due to invalid payment details\n  - `\"SOFT_DECLINE\"` - the customer’s payment was declined due to fixable issues (eg insufficient funds)\n  - `\"HARD_DECLINE\"` - the customer’s payment was declined due to an error or issue which can't be resolved immediately. Action such a new payment method or the customer contacting their bank will need to be taken to resolve the issue before the transaction can be retried.\n  - `\"THREE_D_SECURE_REQUIRED\"` - the customer’s payment was declined due to unsuccessful authentication through 3DS\n  - `\"INTERNAL_ERROR\"` - the customer’s payment was declined due to an internal error in our system\n  - `\"PROCESSOR_UNAVAILABLE\"` - the customer’s payment was declined due to temporary unavailability on the processor’s end\n  - `\"PROCESSOR_ISSUE_WITH_PAYMENT\"` - the customer’s payment was declined due to an issue on the processor’s end\n  - `\"OTHER\"` – other/unlisted reason\n"
    AmendmentAmendResponseAmended:
      allOf:
      - $ref: '#/components/schemas/AmendmentAmendResponseCommon'
      - $ref: '#/components/schemas/AmendmentAmendResponseInProgress'
      - type: object
        required:
        - initialBookingPrice
        - quotePriceDifference
        - amendedBookingPrice
        - currency
        - voucherInfo
        properties:
          voucherInfo:
            $ref: '#/components/schemas/VoucherInfo'
    VoucherInfoCart:
      type: object
      required:
      - url
      - format
      - type
      description: Voucher information for this booking.
      properties:
        url:
          type: string
          description: URL from which this voucher can be retrieved.
          pattern: (?s).*[\S].*
        format:
          type: string
          pattern: (?s).*[\S].*
          description: "File format of the voucher; one of:\n  - `HTML`\n\n**Note:** Only `HTML` is currently supported at the cart level.\n"
        type:
          type: string
          pattern: (?s).*[\S].*
          description: "Whether all Viator standard vouchers, supplier provided vouchers or a mix of both Viator standard and supplier provided vouchers; one of: \n- `STANDARD`\n- `SUPPLIER`\n- `MIXED`\n"
        isVoucherRestrictionRequired:
          type: boolean
          description: Indicates if the transaction was flagged as potentially fraudulent. If set to `true`, partners must make sure they ensure vouchers are delivered securely.
    LanguageGuide:
      type: object
      description: "Specifies which language and what type of language guide to include if language guides are available for this product. \n\n**Note:** This element must be included in order to book products that offer language guides.\n"
      required:
      - language
      - type
      properties:
        type:
          type: string
          pattern: (?s).*[\S].*
          description: "Machine-interpretable value encoding the type of language guide; one of:\n\n  - `GUIDE` – human tour guide\n  - `AUDIO` – audio guide\n  - `WRITTEN` – printed guide \n"
        language:
          type: string
          pattern: (?s).*[\S].*
          description: "Language code of the language for this guide; one of:\n\n  - `cmn` - Mandarin\n  - `es` - Spanish\n  - `en` - English\n  - `hi` - Hindi\n  - `ar` - Arabic\n  - `pt` - Portuguese\n  - `bn` - Bengali\n  - `ru` - Russian\n  - `ja` - Japanese\n  - `pa` - Panjabi\n  - `de` - German\n  - `jv` - Javanese\n  - `wuu` - Wu Chinese\n  - `ms` - Malay\n  - `te` - Telugu\n  - `vi` - Vietnamese\n  - `ko` - Korean\n  - `fr` - French\n  - `mr` - Marathi\n  - `ta` - Tamil\n  - `ur` - Urdu\n  - `tr` - Turkish\n  - `it` - Italian\n  - `yue` - Cantonese\n  - `th` - Thai\n  - `gu` - Gujarati\n  - `mnp` - Chinese Min Bei\n  - `fa` - Farsi\n  - `pl` - Polish\n  - `ps` - Pushto\n  - `hsn` - Hunanese\n  - `ml` - Malayalam\n  - `my` - Burmese\n  - `hak` - Hakka Chinese\n  - `uk` - Ukrainian\n  - `fil` - Filipino\n  - `ro` - Romanian\n  - `nl` - Dutch\n  - `ku` - Kurdish\n  - `hr` - Croatian\n  - `hu` - Hungarian\n  - `el` - Greek\n  - `cs` - Czech\n  - `sv` - Swedish\n  - `fi` - Finnish\n  - `sk` - Slovak\n  - `sr` - Serbian\n  - `no` - Norwegian\n  - `he` - Hebrew\n  - `da` - Danish\n  - `zh_TW` - Chinese Traditional\n  - `zh_CN` - Chinese Simplified\n  - `id` - Indonesian\n"
        legacyGuide:
          type: string
          description: Supply this value in the `languageOptionCode` element when making a booking request.
    AmendPerBookingQuestions:
      type: object
      title: Per Booking Questions
      allOf:
      - $ref: '#/components/schemas/AmendmentQuoteRequestCommon'
      - type: object
        required:
        - perBookingQuestions
        properties:
          perBookingQuestions:
            type: object
            description: 'Per booking booking questions.

              '
            required:
            - question
            - answer
            properties:
              question:
                type: string
                pattern: (?s).*[\S].*
                description: "Booking question to be amended. Identifier - `id` field in response from [/products/booking-questions](#operation/productsBookingQuestions) endpoint.  \nPossible values:\n  - `PICKUP_POINT`\n  - `TRANSFER_AIR_ARRIVAL_AIRLINE`\n  - `TRANSFER_AIR_ARRIVAL_FLIGHT_NO`\n  - `TRANSFER_AIR_DEPARTURE_AIRLINE`\n  - `TRANSFER_AIR_DEPARTURE_FLIGHT_NO`\n  - `TRANSFER_ARRIVAL_DROP_OFF`\n  - `TRANSFER_ARRIVAL_TIME`\n  - `TRANSFER_DEPARTURE_DATE`\n  - `TRANSFER_DEPARTURE_PICKUP`\n  - `TRANSFER_DEPARTURE_TIME`\n  - `TRANSFER_PORT_ARRIVAL_TIME`\n  - `TRANSFER_PORT_CRUISE_SHIP`\n  - `TRANSFER_PORT_DEPARTURE_TIME`\n  - `TRANSFER_RAIL_ARRIVAL_LINE`\n  - `TRANSFER_RAIL_ARRIVAL_STATION`\n  - `TRANSFER_RAIL_DEPARTURE_LINE`\n  - `TRANSFER_RAIL_DEPARTURE_STATION`\n"
              answer:
                type: string
                description: 'Answer to the booking question.


                  **Note**: Emojis are not supported in this field; therefore, please ensure that only ordinary natural-language characters and numerals are included.

                  '
              unit:
                $ref: '#/components/schemas/BookingQuestionUnit'
    PartnerNetPrice:
      type: number
      description: The non-booking fee component of the total amount that Viator will invoice the merchant for this item
    BookingBookStatus:
      type: string
      description: "One of: `CONFIRMED`, `PENDING`, `REJECTED`\n\nNote: For `\"PENDING\"` poll [/booking/status](#tag/Bookings/operation/bookingsStatus) for further booking status updates\n            \n"
    BookingRequest:
      type: object
      required:
      - productCode
      - travelDate
      - paxMix
      - currency
      properties:
        productCode:
          type: string
          pattern: (?s).*[\S].*
          description: Unique identifier for the product
        productOptionCode:
          type: string
          description: 'Product option identifier.


            For more information see: [Key concepts: Product options](#section/Key-concepts/Product-options)

            '
        startTime:
          type: string
          description: 'Starting time for the item in the case that the product/product option has multiple start times.


            **Note**: This element must be included for products that have multiple starting times.

            '
        currency:
          type: string
          pattern: .*[\S].*
          description: "Three-letter currency code for the currency in which to return pricing information; one of:\n\n  - `\"USD\"`\n  - `\"CAD\"`\n  - `\"GBP\"`\n  - `\"AUD\"`\n  - `\"EUR\"`\n"
        travelDate:
          description: Date of travel (according to the time zone in which the product operates)
          type: string
          format: date
        paxMix:
          type: array
          description: Passenger details
          items:
            $ref: '#/components/schemas/PaxMixItem'
    BookingsCartHoldResponseBookableItem:
      allOf:
      - $ref: '#/components/schemas/BookingsCartHoldResponseItemBase'
      - $ref: '#/components/schemas/BookingsCartResponseItemPrice'
      - type: object
        required:
        - bookingHoldInfo
        properties:
          bookingHoldInfo:
            $ref: '#/components/schemas/BookingHoldInfo'
          extraChargesSummary:
            $ref: '#/components/schemas/ExtraChargesSummary'
    QuoteAmendedPrice:
      type: object
      description: A detailed breakdown of the total booking price after the requested amendment has been applied.
      required:
      - lineItems
      - totalPrice
      properties:
        lineItems:
          type: array
          description: Array of pricing details for each traveler in this booking.
          items:
            $ref: '#/components/schemas/AmendmentPricingLineItem'
        totalPrice:
          description: Total price of this booking.
          allOf:
          - $ref: '#/components/schemas/AmendmentLineItemPriceObject'
    BookingsCartHoldResponseRejectedItem:
      allOf:
      - $ref: '#/components/schemas/BookingsCartHoldResponseItemBase'
      - type: object
        required:
        - rejectionReasonCode
        properties:
          rejectionReasonCode:
            $ref: '#/components/schemas/HoldRejectionReasonCode'
    AmendmentPricingLineItem:
      type: object
      required:
      - numberOfTravelers
      - subtotalPrice
      properties:
        ageBand:
          type: string
          pattern: (?s).*[\S].*
          description: "Machine-interpretable value indicating the age-band of the travelers that this line-item describes the subtotal price for; one of:\n  - `ADULT`\n  - `SENIOR`\n  - `YOUTH`\n  - `CHILD`\n  - `INFANT`\n  - `TRAVELER`\n"
        numberOfTravelers:
          $ref: '#/components/schemas/NumberOfTravelers'
        subtotalPrice:
          type: object
          description: Subtotal pricing for this line item.
          required:
          - price
          properties:
            price:
              type: object
              description: Components of this price
              required:
              - recommendedRetailPrice
              - partnerNetPrice
              properties:
                recommendedRetailPrice:
                  $ref: '#/components/schemas/RecommendedRetailPrice'
                partnerNetPrice:
                  type: number
                  description: "The non-booking fee component of the total amount that Viator will invoice the merchant for this item.  \n\nFor <u>affiliate partners with API access level \"Full Access + Booking\"</u> this is the amount Viator charges exclusive of commission\n"
    PaxMixSummary:
      type: array
      description: "Summary of the current PAX MIX of the booking.  \nIt ensures each traveler listed in the PaxMix is assigned a `travelerNum` and informs which Booking Questions have been answered for each at the time of the booking.\n\n**Note**: This field will not be present in the response if `isAmendable` is `false`\n"
      items:
        type: object
        required:
        - travelerNum
        - ageBand
        properties:
          travelerNum:
            type: integer
            description: 'Traveler Number identifying each traveler on the booking.


              **Note**: This field reuses the `travelerNum` values provided in the [/bookings/book](#operation/bookingsBook) or [/bookings/cart/book](#operation/bookingsCartBook) request. If not supplied, new values will be generated.

              '
          ageBand:
            type: string
            pattern: (?s).*[\S].*
            description: "Machine-interpretable value indicating the age-band that each traveler falls into; one of:\n\n  - `ADULT`\n  - `SENIOR`\n  - `YOUTH`\n  - `CHILD`\n  - `INFANT`\n  - `TRAVELER`\n\nThe valid age-band identifiers for the product are provided in the `pricingInfo.ageBands[]` array in the [product content response](#section/Key-concepts/Content-ingestion-endpoints). The `TRAVELER` age-band is to be used when the `pricingInfo.type` is `UNIT`; i.e., unit or group pricing.\n\nTo learn more about how to implement age bands, see the following guide: [Implementing age bands & pax mix](https://partnerresources.viator.com/travel-commerce/merchant/agebands-pax-mix?source=specs)\n"
          bookingQuestions:
            type: object
            description: 'Traveler-specific booking questions required for this booking.

              '
            required:
            - question
            properties:
              question:
                $ref: '#/components/schemas/BookingQuestionTraveler'
              answer:
                type: string
                description: 'Answer to the booking question provided at time of the booking.


                  **Note**: if omitted, it means `bookingQuestion` was not answered at the time of the booking or the list of `bookingQuestions` required has been updated since the time of the booking.

                  '
              unit:
                $ref: '#/components/schemas/BookingQuestionUnit'
    VoucherDetails:
      type: object
      description: '**Merchant partners only**: Additional details to display on the voucher.

        '
      properties:
        companyName:
          description: Company name to display on the voucher.
          type: string
          maxLength: 200
        email:
          description: Company / customer support email address to display on the voucher.
          type: string
          maxLength: 200
        phone:
          type: string
          description: Company / customer support phone number to display on the voucher.
          maxLength: 30
        voucherText:
          type: string
          description: Any additional custom text to display on the voucher; e.g., Customer support URL / instructions on how to access customer support.
          maxLength: 10000
        format:
          type: string
          description: 'File format of the voucher; one of:

            - `PDF`

            - `HTML`


            Default is `HTML` if not specified.

            '
    NumberOfTravelers:
      type: integer
      description: The number of travelers that this line-item describes the subtotal price for.
    ExtraChargesItemInDestinationCurrency:
      type: object
      description: The Extra Charges amount in destination currency.
      required:
      - amountPerUnit
      - totalAmount
      - currency
      properties:
        amountPerUnit:
          type: number
          description: "The cost per one Extra Charges in Destination currency.\n\n**Note**:\n  - Prices payable to third parties are subject to change due to Exchange rates fluctuations between the request time and the travelDate.\n"
        totalAmount:
          type: number
          description: "Total amount of all Extra Charges in Destination currency.\n\n**Note**:\n  - Prices payable to third parties are subject to change due to Exchange rates fluctuations between the request time and the travelDate.\n"
        currency:
          description: The supplier preferred currency to be paid in Destination.
          type: string
    BookerInfo:
      type: object
      description: Name details for the person making this booking.
      required:
      - firstName
      - lastName
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          description: 'First name (given name) of the person making this booking.


            **Note**: Emojis are not supported in this field; therefore, please ensure that only ordinary natural-language characters are included.

            '
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          description: 'Surname of the person making this booking.


            **Note**: Emojis are not supported in this field. Please ensure only ordinary natural-language characters are included.

            '
    BookingBookRequest:
      allOf:
      - $ref: '#/components/schemas/BookingRequest'
      - type: object
        required:
        - bookerInfo
        - communication
        - partnerBookingRef
        properties:
          bookingRef:
            type: string
            description: The booking reference code that is generated by Viator and returned in the `bookingRef` element in the response from [/bookings/hold](#operation/bookingsHold).
          partnerBookingRef:
            type: string
            pattern: (?s).*[\S].*
            maxLength: 100
            description: Partner-generated unique booking reference for this bookable item
          languageGuide:
            allOf:
            - $ref: '#/components/schemas/LanguageGuide'
            - type: object
              description: "Specifies which language and what type of language guide to include if language guides are available for this product. \n\n- **Note**: This element must be included in order to book products that offer language guides.\n"
          bookerInfo:
            $ref: '#/components/schemas/BookerInfo'
          bookingQuestionAnswers:
            type: array
            description: 'Answers to booking questions required for this booking


              - See: [Booking concepts – Booking questions](#section/Booking-concepts/Booking-questions) for more information.

              '
            items:
              $ref: '#/components/schemas/BookingQuestionAnswers'
          communication:
            $ref: '#/components/schemas/CommunicationInfo'
          additionalBookingDetails:
            $ref: '#/components/schemas/AdditionalBookingDetails-2'
    BookingsCartBookResponse:
      type: object
      required:
      - cartRef
      - partnerCartRef
      - currency
      - items
      - totalConfirmedPrice
      - totalPendingPrice
      properties:
        cartRef:
          $ref: '#/components/schemas/CartReference'
        partnerCartRef:
          $ref: '#/components/schemas/PartnerCartReference'
        currency:
          $ref: '#/components/schemas/Currency'
        items:
          type: array
          description: List of bookable items.
          items:
            oneOf:
            - $ref: '#/components/schemas/BookingsCartBookResponseConfirmedItem'
            - $ref: '#/components/schemas/BookingsCartBookResponsePendingItem'
            - $ref: '#/components/schemas/BookingsCartBookResponseRejectedItem'
            discriminator:
              propertyName: status
              mapping:
                CONFIRMED: '#/components/schemas/BookingsCartBookResponseConfirmedItem'
                PENDING: '#/components/schemas/BookingsCartBookResponsePendingItem'
                REJECTED: '#/components/schemas/BookingsCartBookResponseRejectedItem'
        voucherInfo:
          allOf:
          - $ref: '#/components/schemas/VoucherInfoCart'
          - description: This voucher comprises of items in the cart that are confirmed.
        totalConfirmedPrice:
          description: The total price of all confirmed bookable items.
          allOf:
          - $ref: '#/components/schemas/CartLineItemPrice'
        totalPendingPrice:
          description: The total price of all pending bookable items.
          allOf:
          - $ref: '#/components/schemas/CartLineItemPrice'
    BookingBookResponse:
      type: object
      properties:
        status:
          type: string
          description: "Indicates the outcome of the booking request; one of:\n\n  - `\"CONFIRMED\"` – the booking has been confirmed\n  - `\"REJECTED\"` – the booking request was declined\n  - `\"CANCELED\"` – the booking has been canceled\n  - `\"PENDING\"` – the booking request has been submitted to the supplier and is awaiting their response.\n  - `\"IN_PROGRESS\"` – the booking is still being processed by the booking server. \n  - `\"ON_HOLD\"` – booking hold made but no booking request made yet\n  - `\"FAILED\"` – the booking request failed\n\nNote: For `\"PENDING\"` and `\"IN_PROGRESS\"` poll [/booking/status](#tag/Bookings/operation/bookingsStatus) for further booking status updates\n"
        rejectionReasonCode:
          type: string
          description: "In the case that `status` is `\"REJECTED\"`, this field provides a code as to the reason for the rejection; one of:\n\n  - `\"BOOKABLE_ITEM_IS_NO_LONGER_AVAILABLE\"` – this bookable item is no longer available\n  - `\"DUPLICATE_BOOKING\"` – this is a duplicate booking\n  - `\"OTHER\"` – other/unlisted reason\n"
        bookingRef:
          type: string
          description: Viator-generated booking reference number
        partnerBookingRef:
          type: string
          description: Partner-generated booking reference number (if sent in the request)
        currency:
          type: string
          description: "One of the available billing currencies:\n\n  - `\"USD\"`\n  - `\"CAD\"`\n  - `\"GBP\"`\n  - `\"AUD\"`\n  - `\"EUR\"`\n"
        lineItems:
          type: array
          description: Array of pricing details for each traveler in this booking
          items:
            $ref: '#/components/schemas/PricingLineItem'
        totalPrice:
          description: Total price of this booking
          allOf:
          - $ref: '#/components/schemas/LineItemPriceObject'
        cancellationPolicy:
          $ref: '#/components/schemas/CancellationPolicy'
        voucherInfo:
          $ref: '#/components/schemas/VoucherInfo'
    QuotePriceDifference:
      type: object
      description: 'The price difference that must be paid (or refunded, if negative) to apply the requested amendment to the booking. This value reflects the cost impact of the proposed changes compared to the original booking.

        '
      required:
      - recommendedRetailPrice
      - partnerNetPrice
      - bookingFee
      - partnerTotalPrice
      properties:
        recommendedRetailPrice:
          type: number
          description: The recommended retail price difference for the booking based at price which the product is sold on the Viator.com site.
        partnerNetPrice:
          type: number
          description: "The non-booking fee component of the total amount that Viator will invoice the merchant for this amendment.  \n\nFor <u>affiliate partners with API access level \"Full Access + Booking\"</u> this is the amount Viator charges exclusive of commission\n"
        bookingFee:
          type: number
          description: "The booking fee component of the total amount that Viator will invoice the merchant for the amendment of this item.  \n\n**Note**:\n  - The rate applied is given in the merchant's contract with Viator.\n  - This element is only relevant to <u>merchant partners</u> using the <u>markup based pricing model</u>\n"
        commission:
          type: number
          description: "The amount the merchant will receive as a commission for the amendment of this item.  \n\n**Note**: This element is only relevant to <u>merchant partners</u> using the <u>commission-based pricing model</u> and <u>affiliate partners with API access level \"Full Access + Booking\"</u>.\n"
        partnerTotalPrice:
          type: number
          description: "The total amount that Viator will invoice the merchant for the amendment of this item.  \n\nFor <u>affiliate partners with API access level \"Full Access + Booking\"</u> this is the total amount that Viator charges exclusive of commission.  \n\nSee the following article to learn more about how pricing works in this API: [Calculating Product Pricing](https://partnerresources.viator.com/travel-commerce/merchant/pricing?source=specs).\n"
    HoldRejectionReasonCode:
      type: string
      description: "In the case that `status` is `REJECTED`, this field provides a code as to the reason for the rejection; one of:\n\n  - `BOOKABLE_ITEM_IS_NO_LONGER_AVAILABLE` – this bookable item is no longer available\n  - `FAILED_TO_CHECK_AVAILABILITY_OR_PRICING` – Unable to retrieve availability or pricing data for this bookable item\n  - `OTHER` – other/unlisted reason\n"
    AmendmentAmendResponseCommon:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/AmendmentStatus'
    CancelBookingResponse:
      type: object
      required:
      - bookingId
      - status
      properties:
        bookingId:
          type: string
          description: "Booking reference code for this booking\n\n  - **Note**: For bookings made with v1 of this API, this code corresponds to `data.itemSummaries[].itemId` (in the response from v1's [/booking/book](https://docs.viator.com/partner-api/merchant/technical/#tag/Booking-services/paths/~1booking~1book/post) endpoint) but prepended with `BR-`. For example, if the `itemId` is `580669678`, this field should be `BR-580669678`.\n"
        reason:
          $ref: '#/components/schemas/CancellationResultItemReason'
        status:
          $ref: '#/components/schemas/CancellationBookingStatus'
    Currency:
      type: string
      description: '**Merchant Partners:** One of `USD`, `EUR`, `GBP`, `AUD`, `CAD`


        **Affiliate Partners with API access level "Full Access + Booking":** One of `USD`, `EUR`, `GBP`, `AUD`, `CAD`,

        `CHF`, `DKK`, `FJD`, `HKD`, `JPY`, `NOK`, `NZD`, `SEK`, `SGD`, `THB`, `ZAR`, `INR`, `BRL`, `TWD`, `MXN`, `CLP`, `IDR`, `ILS`, `KRW`, `PHP`, `PLN`, `TRY`

        '
    BookingStatusResponseTransient:
      allOf:
      - $ref: '#/components/schemas/BookingStatusResponseCommon'
      - type: object
        properties:
          nextPollAt:
            $ref: '#/components/schemas/NextPollAt'
    AmendmentQuoteRequest:
      type: object
      properties:
        voucherFormat:
          $ref: '#/components/schemas/VoucherFormat'
      oneOf:
      - $ref: '#/components/schemas/AmendBookingDetails'
      - $ref: '#/components/schemas/AmendPaxMix'
      - $ref: '#/components/schemas/AmendPerTravelerQuestions'
      - $ref: '#/components/schemas/AmendPerBookingQuestions'
    BookingQuestionTraveler:
      type: string
      pattern: (?s).*[\S].*
      description: "Booking question identifier - `id` field in response from [/products/booking-questions](#operation/productsBookingQuestions) endpoint. Possible values:\n  - `DATE_OF_BIRTH`\n  - `HEIGHT`\n  - `PASSPORT_EXPIRY`\n  - `PASSPORT_NATIONALITY`\n  - `PASSPORT_PASSPORT_NO`\n  - `WEIGHT`\n  - `FULL_NAMES_FIRST`\n  - `FULL_NAMES_LAST`\n\n**Note**: only the Booking questions on the list provided are eligible to be amended\n"
    BookingRef:
      type: string
      description: 'The booking reference code (in format `BR-123456789`), generated by Viator and returned in the `bookingRef` element in the response from [/bookings/book](#operation/bookingsBook) and [/bookings/cart/book](#operation/bookingsCartBook)

        '
      example: BR-123456789
    CancellationCondition:
      type: object
      description: Structured description of fees pertaining to cancellations during various time windows.
      required:
      - dayRangeMin
      - percentageRefundable
      properties:
        dayRangeMin:
          type: integer
          description: Number of days prior to the product start time (relative to the time zone in which the product operates) that this policy window ends.
        dayRangeMax:
          type: integer
          description: Number of days prior to the tour start time (relative to the time zone in which the product operates) that this policy window begins. When this field is absent, it signifies negative infinity; i.e., the beginning of time.
        percentageRefundable:
          type: integer
          description: Percentage of total price refundable if a booking for this product is cancelled within the period defined by `dayRangeMin` and `dayRangeMax`.
        startTimestamp:
          type: string
          format: date-time
          description: 'Timestamp (UTC) indicating the **beginning** of the period during which this cancellation policy applies; e.g. `2019-09-17T03:20:45.737043Z`.

            - Note: this element will appear in the response from [/bookings/book](#operation/bookingsBook) but will **not** be present in responses from /products/* endpoints.

            '
        endTimestamp:
          type: string
          format: date-time
          description: 'Timestamp (UTC) indicating the **end** of the period during which this cancellation policy applies; e.g. `2019-09-17T03:20:45.737043Z`.

            - Note: this element will appear in the response from /bookings/book but will **not** be present in responses from /products/* endpoints.

            '
    CancellationQuoteBookingStatus:
      type: string
      description: "Machine-interpretable string indicating the cancellation status of this itinerary item:\n\n  - `\"CANCELLABLE\"` - this booking is available to be cancelled\n  - `\"CANCELLED\"` - this booking has already been cancelled\n  - `\"NOT_CANCELLABLE\"` - this booking cannot be cancelled (because the product's start time was in the past)\n"
    QuoteRejectionReasonCode:
      type: string
      description: "Machine-interpretable reason code indicating why the quote was rejected. One of:\n  - `\"NO_AVAILABILITY\"`: This bookable item is not available for the specified combination of date, time and passenger mix\n  - `\"BOOKABLE_ITEM_IS_NO_LONGER_AMENDABLE\"` – this bookable item is no longer eligible to be amended due to updated restrictions or conditions.\n                       \n"
    ExtraChargesSummary:
      type: object
      description: "Information about the Extra Charges applicable to this `bookableItem`.\n\n**Note**:\n  - Prices payable to third parties are provided to us by the operator, and may be subject to change.\n"
      required:
      - price
      - mandatory
      properties:
        price:
          type: object
          description: Pricing information applicable to this `bookableItem` including extra charges.
          required:
          - recommendedRetailPrice
          properties:
            recommendedRetailPrice:
              description: 'The recommended retail price value including highest Extra Charges value to be paid in destination by the traveler.

                This value will only be returned if the `bookableItem` passed in the request has Extra Charges.

                '
              type: number
        priceBeforeDiscount:
          type: object
          description: Pricing information applicable to this `bookableItem` including extra charges if no discount had been applied.
          required:
          - recommendedRetailPrice
          properties:
            recommendedRetailPrice:
              description: 'Non-discounted price if price has a discount applied to it.

                It shows what the value of `price.recommendedRetailPrice` would be if no discount had been applied; otherwise, it will be absent.

                '
              type: number
        mandatory:
          description: Information about the mandatory Extra Charges applicable to this `bookableItem`.
          type: object
          required:
          - totalExtraCharges
          - items
          properties:
            totalExtraCharges:
              description: Total amount of Extra Charges considering `bookableItem` and paxMix.
              type: number
            items:
              type: array
              items:
                $ref: '#/components/schemas/ExtraChargesItem'
              description: 'List of all Extra Charges that apply to the `bookableItem`.

                Can be used to build a breakdown list of costs.


                Each item corresponds to a product Exclusion that requires Extra Charges to be paid.

                '
    BookingQuestionUnit:
      type: string
      description: 'Unit in which the answer is provided; one of `units` in response from [/products/booking-questions](#operation/productsBookingQuestions) endpoint.

        '
    AmendmentRejectionReasonCode:
      type: string
      description: "Machine-interpretable reason code indicating why the amendment was `REJECTED`. One of:\n\n  - `\"BOOKABLE_ITEM_IS_NO_LONGER_AMENDABLE”` – this bookable item is no longer eligible to be amended due to updated restrictions or conditions.\n  - `\"BOOKABLE_ITEM_IS_NO_LONGER_AVAILABLE\"` – this bookable item is no longer available. The selected bookable item is no longer available for the specified travel date /start time / pax mix combination. Retrieve current availability and generate a new quote before attempting the amendment again.\n  - `\"PRICE_MISMATCH\"` – the quotePriceDifference is no longer valid. The product's price has changed since the quotePriceDifference was generated, re-submit the amendment request to receive an updated quote.\n  - `\"ISSUE_WITH_PAYMENT\"` – the customer’s payment was declined due to an issue trying to process the payment. This could be caused by generic errors, suspected fraud, or incomplete billing information.\n  - `\"INSUFFICIENT_FUNDS\"` - the customer's payment was declined due to insufficient funds\n  - `\"INVALID_PAYMENT_DETAILS\"` - the customer's payment was declined due to invalid payment details\n  - `\"SOFT_DECLINE\"` - the customer’s payment was declined due to fixable issues (eg insufficient funds)\n  - `\"HARD_DECLINE\"` - the customer’s payment was declined due to an error or issue which can't be resolved immediately. Action such a new payment method or the customer contacting their bank will need to be taken to resolve the issue before the transaction can be retried.\n  - `\"THREE_D_SECURE_REQUIRED\"` - the customer’s payment was declined due to unsuccessful authentication through 3DS\n  - `\"INTERNAL_ERROR\"` - the customer’s payment was declined due to an internal error in our system\n  - `\"PROCESSOR_UNAVAILABLE\"` - the customer’s payment was declined due to temporary unavailability on the processor’s end\n  - `\"PROCESSOR_ISSUE_WITH_PAYMENT\"` - the customer’s payment was declined due to an issue on the processor’s end\n  - `\"OTHER\"` – other/unlisted reason\n\n**Note**: New values may be added over time, allowing flexibility for different use cases.\n"
    AmendBookingDetails:
      type: object
      title: Booking Details
      allOf:
      - $ref: '#/components/schemas/AmendmentQuoteRequestCommon'
      - type: object
        required:
        - bookingDetails
        properties:
          bookingDetails:
            type: object
            description: "New booking details of the product being amended.  \n\n**Note**: Only the fields being changed need to be included in the request — for example, if updating the `startTime` while keeping the `travelDate` unchanged, only the `startTime` field needs to be provided.\n"
            properties:
              travelDate:
                $ref: '#/components/schemas/TravelDate'
              startTime:
                $ref: '#/components/schemas/StartTime'
              productOptionCode:
                $ref: '#/components/schemas/ProductOptionCode'
    AmendmentQuoteResponseCommon:
      type: object
      required:
      - bookingRef
      - status
      properties:
        bookingRef:
          $ref: '#/components/schemas/BookingRef'
        status:
          $ref: '#/components/schemas/QuoteStatus'
    QuoteStatus:
      type: string
      description: "Machine-interpretable string indicating the outcome of the quote request. One of:\n  - `CONFIRMED`: The quote was successful\n  - `REJECTED`: The quote was rejected\n"
    PartnerCartReference:
      type: string
