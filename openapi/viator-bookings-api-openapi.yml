  /bookings/modified-since/acknowledge:
    post:
      tags:
      - Bookings
      summary: /bookings/modified-since/acknowledge
      description: 'Acknowledges receipt of one or more booking event notifications returned by the /bookings/modified-since endpoint. Merchants who wish to assume control of the customer service workflow surrounding booking change events must carry out this step before the time indicated in the `bookings[].acknowledgeBy` field, otherwise Viator will automatically send a cancellation notification to the email address provided by the partner for cancellation notifications.

        This endpoint should be called in order to stop notification emails from being sent by Viator. See the guide on how to automate the flow for supplier cancellations in this article: Automating supplier cancellations in V.2 Partner API


        **Note**: This endpoint is only available to affiliate partners with API access level "Full Access + Booking" and merchant partners.'
