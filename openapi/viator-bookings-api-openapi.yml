        refundAmount:
          type: number
          description: Numeric currency amount that will be refunded.
        refundPercentage:
          type: number
          description: Percentage of the item price that will be refunded.
        currencyCode:
          type: string
          description: Three-letter code indicating the currency in which `itemPrice` and `refundAmount` are displayed.
    LineItemPriceObjectSubtotal:
      type: object
