  parameters:
    exp-demo:
      in: header
      name: exp-demo
      description: "Specifies whether this request is a demo/test booking. Demo bookings do not send any notifications and are automatically confirmed. Also, manual-confirmation products behave as if they were instant-confirmation products. \n\nSet this value to **true** when:\n- Making a test booking in the production environment\n- Making a test booking of a manual-confirmation product in the sandbox environment and you wish to receive a booking status of `\"CONFIRMED\"` in the response\n\nSet this value to **false** when:\n- Making a real booking in the production environment\n- Making a test booking of a manual-confirmation product in the sandbox environment and you wish to receive a booking status of `\"PENDING\"` in the response\n"
      schema:
        type: boolean
        example: 'true'
        default: 'false'
    bookingReference:
      name: booking-reference
      in: path
      required: true
      schema:
        type: string
      description: 'The booking reference code (in format `BR-123456789`), generated by Viator and returned in the `bookingRef` element in the response from [/bookings/book](#operation/bookingsBook) and [/bookings/cart/book](#operation/bookingsCartBook) for which to retrieve amendability status and details

        '
      example: BR-123456789
    optionalAcceptLanguage:
      in: header
      name: Accept-Language
      description: 'Specifies the language into which the natural-language fields in the response from this service will be translated (see [Accept-Language header](#section/Localization/Accept-Language-header-parameter) for available language codes)

        '
      required: false
      schema:
        type: string
        example: en-US
    accept:
      in: header
      name: Accept
      description: 'Specifies the version of this API to access

        '
      required: true
      schema:
        type: string
