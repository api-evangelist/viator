    availabilityDateRangeRequestXml:
      summary: Date-range request
      value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<AvailabilityRequest xmlns=\"http://toursgds.com/api/01\">\n  <ApiKey>xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</ApiKey>\n  <ResellerId>1000</ResellerId>\n  <SupplierId>1004</SupplierId>\n  <ExternalReference>10051374722992616</ExternalReference>\n  <Timestamp>2013-07-25T13:29:52.616+10:00</Timestamp>\n  <StartDate>2014-10-30</StartDate>\n  <EndDate>2014-10-31</EndDate>\n  <SupplierProductCode>BLUE</SupplierProductCode>\n  <TourOptions>\n    <SupplierOptionCode>BASIC</SupplierOptionCode>\n    <Option>\n      <Name>Room</Name>\n      <Value>dualocc</Value>\n    </Option>\n  </TourOptions>\n  <TravellerMix>\n    <Adult>1</Adult>\n    <Child>1</Child>\n    <Youth>0</Youth>\n    <Infant>1</Infant>\n    <Senior>0</Senior>\n    <Total>3</Total>\n  </TravellerMix>\n</AvailabilityRequest>\n"
  schemas:
    RequestResponseBase:
      type: object
      required:
      - ApiKey
      - ResellerId
      - SupplierId
      - Timestamp
      properties:
        ApiKey:
          type: string
          description: Authentication key.
        ResellerId:
          type: string
          description: Unique identifier for Viator.
        SupplierId:
          type: integer
          description: Unique operator identifier within Viator's systems.
        ExternalReference:
          type: string
          description: Unique transaction identifier - unique across all transactions. Used in the response to identify the initial request.
        Timestamp:
          type: string
          description: 'The time of creation of the request. Date/time (timestamp) that requires timezone information along with date/time. The date should be in the following format:


            - yyyy-MM-ddTHH:mm:ss.SSSZ (in UTC time), or

            - yyyy-MM-ddTHH:mm:ss.SSS[+/-]hh:mm


            **Examples:**

            - 2013-04-28T13:10:12.120Z

            - 2013-04-28T13:10:12.120+10:00

            '
          format: date-time
      description: Request Response Base.
    Price:
      title: Price
      description: Holds the information regarding the price for the associated Tour that was retrieved from the API.
      required:
      - CurrencyCode
      - Item
      type: object
      properties:
        CurrencyCode:
          type: string
          description: Holds the currency associated with prices returned.
        Item:
          type: array
          description: Single price information retrieved from the API.
          items:
            type: object
            required:
            - AgeBand
            - RetailPrice
            properties:
              RetailPrice:
                type: number
                description: Stores the price for which the booking should be made on the shop by the customer for the given age band.
              AgeBand:
                type: string
                description: Age band of traveler.
                enum:
                - Adult
                - Child
                - Youth
                - Infant
                - Senior
    AvailabilityRequest:
      description: Root element for Real-time Availability Request
      allOf:
      - $ref: '#/components/schemas/RequestResponseBase'
      - type: object
        required:
        - StartDate
        - SupplierProductCode
        properties:
          StartDate:
            type: string
            format: date
            description: 'Date for which tour availability is being requested from the reservation system.

              * If supplied without an `EndDate`, then a single date availability request is being made.

              * If supplied with an `EndDate`, then availability request is for a date range.


              The date should be in date format: **YYYY-MM-DD**.


              **Example:** 2000-01-31

              '
          EndDate:
            type: string
            format: date
            description: "End date of date range for which tour availability is being requested from the reservation system. If this is empty, availability will be searched for the given `StartDate` only. \n\nThe date should be in date format: **YYYY-MM-DD**.\n\n**Example:** 2000-01-31\n"
          SupplierProductCode:
            type: string
            maxLength: 50
            description: Operator's unique product (tour) identifier in the reservation system.
          TourOptions:
            $ref: '#/components/schemas/TourOptionItem'
          AvailabilityHold:
            type: object
            description: Availability hold root element. Availability hold is sent with an availability request only if a Viator customer proceeds to checkout (high probability of confirmed sale).
            required:
            - Expiry
            properties:
              Expiry:
                type: string
                description: "Duration after which the availability hold should expire for the current request. \nThis is a suggested value, the reservation system can determine to define its own duration (which will be returned in the availability API response). \nExpiry value must be positive and provided in duration format: **PnYnMnDTnHnMnS**.\n\n**Example:**\n  * PT300S (5 minutes)\n"
          TravellerMix:
            type: object
