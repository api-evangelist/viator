          TourAvailability:
            description: "Tour availability root element. Holds availability for each product (tour) or product option (tour option). \nFor products with more than one option, multiple TourAvailability elements will be provided in the response, one for each option. \nIf a product has no options, then a single TourAvailability element will be provided in the response with no `SupplierOptionCode`.\n"
            type: array
            items:
              title: TourAvailabilityItem
              required:
              - Date
              - AvailabilityStatus
              properties:
                Date:
                  type: string
                  format: date
                  description: "Date for which tour availability is being supplied. \n\nThe date should be in date format: **YYYY-MM-DD.** \n\n**Example:** 2000-01-31\n"
                TourOptions:
                  $ref: '#/components/schemas/TourOptionItem'
                AvailabilityStatus:
                  type: object
                  description: Availability status root element. Holds the availability status for given product (tour) or product option (tour option).
                  required:
                  - Status
                  properties:
                    Status:
                      type: string
                      description: "Status of availability. Valid values include:\n  * `AVAILABLE` - when product is available for the given `Date` and `TravellerMix`\n  * `UNAVAILABLE` - when product is not available for the given `Date` and `TravellerMix`\n"
                      enum:
                      - AVAILABLE
                      - UNAVAILABLE
                    UnavailabilityReason:
                      enum:
                      - SOLD_OUT
                      - BLOCKED_OUT
                      - INACTIVE
                      - PAST_CUTOFF_DATE
                      - TRAVELLER_MISMATCH
                      - NO_EVENT
                      type: string
                      description: 'Reason why product is not available; valid values include:

                        - `SOLD_OUT` - when the product (tour) / product option (tour option) is sold out. When this reason code is received, the product or product option becomes unavailable for sale on Viator systems.

                        - `BLOCKED_OUT` - when the product (tour) / product option (tour option) has been blocked out (not taking place on this date). When this reason code is received, the product or product option becomes unavailable for sale on Viator systems.

                        - `INACTIVE` - when the product (tour) / product option (tour option) is no longer active. When this reason code is received, the product or product option becomes unavailable for sale on Viator systems.

                        - `PAST_CUTOFF_DATE` - when the booking cut-off date has been reached for this product (tour) / product option (tour option). When this reason code is received, the product or product option becomes unavailable for sale on Viator systems.

                        - `TRAVELLER_MISMATCH` - when the required combination of travelers for this product (tour) / product option (tour option) is not met or when the number of requested passengers cannot be fulfilled, but a lower number can (i.e. availability status for three people is unavailable, but availability status for two is available).

                        - `NO_EVENT` - This event is no longer valid. When this reason code is received, the product or product option becomes unavailable for sale on Viator systems

                        '
                    TravellerMixAvailability:
                      description: Holds availability information for each age band. `True` if the traveler mix is available, `false` if sold out
                      type: object
                      properties:
                        Infant:
                          type: boolean
                          description: '`True` if availability exists for the Infant age band.

                            '
                        Child:
                          type: boolean
                          description: '`True` if availability exists for the Child age band.

                            '
                        Youth:
                          type: boolean
                          description: '`True` if availability exists for the Youth age band.

                            '
                        Adult:
                          type: boolean
                          description: '`True` if availability exists for the Adult age band.

                            '
                        Senior:
                          type: boolean
                          description: '`True` if availability exists for the Senior age band.

                            '
                AvailabilityHold:
                  type: object
                  description: 'Availability hold root element. Availability hold is sent with an availability request only if a Viator customer proceeds to checkout (high probability of confirmed sale).


                    **Mandatory** if `AvailabilityHold` feature is supported by the reservation system.

                    '
                  required:
                  - Expiry
                  - Reference
                  properties:
                    Expiry:
                      type: string
                      description: "Duration after which the availability hold should expire for the current request. \nThis is a suggested value, the reservation system can determine to define its own duration (which will be returned in the availability API response). \nExpiry value must be positive and provided in duration format: **PnYnMnDTnHnMnS**.\n\n**Example:**\n  * PT300S (5 minutes)\n"
                    Reference:
                      type: string
                      description: "Availability hold reference assigned by the reservation system. \nThe reference will be used in a subsequent booking request to advise the reservation system that the booking is related to the prior availability hold request. Response scoped.\n"
                Price:
                  $ref: '#/components/schemas/Price'
                BookingCutoff:
                  type: object
                  description: "Booking cut-off root element; contains information about the point in time after which the tour option may become unavailable, \nreferred to as the 'booking cut-off'. \n\nIt is **mandatory to provide one of the three child element options** listed below – `DateTime`, `ProductDateTime` or `NotApplicable`\n"
                  oneOf:
                  - title: DateTime
                    type: object
                    required:
                    - DateTime
                    properties:
                      DateTime:
                        type: string
                        format: date-time
                        description: 'Datetime string <u>that must include the time-zone</u> that describes absolutely when the booking cut-off is.


                          **Examples:**

                          * 2021-11-07T12:13:14+10:30

                          * 2021-11-07T22:22:11.000-10:00

                          We would prefer that you provide a datetime adjusted to UTC; however, we will accept any legitimate time-zone offset; our systems will adjust accordingly.

                          '
                  - title: ProductDateTime
                    type: object
                    required:
                    - ProductDateTime
                    properties:
                      ProductDateTime:
                        type: string
                        format: date-time
                        description: 'Datetime string <u>that must not include a time-zone or ''Z'' (UTC) offset</u> that describes when the booking cut-off is **in the time-zone of the product.**

                          Use this element <u>instead of</u> the `DateTime` element if you are unable to provide the full datetime string with time-zone included.


                          **Examples:**

                          * 2021-11-08T12:13:14

                          * 2021-11-08T11:22:33.000

                          '
                  - title: NotApplicable
                    type: object
                    required:
                    - NotApplicable
                    properties:
                      NotApplicable:
                        type: boolean
                        description: "'True' if a booking cut-off does not exist for this product option. \nIf set, our systems will attempt to make any sale until we receive an `AvailabilityStatus` of `UNAVAILABLE`; \nor, the present moment has advanced beyond the product's start time.\n"
                Capacity:
                  type: object
                  description: 'Capacity root element. Allows for capacity-management by communicating the remaining places available for Viator to book for this product.

                    The system allows for all or only certain age bands to draw down on the available places, to allow, for example, infants to be excluded and thereby not affect the remaining capacity.

                    See "How to use the Capacity element" section for more information.

                    '
                  required:
                  - Simple
                  properties:
                    Simple:
                      type: object
                      description: Simple capacity root element. Contains elements for remaining places and which age band(s) (if applicable) consume these places.
                      properties:
                        Remaining:
                          type: integer
                          description: Numeric value representing number of remaining places
                        ConsumedBy:
                          type: array
                          description: 'Name of age band that can consume the remaining places; one of `ADULT`, `CHILD`, `INFANT`, `YOUTH`, `SENIOR`

                            '
                          items:
                            type: string
                            enum:
                            - ADULT
                            - CHILD
                            - INFANT
                            - YOUTH
                            - SENIOR
                VersionTag:
                  $ref: '#/components/schemas/VersionTag'
    TourOptionBase:
      title: TourOptionItem
      description: Tour option root element. Holds details pertaining to each of the product (tour) options (including default if no tour options exist).
      properties:
        SupplierOptionCode:
          type: string
          description: 'Reservation system product option (tour option) identifier. A product option is a version or variant of the tour and each option must have a unique code.


            **Examples:**

            - A tour that is conducted by a Spanish guide and also by an English guide has two options.

            - A tour that starts at three different times throughout the day may have three options. This could be because each start time is priced differently or because availability is limited for each starting time.

            - A Tour that has a luxurious version and a cheaper version is considered to have two options.


            A list of the operator''s Viator product options can be provided for mapping purposes.

            '
        SupplierOptionName:
          type: string
          description: Product option (tour option) name (name associated with product option identifier).
        TourDepartureTime:
          type: string
          description: 'Time of tour option departure. Values should be in time format.


            **Example:** 09:00:00.

            '
          format: time
        Option:
          type: array
          description: Option root element. Contains additional optional information used to uniquely identify product options.
          items:
            type: object
            required:
            - Name
            - Value
            properties:
              Name:
                type: string
                description: Option name
              Value:
                type: string
                description: Option value
    VersionTag:
      description: "Version tag root element. Specifies the version for each changed `DateAvailability`. Version tagging allows availability responses to be tagged with one of: a time-stamp, a text-string, or a numeric identifier. \n\nAttaching this tag will allow our systems to determine which availability response should be taken as the most recent in the event that multiple availability responses for the same product arrive with differing information. \nOur systems will consider the availability response with the most recent timestamp, or highest textual or numeric value as the authoritative response.\n"
      oneOf:
      - type: object
        title: Timestamp
        required:
        - Timestamp
        properties:
          Timestamp:
            type: string
            description: 'Timestamp to determine the order in which this availability response was generated; e.g. `2021-12-02T12:34:56.789012345Z`

              '
            format: date-time
      - type: object
        title: Textual
        required:
        - Textual
        properties:
          Textual:
            type: string
            description: 'Text string of your choosing. Our systems will consider the highest-value string to be that which was sent most recently. E.g., `20121202-V000000231434`

              '
      - type: object
        title: Numeric
        required:
        - Numeric
        properties:
          Numeric:
            type: integer
            description: 'Numeric value of your choosing. Our systems will consider the highest number to be that which was sent most recently. E.g., `553957349573498`

