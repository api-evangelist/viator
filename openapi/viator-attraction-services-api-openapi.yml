  /attraction/reviews:
    get:
      tags:
      - Attraction services
      summary: /attraction/reviews
      operationId: attractionReviews
      description: '

        This service gets reviews related to an attraction. These reviews might be

        associated indirectly through the related products.


        **Note**:


        - Pages generated using data from this endpoint are subject to a **strict no-index policy**. If you are unsure about whether you are correctly following this rule, please reach out to your account manager for advice.


        **Aliases**:


        - [/recommendation/reviews](#operation/attractionReviews)


        - [/seo/reviews](#operation/attractionReviews)

        '
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - in: query
        name: seoId
        description: '**unique numeric identifier** of the attraction for which to retrieve reviews'
        example: 14235
        schema:
          type: integer
      - in: query
        name: sortOrder
        description: 'Sort order for the results; one of:


          - `''SEO_REVIEW_RATING_D''` - sort by traveler rating (descending)

          - `''SEO_REVIEW_RATING_PUBLISHED_DATE_D''` - sort by date of publication (most recent first)

          '
        example: SEO_REVIEW_RATING_D
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          sortOrder:
                            type: integer
                            description: '**sort order** for *this* review'
                          ownerName:
                            type: string
                            description: '**name** of the owner of *this* review'
                          ownerCountry:
                            type: string
                            description: '**country** in which the owner of *this* review is located'
                          productTitle:
                            type: string
                            description: '**title** of the product that *this* review is about'
                          productUrlName:
                            type: string
                            description: '**URL-formatted name** of the product *this* review is about'
                          ownerAvatarURL:
                            type: string
                            description: ignore (Viator only)
                          sslSupported:
                            type: boolean
                            description: ignore (Viator only)
                          publishedDate:
                            type: string
                            description: '**date** on which *this* review was published'
                          productCode:
                            type: string
                            description: '**unique alphanumeric identifier** of the product that *this* review is about'
                          viatorNotes:
                            type: string
                            description: ignore (Viator only)
                          submissionDate:
                            type: string
                            description: '**date** on which *this* review was submitted'
                          rating:
                            type: integer
                            description: '**rating** given by the author of *this* review'
                          review:
                            type: string
                            description: '**text content** of *this* review'
                          ownerId:
                            type: integer
                            description: '**unique numeric identifier** of *this* review''s author'
                          viatorFeedback:
                            type: string
                            description: ignore (Viator only)
                          reviewId:
                            type: integer
                            description: '**unique numeric identifier** for *this* review'
              examples:
                '1':
                  $ref: '#/components/examples/attraction-reviews-example'
