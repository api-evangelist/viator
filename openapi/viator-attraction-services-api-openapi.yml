          descriptionText: ''
          overviewSummary: <div style="">If you’re into American cars, it doesn’t get much better than Las Vegas’ Shelby Heritage Center, the brainchild of race car driver Carroll Shelby. Shelby American is behind the AC Cobra, and has churned out premier performance versions of Mustangs and other cars. Now fans can check out many of the company’s creations.</div><div style=""><br></div><div style=""><b>The Basics</b></div><div style="">Opened in 2014, the Shelby Heritage Center includes the factory, a museum, and a gift shop. Find out more about the specialty car manufacturer’s history and founder, and get up close to many of the cars—including classic Mustangs, the very first Shelby Cobra, and more recent productions. Tours include a visit to the factory, where an area is sectioned off for viewing.&nbsp;</div><div style=""><br></div><div style=""><b>Things to Know Before You Go</b></div><div style=""><ul><li>The Shelby Heritage Center is a must for car enthusiasts and historians.</li><li>Don’t confuse the Shelby Heritage Center with the Shelby American Collection in Boulder, Colorado—the latter features cars donated by owners and collectors.</li></ul></div><div style=""><br></div><div style=""><b>How to Get There</b></div><div style="">Located adjacent to Interstate 15 in Las Vegas, the Shelby Heritage Center is about 10 minutes away from the Strip by car. Taxis and rideshares are readily available.</div><div style=""><br></div><div style=""><b>When to Get There</b></div><div style="">The center is open daily, and guided tours are offered every day but Sunday. If you’re an early riser, get there Saturday morning for the weekly Cars and Coffee event, featuring breakfast food trucks and giveaways. Spring and fall typically see the most pleasant weather—and the biggest crowds.</div><div style=""><br></div><div style=""><b>Drive a Race Car in Las Vegas</b></div><div style="">If looking at cars isn’t enough, head to the Las Vegas Motor Speedway to learn how to maneuver a Ferrari, a Porsche, or maybe a Lamborghini. Get a lesson in the proper driving position, steering techniques, car specs, and racing lines. Then, take several laps around the track on your own.</div>
