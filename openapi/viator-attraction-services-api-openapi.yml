  /attraction/products:
    get:
      tags:
      - Attraction services
      summary: /attraction/products
      operationId: attractionProducts
      description: 'This service gets attraction-related products (for cross-selling purposes)


        **Aliases**:

        - /recommendation/products

        - /seo/products'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - in: query
        name: seoId
        description: '**unique numeric identifier** for the attraction'
        example: 14235
        schema:
          type: integer
      - $ref: '#/components/parameters/topX'
      - in: query
        name: sortOrder
        description: "Sort order for the results; one of:\n\n  - `'SEO_PRODUCT_TOP_SELLERS'` – top sellers (**Note**: What Viator gets paid impacts this sort order)\n  - `'SEO_PRODUCT_REVIEW_AVG_RATING_A'` – traveller rating (low->high)\n  - `'SEO_PRODUCT_REVIEW_AVG_RATING_D'` – traveller rating (high->low)\n  - `'SEO_PRODUCT_PRICE_FROM_A'` – price (low->high) \n  - `'SEO_PRODUCT_PRICE_FROM_D'` – price (high->low)\n"
        example: SEO_PRODUCT_TOP_SELLERS
        schema:
          type: string
      - in: query
        name: currencyCode
        description: '**currency-code** for the currency in which to display pricing details for the products related to the specified attraction.


          **Note:**

          - You must have multiple currencies enabled in order to set the currency using this parameter. Please speak to your account manager if you wish to have this enabled.

          - If you omit this parameter; or, if you do not have multiple currencies enabled, pricing will be returned in the default currency for your account.

          '
        example: EUR
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: array
