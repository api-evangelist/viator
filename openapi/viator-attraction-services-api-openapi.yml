                            type: array
                            description: '**array of numeric identifiers** for the subcategories *this* product falls into'
                            items:
                              type: integer
                          webURL:
                            $ref: '#/components/schemas/webURL'
                          specialReservationDetails:
                            type: string
                            description: ignore (Viator only)
                          sslSupported:
                            type: boolean
                            description: '**ignore (Viator only)**'
                          panoramaCount:
