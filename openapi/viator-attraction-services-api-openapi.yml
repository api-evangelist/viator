servers:
- url: https://viatorapi.viator.com/service
  description: Production server
security:
- API-key: []
- Legacy-API-key: []
tags:
- name: Attraction services
  description: Attraction services
paths:
  /search/attractions:
    post:
      tags:
      - Attraction services
      summary: /search/attractions
      operationId: searchAttractions
      description: '

        This service retrieves a list of attractions associated with the given

        destination


        **Note**:


        - Pages generated using data from this endpoint are subject to a **strict no-index policy**. If you are unsure about whether you are correctly following this rule, please reach out to your account manager for advice.



        **Aliases**:


        - [/search/recommendations](#operation/searchRecommendations)


        - [/search/seo](#operation/searchSeo)

        '
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destId:
                  type: integer
                  description: '**unique numeric identifier** of the destination in which to search for attractions'
                topX:
                  $ref: '#/components/schemas/topX'
                seoType:
                  description: '**search specifier**: one of `''ATTRACTION''` or `''RECOMMENDATION''`'
                  enum:
                  - ATTRACTION
                  - RECOMMENDATION
                sortOrder:
                  type: string
                  description: 'Sort order for the results; one of:

                    - `''RECOMMENDED''` – sorted in order of recommendation (**Note**: What Viator gets paid impacts this sort order)

                    - `''SEO_ALPHABETICAL''` – Alphabetical (A->Z)

                    '
            example:
              destId: 684
              topX: 1-3
              seoType: ATTRACTION
              sortOrder: RECOMMENDED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          sortOrder:
                            type: integer
                            description: '**sort-order* for *this* search result'
                          panoramaCount:
                            type: integer
                            description: '**number** of panoramic images available for *this* attraction'
                          webURL:
                            $ref: '#/components/schemas/webURL'
                          pageUrlName:
                            description: '**URL-formatted title** of the attraction page'
                            type: string
                          primaryDestinationUrlName:
                            type: string
                            description: '**URL-formatted name** of the primary destination'
                          publishedDate:
                            type: string
                            description: '**date** on which *this* review was published'
                          userName:
                            type: string
                            description: ignore (Viator only)
                          seoId:
                            type: integer
                            description: '**unique numeric identifier** for *this* attraction'
                          productCount:
                            type: integer
                            description: '**number of products** available at *this* attraction'
                          title:
                            type: string
                            description: '**natural-language title** of *this* attraction'
                          thumbnailURL:
                            type: string
                            description: '**URL** for the thumbnail image to be displayed for *this* attraction'
                          reviewCount:
                            type: integer
                            description: '**number** of reviews available for *this* attraction'
                          photoCount:
                            type: integer
                            description: '**number** of photos available for *this* attraction'
                          rating:
                            type: integer
                            description: '**average user rating** for *this* attraction'
                          destinationId:
                            type: integer
                            description: '**unique numeric identifier** for *this* attraction'
                          seoType:
                            type: string
                            description: '**indicator**: one of `''ATTRACTION''` or `''RECOMMENDATION''` depending on the type of *this* result'
                          pageTitle:
                            type: string
                            description: '**title** of the page for *this* attraction'
                          editorsPick:
                            type: boolean
                            description: '**indicator**: `true` if only the top (editor''s pick) attractions will be shown'
                          keywords:
                            type: array
                            items:
                              type: object
                              properties:
                                keyword:
                                  type: string
                                  description: '**natural-language keyword or phrase** that describes *this* attraction'
                                keywordId:
                                  type: number
                                  description: '**unique numeric identifier** for *this* keyword'
                          showPhotos:
                            type: boolean
                            description: '**indicator**: `true` if photos should be shown for *this* attraction'
                          primaryDestinationId:
                            type: integer
                            description: '**unique numeric identifier** for the primary destination associated with *this* attraction'
                          primaryDestinationName:
                            type: string
                            description: '**natural-language name** of the primary destination identified by `primaryDestinationId`'
                          thumbnailHiResURL:
                            type: string
                            description: '**URL** for the thumbnail image that should be used for *this* attraction'
                          tabTitle:
                            type: string
                            description: '**title** for the tab on which this attraction is displayed'
                          descriptionIntro:
                            description: '**natural-language introduction** for the description of *this* attraction'
                          descriptionText:
                            type: string
                            description: '**natural-language description** of *this* attraction'
                          showReviews:
                            type: boolean
                            description: '**indicator**: `true` if review should be shown'
                          attractionLatitude:
                            type: number
                            description: '**latitude component** of *this* attraction''s geolocation'
                          attractionLongitude:
                            type: number
                            description: '**longitude component** of *this* attraction''s geolocation'
                          attractionStreetAddress:
                            type: string
                            description: '**street address component** of *this* attraction''s address'
                          attractionCity:
                            type: string
                            description: '**city component** of *this* attraction''s address'
                          attractionState:
                            type: string
                            description: '**state component** of *this* attraction''s address'
                          keywordCount:
                            type: integer
                            description: '**number** of keywords for *this* result'
                          overviewSummary:
                            type: string
                            description: '**HTML-formatted overview summary** for *this* atraction'
                          pagePrimaryLanguage:
                            type: string
                            description: '**language code** for the language that this content is primarily expressed in'
              examples:
                '1':
                  $ref: '#/components/examples/search-attractions-example'
  /attraction:
    get:
      tags:
      - Attraction services
      summary: /attraction
      operationId: attraction
      description: 'This service returns the details of an attraction.


        **Note**:


        - Pages generated using data from this endpoint are subject to a **strict no-index policy**. If you are unsure about whether you are correctly following this rule, please reach out to your account manager for advice.


        **Aliases**:

        - [/recommendation](#operation/attraction)

        - [/seo](#operation/attraction)

        '
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - in: query
        name: seoId
        description: '**unique numeric identifier** for the attraction to retrieve details for'
        example: 14235
        schema:
          type: integer
      - in: query
        name: currencyCode
        description: '**currency-code** for the currency in which to display pricing details for the desired attraction'
        example: EUR
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        panoramaCount:
                          type: integer
                          description: '**number of panoramas** available for this attraction'
                          example: 0
                        webURL:
                          $ref: '#/components/schemas/webURL'
                        userPhotos:
                          type: array
                          items:
                            type: object
                            properties:
                              sortOrder:
                                type: integer
                                description: '**sort order** for *this* result'
                              ownerName:
                                type: string
                                description: '**name** of the owner of *this* photograph'
                              ownerCountry:
                                type: string
                                description: '**natural-language name** of the country that the owner of this photo calls home'
                              productTitle:
                                type: string
                                description: '**title** of the product that *this* photo represents'
                              ownerAvatarURL:
                                type: string
                                description: '**URL** for the avatar image of the owner of this photo'
                              productCode:
                                type: string
                                description: '**unique alpha-numeric identifier** of the product that this photo represents'
                              title:
                                type: string
                                description: '**natural-language title** of the product that this photo represents'
                              caption:
                                type: string
                                description: '**HTML-formatted caption** for *this* photo'
                              thumbnailURL:
                                type: string
                                description: '**URL** for the thumbnail image of *this* photo'
                              ownerId:
                                type: integer
                                description: '**unique numeric identifier** of the owner of *this* photo'
                              editorsPick:
                                type: boolean
                                description: '**indicator**: `true` if this photo is an editor''s pick'
                              photoHiResURL:
                                type: string
                                description: '**URL** for the high-resolution version of *this* photo'
                              photoId:
                                type: integer
                                description: '**unique numeric identifier** for *this* photo'
                              photoURL:
                                type: string
                                description: '**URL** for *this* photo'
                              photoMediumResURL:
                                type: string
                                description: '**URL** for the medium-resolution version of *this* photo'
                              timeUploaded:
