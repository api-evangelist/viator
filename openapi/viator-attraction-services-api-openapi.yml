          descriptionText: "<p>Inside the Mandalay Bay Hotel and Casino is the Shark Reef Aquarium, showcasing more than 2,000 animals displayed in 14 different exhibits and almost 1.6 million gallons of water.</p><p>\n \nThe Shark Reef Aquarium was designed to be a “total sensory experience,” and part of that is achieved by leading visitors through an acrylic tunnel with water nearly surrounding them. This exhibit alone includes 15 different species of sharks along with all the other sea life in the tank.</p><p>\n \nOther species in the aquarium include golden crocodiles, sea turtles and piranhas, none of which are included in the touching pools where visitors can find out what some of the other sea creatures feel like.</p>"
          overviewSummary: '<div style="">Get up close and personal with some of the most fearsome creatures of the deep at Mandalay Bay’s Shark Reef Aquarium. Designed to be a total sensory experience—with two underwater tunnels and multiple tanks and exhibits—the aquarium is home to more than 2,000 animals, including many species of sharks.</div><div style=""><br></div><div style=""><b>The Basics</b></div><div style="">Wander through a viewing tunnel at the Shark Reef Aquarium’s largest exhibit, a shipwreck surrounded by 1.3 million gallons (4.9 million liters) of water. In addition to sharks, you’ll see salt- and freshwater fish, as well as sea turtles, golden crocodiles, giant rays, and more. The touch pool is a favorite among younger visitors, while certified divers have the opportunity to scuba dive in the tanks.</div><div style=""><br></div><div style="">Admission to the aquarium is included in some multi-attraction Las Vegas sightseeing passes.</div><div style=""><br></div><div style=""><b>Things to Know Before You Go</b></div><div style=""><ul><li>Most visitors spend around 45 to 60 minutes at the Shark Reef Aquarium.</li><li>An audio guide is available in English and Spanish.</li><li>Guests staying at the Mandalay Bay Resort can watch the Shark Reef channel on TV.</li></ul></div><div style=""><br></div><div style=""><b>How to Get There</b></div><div style="">The Shark Reef Aquarium is located near the South Convention Center in the Mandalay Bay Resort, at the southern end of Las Vegas Boulevard. You can easily get to the resort by car, taxi, shuttle, or the free Excalibur–Luxor–Mandalay Bay tram.&nbsp;</div><div style=""><br></div><div style=""><b>When to Get There</b></div><div style="">The aquarium is open daily, usually with extended hours on weekends and over the summer. Last entry is an hour before closing. There’s no set schedule for animal feedings, but they often take place between 10am and 4pm.</div><div style=""><b><br></b></div><div style=""><b>Aquariums in Las Vegas</b></div><div style="">Las Vegas has more than 10 aquariums, some of which can be found inside casinos. Besides the Shark Reef, check out these other popular aquariums: the Tank at the Golden Nugget, SeaQuest Las Vegas, the Aquarium at the Silverton Hotel, and the Atlantis Aquarium at the Forum Shops at Caesars Palace.</div>'
