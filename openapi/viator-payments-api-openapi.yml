axonomyAttractions), [v1/product/reviews](#operation/v1ProductReviews), [/v1/product/photos](#operation/v1ProductPhotos) |\n| 28 Sep 2020 | Updated response schema for [/products/tags](#operation/productsTags) |\n| 23 Sep 2020 | Added [Key concepts – Booking questions](#section/Booking-concepts/Booking-questions) section |\n| 22 Sep 2020 | Added [Versioning](#section/Versioning) section |\n| 22 Sep 2020 | Fixed typo in StandardItineraryItem schema (`pointsOfInterestLocation` -> `pointOfIterestLocation`); added explanation of policy window time-stamps & updated response samples in [Workflows - Cancellation policy](#section/Booking-concepts/Cancellation-policy) section | \n| 21 Sep 2020 | Added [Making a booking](#section/Booking-concepts/Making-a-booking) section under Workflows |\n| 20 Sep 2020 | Added `currency` element to [/bookings/hold](#operation/bookingsHold) response schema |\n| 17 Sep 2020 | Breaking change: [/exchange-rates](/#operation/exchangeRates) endpoint refactored |\n| 16 Sep 2020 | <mark>**Note**: ONLY freesale products (those with a confirmation type of \"INSTANT\") are presently able to be booked. See [Ingesting and updating the product catalogue](#section/Workflows/Ingesting-and-updating-the-product-catalogue) (Filtering-out on-request products) for instructions on how to filter-out on-request products from your catalogue</mark> |\n| 16 Sep 2020 | Breaking change: `languageGuideDetails` element in ActiveProduct schema changed to `languageGuides` (array of LanguageGuide schema) |\n| 15 Sep 2020 | Breaking change: removed `travelerPickup` element from [/booking/book](#operation/bookingsBook) request |\n| 10 Sep 2020 | Added [/bookings/book](#operation/bookingsBook) endpoint specification |\n| 1 Sep 2020 | Added `description` element to `MultiDayTourFoodAndDrinks` and `InclusionExclusionItem` schemata; added `version=2.0` to `Accept` request header parameter across all endpoints |\n| 26 Aug 2020 | `CancellationConditionType` schema key strings updated (now \"STANDARD\", \"MODERATE\", \"STRICT\" & \"ALL_SALES_FINAL\"; `PricingLineItem` updated (affects /availability/check and /bookings/hold-confirm responses); /availability/* endpoints moved to separate 'Availability' section |\n| 25 Aug 2020 | <mark>**Breaking changes**</mark>: see below |\n| 25 Aug 2020 | Regenerated response samples |\n| 11 Aug 2020 | Updated `paxMix` schema in [/availability/check](#operation/checkAvailability) |\n| 6 Aug 2020 | Added COVID-safety-measure keys to `additionalInfo` schema |\n| 4 Aug 2020 | Added [/bookings/hold](#operation/bookingsHold) endpoint |\n| 28 July 2020 | Added [Ingesting and updating the product catalogue](#section/Workflows/Ingesting-and-updating-the-product-catalogue) section |\n| 23 July 2020 | Added [Product options](), [Cancellation policy](#section/Booking-concepts/Cancellation-policy) sections | \n| 16 Jul 2020 | Added [/bookings/hold](#operation/bookingsHold) endpoint |\n| 3 Jul 2020 | Modified availability endpoint schema and regenerated examples |\n| 1 Jul 2020 | Removed internal-only markup for release |\n| 16 Jun 2020 | Added [Workflows->Cancellation API workflow](#section/Booking-concepts/Cancellation-API-workflow) section\n| 15 Jun 2020 | Removed enum data type specification from `UnavailableDate`, `ageBand`, `CancellationQuoteBookingStatus`, `CancellationResultItemReason` and `CancellationBookingStatus` schemata |\n| 18 May 2020 | Refactored LHS nav to use 'summary' name instead of operationId name |\n| 28 April 2020 | Added `legacyGuide` field to `LanguageGuide` object specification |\n\n### 25 August breaking changes\n\nThe following breaking changes have been made. Please update your OpenAPI specification by downloading from the link at the top of the page.\n\n#### Endpoint URL changes\n\n- /availability-schedule/{product-code} -> [/availability/schedules/{product-code}](#operation/availabilitySchedules)\n- /availability-schedule/bulk -> [/availability/schedules/bulk](/#operation/availabilitySchedulesBulk)\n- /availability-schedule/modified-since -> [/availability/schedules/modified-since](#operation/availabilitySchedulesModifiedSince)\n\n#### Element name changes\n\nA number of name changes have been made to the `Product` schema. This affects the following endpoints:\n\n- [/products/modified-since](#operation/productsModifiedSince)\n- [/products/bulk](#operation/productsBulk)\n- [/products/{product-code}](#operation/products)\n\n| Element | Old name | New name |\n|----------|---------|----------|\n| `cancellationPolicy.badWeather` |  `badWeather` | `cancelIfBadWeather` |   \n| `cancellationPolicy.insufficientTravelers` | `insufficientTravelers` | `cancelIfInsufficientTravelers` |\n| `translationInfo.translationAttributions` | `translationAttributions` | `translationAttribution` | \n| `destinations.isPrimary` | `isPrimary` | `primary` |\n| `inclusions[].otherText` | `otherText` | `otherDescription` |   \n| `itinerary.routes[].pois` | `pois` | `pointsOfInterest` |\n| `itinerary.itineraryItems[].poiLocation` | `poiLocation` | `pointsOfInterestLocation` |\n| `itinerary.routes[].duration.fixedValueinMinutes` | `fixedValueInMinutes` | `fixedDurationInMinutes` |\n| `itinerary.routes[].duration.fromMinutes` | `fromMinutes` | `variableDurationFromMinutes` |\n| `itinerary.routes[].duration.toMinutes` | `toMinutes` | `variableDurationToMinutes` |"
  version: '2.0'
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/au/
servers:
- url: https://api.viator.com/partner
  description: Production server (uses live data)
- url: https://api.sandbox.viator.com/partner
  description: Sandbox server (uses test data)
security:
- API-key: []
tags:
- name: Payments
paths:
  /v1/checkoutsessions/{sessionToken}/paymentaccounts:
    post:
      tags:
      - Payments
      operationId: paymentsCreateToken
      summary: /v1/checkoutsessions/{sessionToken}/paymentaccounts
      description: 'Creates a payment token from raw credit card details for use with the [/bookings/cart/book](#operation/bookingsCartBook) endpoint.


        The URL should not be constructed manually, instead use the `paymentDataSubmissionUrl` value returned from the [/bookings/cart/hold](#operation/bookingsCartHold) endpoint.


        When using the API payment solution, it is a requirement that you implement our fraud prevention solution. See <a href="https://partnerresources.viator.com/travel-commerce/api-payments/#api" target="_blank">Implementing the API Solution</a> for more details.


        **Note**:

        - This endpoint utilises a different domain to other endpoints referenced in the API.

        - This endpoint is only available to <u>affiliate partners with API access level "Full Access + Booking"</u>.

        '
      servers:
      - url: https://api.tapayments.com
        description: Production server (uses live data)
      - url: https://api.staging.tapayments.com
        description: Sandbox server (uses test data)
      security: []
      parameters:
      - name: Content-Type
        in: header
        description: Identifies the payload as application/json.
        required: true
        schema:
          type: string
          example: application/json
      - name: x-trip-clientid
        in: header
        description: 'This is your unique partner identifier, which you can find in the Viator Partner Program: https://partners.viator.com/login'
        required: true
        schema:
          type: string
          example: P0123456789
      - name: x-trip-requestid
        in: header
        description: Any client-side generated request identifier, unique per request.
        required: true
        schema:
          type: string
          example: 9dbb490a-d953-4a9b-875a-728b5f335b29
      - name: User-Agent
        in: header
        description: value should be appropriate to the client you are using, e.g. "curl/8.8.0"
        required: true
        schema:
          type: string
          example: curl/8.8.0
      - name: sessionToken
        in: path
        description: 'The `sessionToken` is obtained from calling the [/bookings/cart/hold](#operation/bookingsCartHold) endpoint and embedded in the `paymentDataSubmissionUrl`.


          **Note:** The `paymentDataSubmissionUrl` value should be used instead of contructing the URL manually.

          '
        required: true
        schema:
          type: string
        example: CSI-P-kwftrgmrbfbglkaw4espjdr52e
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultCardRequest'
            example:
              paymentAccounts:
                creditCards:
                - number: '4111111111111111'
                  cvv: '234'
                  expMonth: '03'
                  expYear: '2026'
                  name: Jane Doe
                  address:
                    country: US
                    postalCode: 02494
        required: true
      responses:
        '200':
          description: Card successfully stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultPaymentResponse'
              example:
                paymentAccounts:
                  creditCards:
                  - persistAccount: false
                    cardType: Visa
                    name: Jane Doe
                    number: ''
                    accountHead: '411111'
                    accountTail: '1111'
                    expMonth: '03'
                    expYear: '2026'
                    cvv: ''
                    address:
                      street: ''
                      street2: ''
                      city: ''
                      state: ''
                      country: US
                      postalCode: 02494
                      phoneNumber: ''
                    accountMetaData:
                      sessionAccountToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                      accountFingerprint: ''
                  bankAccounts: []
                  cvvs: []
                  bankMandates: []
                responseHeader:
                  apiVersion: 1
                  responseId: RES-rciyl2b2q5gidlusbsq3ofht44
                  responseCode: 2000
                  responseMessage: ok
                  errors: []
        '404':
          description: Checkout session expired or not found.
          content:
            application/json:
              example:
                paymentAccounts:
                  creditCards: []
                responseHeader:
                  apiVersion: 1
                  responseId: RES-sa2lfnzy7rdixep2vhte4bjbzq
                  responseCode: 4004
                  responseMessage: Checkout session has expired.
                  errors:
                  - responseStatus: NOT_FOUND
                    responseCode: 4004
                    responseMessage: Checkout session has expired.
                    isExpectedError: true
                    requestFieldPath: param.checkoutsessionid
                    responseDetail: ''
components:
  schemas:
    VaultCardRequest:
      required:
      - paymentAccounts
      type: object
      properties:
        paymentAccounts:
          $ref: '#/components/schemas/PaymentAccountsRequest'
      description: The card submission payload.
    CreditCardRequest:
      required:
      - cvv
      - expMonth
      - expYear
      - name
      - number
      - address
      type: object
      properties:
        number:
          type: string
          description: The full card number, without spaces.
          example: '4111111111111111'
        cvv:
          type: string
          description: The three or four digit CVV.
          example: '234'
        expMonth:
          type: string
          description: Two digit representation of expiry month.
          example: '03'
        expYear:
          type: string
          description: Four digit representation of expiry year.
          example: '2026'
        name:
          type: string
          description: The cardholder's full name.
          example: Jane Doe
        address:
          $ref: '#/components/schemas/Address'
      description: PCI sensitive details for a debit or credit card and relevant metadata.
    PaymentAccounts:
      type: object
      properties:
        creditCards:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/CreditCard'
    AccountMetaData:
      type: object
      properties:
        sessionAccountToken:
          type: string
          description: Token for the submitted card, to be supplied when payment is requested.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    VaultPaymentResponse:
      required:
      - paymentAccounts
      type: object
      properties:
        paymentAccounts:
          $ref: '#/components/schemas/PaymentAccounts'
    Address:
      required:
      - country
      - postalCode
      type: object
      properties:
        country:
          type: string
          description: The country of the registered billing address, in two character ISO_3166-1 alpha-2 format.
          example: US
        postalCode:
          type: string
          description: The post code of the registered billing address. 4-9 alphanumeric characters, optionally separated space.
          example: 02494
      description: Minimal billing address details for cardholder
    PaymentAccountsRequest:
      required:
      - creditCards
      type: object
      properties:
        creditCards:
          type: array
          description: Array of card data, normal use is single item.
          items:
            $ref: '#/components/schemas/CreditCardRequest'
      description: Wrapper element around payment data.
    CreditCard:
      required:
      - accountHead
      - accountTail
      - expMonth
      - expYear
      - name
      type: object
      properties:
        cardType:
          type: string
          description: The name of card network for the card submitted.
          example: Visa
        expMonth:
          type: string
          description: Two digit representation of expiry month.
          example: '03'
        expYear:
          type: string
          description: Four digit representation of expiry year.
          example: '2026'
        name:
          type: string
          description: The cardholder's full name.
          example: Jane Doe
        accountHead:
          type: string
          description: The first six numbers of the card, the BIN portion.
          example: '411111'
        accountTail:
          type: string
          description: The last four numbers of the card.
          example: '1111'
        address:
          $ref: '#/components/schemas/Address'
        accountMetaData:
          $ref: '#/components/schemas/AccountMetaData'
  securitySchemes:
    API-key:
      type: apiKey
      in: header
      name: exp-api-key
