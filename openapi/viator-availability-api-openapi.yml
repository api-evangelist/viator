                partnerNetPrice: 2001
                bookingFee: 0
                commission: 174
                partnerTotalPrice: 2001
          totalPrice:
            price:
              recommendedRetailPrice: 2175
              partnerNetPrice: 2001
              bookingFee: 0
              commission: 174
              partnerTotalPrice: 2001
          extraChargesSummary:
            price:
              recommendedRetailPrice: 2186.26
            mandatory:
              totalExtraCharges: 11.26
              items:
              - name: Test fee 1
                numberOfUnits: 1
                amountPerUnit: 5.63
                totalAmount: 5.63
                inDestination:
                  amountPerUnit: 10
                  totalAmount: 10
                  currency: NZD
              - name: Test fee 2
                numberOfUnits: 1
                amountPerUnit: 5.63
                totalAmount: 5.63
                inDestination:
                  amountPerUnit: 10
                  totalAmount: 10
