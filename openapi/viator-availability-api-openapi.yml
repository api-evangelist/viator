        translationInfo:
          containsMachineTranslatedText: false
          translationSource: ORIGINAL
  schemas:
    ExtraChargesSummary:
      type: object
      description: "Information about the Extra Charges applicable to this `bookableItem`.\n\n**Note**:\n  - Prices payable to third parties are provided to us by the operator, and may be subject to change.\n"
      required:
      - price
      - mandatory
      properties:
        price:
          type: object
          description: Pricing information applicable to this `bookableItem` including extra charges.
          required:
          - recommendedRetailPrice
          properties:
            recommendedRetailPrice:
              description: 'The recommended retail price value including highest Extra Charges value to be paid in destination by the traveler.

                This value will only be returned if the `bookableItem` passed in the request has Extra Charges.

                '
              type: number
        priceBeforeDiscount:
          type: object
          description: Pricing information applicable to this `bookableItem` including extra charges if no discount had been applied.
          required:
          - recommendedRetailPrice
          properties:
            recommendedRetailPrice:
              description: 'Non-discounted price if price has a discount applied to it.

                It shows what the value of `price.recommendedRetailPrice` would be if no discount had been applied; otherwise, it will be absent.

                '
              type: number
        mandatory:
          description: Information about the mandatory Extra Charges applicable to this `bookableItem`.
          type: object
          required:
          - totalExtraCharges
          - items
          properties:
            totalExtraCharges:
              description: Total amount of Extra Charges considering `bookableItem` and paxMix.
              type: number
            items:
              type: array
              items:
                $ref: '#/components/schemas/ExtraChargesItem'
              description: 'List of all Extra Charges that apply to the `bookableItem`.

                Can be used to build a breakdown list of costs.


                Each item corresponds to a product Exclusion that requires Extra Charges to be paid.

                '
    TimedEntry:
      type: object
      required:
      - startTime
      properties:
        startTime:
          type: string
          pattern: (?s).*[\S].*
          description: 'Starting time for this timed entry

            - **Example**: `"09:00"`

            '
        unavailableDates:
          type: array
          description: Dates on which this timed entry is unavailable. If no unavailable dates exist, this array will be absent from the response.
          items:
            $ref: '#/components/schemas/UnavailableDate'
    PartnerNetPrice:
      type: number
      description: The non-booking fee component of the total amount that Viator will invoice the merchant for this item
    PriceObjectSubtotal:
      description: Components of this price
      allOf:
      - $ref: '#/components/schemas/PriceObject'
    TranslationDetails:
      type: object
      description: Information about whether the text in this response was machine-translated
      required:
      - containsMachineTranslatedText
      - translationSource
      properties:
        containsMachineTranslatedText:
          type: boolean
          description: Indicates whether this product description utilizes text in any of its natural language fields that was automatically machine-translated with no human oversight
        translationSource:
          type: string
          description: "One of:\n- `\"MACHINE\"` – The text provided by the supplier is in a **different language** and has been **automatically translated** by our systems with no human oversight.\n- `\"ORIGINAL\"` – The text provided by the supplier is in the language that is standard for their locale.\n- `\"MANUAL\"` – The text provided by the supplier was in a different language to the standard for their locale; however, whether this is a direct translation of the original text (performed either by machine or human) or whether it is a customised description for speakers of this language is not known. \n"
        translationAttribution:
          type: string
          description: "Value specifying the machine-translation service vendor. At present, translation attribution is not a requirement.\n\n  - **Example**: `\"GOOGLE\"`\n"
    CheckAvailabilityResponse:
      type: object
      required:
      - currency
      - productCode
      - travelDate
      - bookableItems
      properties:
        currency:
          type: string
          pattern: (?s).*[\S].*
          description: Currency in which pricing is expressed in this response (as specified in the request)
        productCode:
          type: string
          pattern: (?s).*[\S].*
          description: Product code of the product that this availability response pertains to
        travelDate:
          type: string
          format: date
          description: 'Date of travel for all bookable items returned in this response (relative to the time zone in which the product operates)

            '
        bookableItems:
          type: array
          description: Bookable items for this product
          items:
            $ref: '#/components/schemas/CheckAvailabilityBookableItem'
    BulkAvailabilityScheduleRequest:
      type: object
      required:
      - productCodes
      properties:
        productCodes:
          type: array
          maxItems: 500
          description: List of product codes for which to retrieve availability schedules
          items:
            type: string
            pattern: (?s).*[\S].*
    BulkAvailabilityScheduleResponse:
      type: object
      required:
      - availabilitySchedules
      properties:
        availabilitySchedules:
          type: array
          description: Array of availability schedule objects
          items:
            $ref: '#/components/schemas/ProductAvailabilitySchedule'
    LineItemPriceObject:
      type: object
      required:
      - price
      properties:
        price:
          description: Current price
          allOf:
          - $ref: '#/components/schemas/PriceObject'
        priceBeforeDiscount:
          description: Non-discounted price if `price` has a discount applied to it
          allOf:
          - $ref: '#/components/schemas/PriceObject'
    AvailabilityScheduleSummary:
      type: object
      description: 'Information about the lowest price available for this product


        **Note**: The pricing information given here is based on the recommended retail price (RRP). While affiliate partners must sell at this price, merchant partners set their own prices according to their own margins and booking fees; therefore, merchant partners must calculate their own from-price for display, rather than using these values, unless they have elected to sell at the RRP.

        '
      required:
      - fromPrice
      properties:
        fromPrice:
          type: number
          description: 'Lowest per-person retail price for this product, calculated according to the price for a group of at least two standard participants (or, the smallest bookable group if more than two participants are required) for a period not exceeding 384 days into the future.

            This value can be used to advertise a ''from''-price; e.g., "From $99 per person"

            '
        fromPriceBeforeDiscount:
          type: number
          description: 'If the product is presently discounted, this field shows what the value of `fromPrice` would be if no discount had been applied; otherwise, it will be absent.

            '
    ProductBookableItemSchedule:
      type: object
      required:
      - seasons
      properties:
        productOptionCode:
          type: string
          description: 'Product option code for this bookable item schedule


            For more information see: [Key concepts: Product options](#section/Key-concepts/Product-options)

            '
        seasons:
          type: array
          description: Descriptions of pricing and availability information as they pertain to periods of time
          items:
            $ref: '#/components/schemas/BookableItemSeason'
    PricingRecord:
      type: object
      properties:
        daysOfWeek:
          type: array
          description: "Array of machine-interpretable strings representing days of the week on which this pricing and availability information applies during the period from `startDate` to `endDate`\n\nAny of:\n  \n  - `\"MONDAY\"`            \n  - `\"TUESDAY\"`              \n  - `\"WEDNESDAY\"`              \n  - `\"THURSDAY\"`              \n  - `\"FRIDAY\"`              \n  - `\"SATURDAY\"`              \n  - `\"SUNDAY\"`\n"
          items:
            type: string
        timedEntries:
          type: array
          description: Array of starting times and unavailability information for this product option code if timed entry is applicable; otherwise, this array will not be included in the response
          items:
            $ref: '#/components/schemas/TimedEntry'
        pricingDetails:
          type: array
          description: Pricing details for this season
          items:
            $ref: '#/components/schemas/PricingDetails'
        unavailableDates:
          type: array
          description: Dates on which this product is unavailable during the season. If no unavailable dates exist, this array will be absent from the response.
          items:
            $ref: '#/components/schemas/UnavailableDate'
    RecommendedRetailPrice:
      type: number
      description: The recommended retail price for the item and the price at which the product is sold on the Viator.com site
    OperatingHours:
      type: object
      required:
      - opensAt
      - closesAt
      properties:
        opensAt:
          type: string
          description: Opening time; e.g. `"08:30"`
          pattern: (?s).*[\S].*
        closesAt:
          type: string
          description: Closing time; e.g. `"17:30"`
          pattern: (?s).*[\S].*
    LineItemPriceObjectSubtotal:
      type: object
      description: Subtotal pricing for this line item, including discount information if available
      required:
      - price
      properties:
        price:
          $ref: '#/components/schemas/PriceObjectSubtotal'
        priceBeforeDiscount:
          $ref: '#/components/schemas/PriceObjectSubtotal'
    NumberOfTravelers:
      type: integer
      description: The number of travelers that this line-item describes the subtotal price for.
    ProductAvailabilitySchedule:
      type: object
      required:
      - productCode
      - bookableItems
      - currency
      - summary
      properties:
        productCode:
          type: string
          pattern: (?s).*[\S].*
          description: Unique identifier for this product
        bookableItems:
          description: Bookable items for this product
          type: array
          items:
            $ref: '#/components/schemas/ProductBookableItemSchedule'
        currency:
          type: string
          pattern: (?s).*[\S].*
          description: Three letter currency code for all pricing information in this response; based on the supplier's currency.
        summary:
          $ref: '#/components/schemas/AvailabilityScheduleSummary'
        extraChargesSummary:
          $ref: '#/components/schemas/AvailabilityScheduleExtraChargesSummary'
    PricingDetails:
      type: object
      required:
      - price
      properties:
        pricingPackageType:
          type: string
          description: "Machine-interpretable value indicating the pricing type; one of: \n\n  - `\"PER_PERSON\"` - pricing is calculated per-person            \n  - `\"UNIT\"` - pricing is calculated per-group/unit\n"
        minTravelers:
          type: integer
          description: '**Minimum** number of travelers required to book to be eligible for this price'
        maxTravelers:
          description: '**Maximum** number of travelers required to book to be eligible for this price'
          type: integer
        ageBand:
          type: string
          description: "Machine-interpretable value indicating the age-band to which this price applies; one of:\n\n  - `\"ADULT\"`\n  - `\"SENIOR\"`\n  - `\"YOUTH\"`            \n  - `\"CHILD\"`\n  - `\"INFANT\"`\n  - `\"TRAVELER\"`\n"
        price:
          $ref: '#/components/schemas/BasicPriceWithSpecial'
    Special:
      allOf:
      - $ref: '#/components/schemas/PriceObject'
      - type: object
        properties:
          offerStartDate:
            type: string
            format: date
            description: 'The special offer is effective <u>for tickets purchased</u> **from** this date

              '
          offerEndDate:
            type: string
            format: date
            description: 'The special offer is effective <u>for tickets purchased</u> **until** this date

              '
          travelStartDate:
            type: string
            format: date
            description: 'The special offer is effective <u>for travel</u> **from** this date

              '
          travelEndDate:
            type: string
            format: date
            description: 'The special offer is effective <u>for travel</u> **until** this date

              '
    ExtraChargesItemInDestinationCurrency:
      type: object
      description: The Extra Charges amount in destination currency.
      required:
      - amountPerUnit
      - totalAmount
      - currency
      properties:
        amountPerUnit:
          type: number
          description: "The cost per one Extra Charges in Destination currency.\n\n**Note**:\n  - Prices payable to third parties are subject to change due to Exchange rates fluctuations between the request time and the travelDate.\n"
        totalAmount:
          type: number
          description: "Total amount of all Extra Charges in Destination currency.\n\n**Note**:\n  - Prices payable to third parties are subject to change due to Exchange rates fluctuations between the request time and the travelDate.\n"
        currency:
          description: The supplier preferred currency to be paid in Destination.
          type: string
    AvailabilityScheduleExtraChargesSummary:
      type: object
      description: Information about the lowest price with extra charges available for this product
      required:
      - fromPrice
      - extraCharges
      properties:
        fromPrice:
          type: number
          description: '`fromPrice` value including `extraCharges` value to be paid in destination by the traveler based on their age, day of the week, time of the year or any other criteria defined by the supplier.

            This value will only be returned if the product has Extra Charges in at least one `bookableItem`.

            '
        fromPriceBeforeDiscount:
          type: number
          description: 'If the product is presently discounted, this field shows what the value of `fromPrice` would be if no discount had been applied; otherwise, it will be absent.

            '
        extraCharges:
          type: number
          description: 'The highest amount that a traveler could be asked to pay in-destination based on their age, day of the week, time of the year or any other criteria defined by the supplier for the `bookableItem` used to calculate the starting price.

            '
    ExtraChargesItem:
      type: object
      description: List of extra charges. Partners can use this to build a breakdown list of costs.
      required:
      - name
      - numberOfUnits
      - amountPerUnit
      - totalAmount
      - inDestination
      properties:
        name:
          type: string
          description: Extra Charges description.
        numberOfUnits:
          type: number
          description: 'How many times the Extra Charges applies.


            If the Extra Charges value is to be charged per person this value will match `numberOfTravelers` passed in the request.


            If the Extra Charges value is to be charged per unit this value will match the amount of groups/units in the request.

            '
        amountPerUnit:
          type: number
          description: The amount per unique Extra Charges.
        totalAmount:
          type: number
          description: Total amount of all Extra Charges for a given item.
        inDestination:
          $ref: '#/components/schemas/ExtraChargesItemInDestinationCurrency'
    UnavailableDate:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Date on which the product is unavailable
        reason:
          type: string
          description: "Machine-interpretable reason code indicating why this bookable item is unavailable on this date; one of:\n\n  - `\"NOT_OPERATING\"` - product is not operating on this date\n  - `\"SOLD_OUT\"` - this option is unavailable because it has sold out\n"
    CheckAvailabilityBookableItem:
      type: object
      description: Details of this bookable item
      required:
      - available
      properties:
        productOptionCode:
          type: string
          description: 'Product option code for this bookable item


            For more information see: [Key concepts: Product options](#section/Key-concepts/Product-options)

            '
        startTime:
          type: string
          description: 'Starting time for this bookable item relative to the time zone in which this product operates

            - **Example**: `"09:00"`

            '
        available:
          type: boolean
          description: '`true` if this item is available to be booked'
        capacity:
          $ref: '#/components/schemas/CapacityObject'
        unavailableReason:
          type: string
          description: "Machine-interpretable reason code indicating why this bookable item is unavailable (when `available` is `false`); one of:\n\n  - `\"NOT_OPERATING\"` - product is not operating on this date\n  - `\"SOLD_OUT\"` - this option is unavailable because it has sold out\n  - `\"PAST_BOOKING_CUTOFF\"` - it is too near to the product's starting time to book this item\n  - `\"TRAVELER_MISMATCH\"` - this item is not available for the specified passenger mix\n  - `\"UNKNOWN\"` - the reason is unknown\n"
        lineItems:
          type: array
          description: 'Components of total price, each consisting of passenger(s) from a single

            age band.


            **Note**: This element **will not** be returned in the case that `unavailableReason` is `TRAVELER_MISMATCH`.

            '
          items:
            $ref: '#/components/schemas/PricingLineItem'
        totalPrice:
          allOf:
          - type: object
            description: 'Total price for this bookable item.


              **Note**: This element **will not** be returned in the case that `unavailableReason` is `TRAVELER_MISMATCH`.

              '
          - $ref: '#/components/schemas/LineItemPriceObject'
        extraChargesSummary:
          $ref: '#/components/schemas/ExtraChargesSummary'
        translationInfo:
          $ref: '#/components/schemas/TranslationDetails'
    AvailabilitySchedulesResponse:
      allOf:
      - $ref: '#/components/schemas/BulkAvailabilityScheduleResponse'
      - type: object
        properties:
          nextCursor:
            type: string
            description: 'A cursor to use when fetching the next set of products.

              - **Example**: `"MTU3NDA0NDczOQ=="`

              '
    BookableItemSeason:
      type: object
      required:
      - startDate
      properties:
        startDate:
          type: string
          format: date
          description: 'Starting date for when this pricing and availability information applies

            - **Example**: `"2019-01-01"`

            '
        endDate:
          type: string
          format: date
          description: "Ending date for when this pricing and availability information applies. \n- **Note**: if this element is not returned in the response, the season extends 384 days (approximately 12.5 months) into the future from the present time.\n- **Example**: `\"2019-03-31\"`\n"
        pricingRecords:
          type: array
          description: Pricing records for this season
          items:
            $ref: '#/components/schemas/PricingRecord'
        operatingHours:
          type: array
          description: 'Details about hours of operation for this season

            '
          items:
            $ref: '#/components/schemas/DayOperatingHours'
    CheckAvailabilityRequest:
      type: object
      required:
      - productCode
      - paxMix
      - currency
      - travelDate
      properties:
        productCode:
          type: string
          pattern: (?s).*[\S].*
          description: Retrieve availability details for the product identified by this product code
        productOptionCode:
          type: string
          description: 'Retrieve availability details for the product option (tour grade) identified by this product option code


            For more information see: [Key concepts: Product options](#section/Key-concepts/Product-options)

            '
        startTime:
          type: string
          format: time
          description: 'Retrieve availability details only for items that start at this time. If this parameter is omitted, information about **all** available starting times for the specified date will be included in the response.

            - **Example**: `"17:15"`

            '
        travelDate:
          type: string
          format: date
          description: Retrieve availability details for items that operate on this date
        currency:
          type: string
          pattern: (?s).*[\S].*
          description: 'Display pricing in the currency identified by this 3-letter code

            - **Example**: `"USD"`

            '
        paxMix:
          type: array
          description: Passenger-mix information
          items:
            $ref: '#/components/schemas/PaxMixItem'
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
          description: "Timestamp of the request. \n\n**Example**: `\"2019-09-17T03:20:45.737043Z\"`\n"
        trackingId:
          type: string
          description: "Tracking identifier for this error response. \n\n**Example**: `\"0A871A13:DE2A_0A8712F9:01BB_5DCCC98C_260DAA:0D5B\"`\n"
    PaxMixItem:
      type: object
      required:
      - ageBand
      - numberOfTravelers
      properties:
        ageBand:
          type: string
          pattern: (?s).*[\S].*
          description: "Machine-interpretable value indicating the age-band that this/these\ntraveler(s) fall into; one of:\n\n  - `\"ADULT\"`\n  - `\"SENIOR\"`\n  - `\"YOUTH\"`\n  - `\"CHILD\"`\n  - `\"INFANT\"`\n  - `\"TRAVELER\"`\n\nThe valid age-band identifiers for the product are provided in the `pricingInfo.ageBands[]` array in the [product content response](#section/Key-concepts/Content-ingestion-endpoints). The `\"TRAVELER\"` age-band is to be used when the `pricingInfo.type` is `\"UNIT\"`; i.e., unit or group pricing.\n\nTo learn more about how to implement age bands, see the following guide: [Implementing age bands & pax mix](https://partnerresources.viator.com/travel-commerce/merchant/agebands-pax-mix?source=specs)\n"
        numberOfTravelers:
          type: integer
          description: Number of travelers/passengers in this age-band
    PriceObject:
      type: object
      required:
      - recommendedRetailPrice
      - partnerNetPrice
      - bookingFee
      - partnerTotalPrice
      properties:
        recommendedRetailPrice:
          $ref: '#/components/schemas/RecommendedRetailPrice'
        partnerNetPrice:
          $ref: '#/components/schemas/PartnerNetPrice'
        bookingFee:
          type: number
          description: "The booking fee component of the total amount that Viator will invoice the merchant for the sale of this item\n\n**Note**: \n- The rate applied is given in the merchant's contract with Viator\n- This element is only relevant to <u>merchant partners</u> using the <u>markup pricing model</u>\n"
        commission:
          type: number
          description: "The amount the merchant will receive as a commission for the sale of this item \n\n**Note**: This element is only relevant and will only be returned to merchant partners using the commission-based pricing model\n"
        partnerTotalPrice:
          type: number
          description: 'The total amount that Viator will invoice the merchant for the sale of this item


            See the following article to learn more about how pricing works in this API: [Calculating Product Pricing](https://partnerresources.viator.com/travel-commerce/merchant/pricing?source=specs)

            '
    PricingLineItem:
      type: object
      required:
      - numberOfTravelers
      - subtotalPrice
      properties:
        ageBand:
          type: string
          description: "Machine-interpretable value indicating the age-band of the travelers that\nthis line-item describes the subtotal price for; one of:\n\n  - `\"TRAVELER\"`\n  - `\"ADULT\"`\n  - `\"CHILD\"`\n  - `\"YOUTH\"`\n  - `\"INFANT\"`\n  - `\"SENIOR\"`\n\n  To learn more about how to implement age bands, see the following guide: [Implementing age bands & pax mix](https://partnerresources.viator.com/travel-commerce/merchant/agebands-pax-mix?source=specs)\n"
        numberOfTravelers:
          $ref: '#/components/schemas/NumberOfTravelers'
        subtotalPrice:
          $ref: '#/components/schemas/LineItemPriceObjectSubtotal'
    DayOperatingHours:
      type: object
      required:
      - dayOfWeek
      - openTimes
      properties:
        dayOfWeek:
          type: string
          description: Day of the week that these operating hours pertain to
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
        operatingHours:
          type: array
          description: Opening and closing times for this day of the week
