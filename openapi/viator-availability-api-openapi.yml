servers:
- url: https://api.viator.com/partner
  description: Production server (uses live data)
- url: https://api.sandbox.viator.com/partner
  description: Sandbox server (uses test data)
security:
- API-key: []
tags:
- name: Availability
paths:
  /availability/check:
    post:
      tags:
      - Availability
      summary: /availability/check
      description: 'Check real-time availability and pricing for a product depending on the date, pax-mix, start time and/or product option.


        We recommend using the pricing information returned by this endpoint as the source of truth for the amount you will be invoiced by Viator for the sale of the product in question.


        The third response example – 265910P1 (commission payment model) – shows the alternative PriceObject for merchants using the commission payment model.


        **Note**: This service should only be used to determine the availability of a product immediately prior to booking. Bulk operations pertaining to product availability; e.g., generating a calendar of availability for a product, should use the availability schedule endpoints.


        (Response sample generated on: 2021-04-06)'
      operationId: availabilityCheck
      parameters:
      - $ref: '#/components/parameters/accept'
      requestBody:
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/CheckAvailabilityRequest'
            examples:
              5010SYDNEY:
                value:
                  productCode: 5010SYDNEY
                  travelDate: '2020-12-12'
                  currency: AUD
                  paxMix:
                  - ageBand: ADULT
                    numberOfTravelers: 2
                  - ageBand: CHILD
                    numberOfTravelers: 2
              46334P42:
                value:
                  productCode: 46334P42
                  travelDate: '2020-12-30'
                  currency: AUD
                  paxMix:
                  - ageBand: TRAVELER
                    numberOfTravelers: 7
              265910P1:
                value:
                  productCode: 265910P1
                  travelDate: '2020-11-30'
                  currency: AUD
                  paxMix:
                  - ageBand: ADULT
                    numberOfTravelers: 2
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/CheckAvailabilityResponse'
              examples:
                5010SYDNEY:
                  $ref: '#/components/examples/availability-check-example-5010SYDNEY'
                46334P422:
                  $ref: '#/components/examples/availability-check-example-46334P42'
                265910P1 (comnmission pricing model):
                  $ref: '#/components/examples/availability-check-example-265910P1'
                128216P66 (extra charges):
                  $ref: '#/components/examples/availability-check-example-128216P66'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: object
                  properties:
                    code:
                      description: 'Code for this error type


                        **Example**: `"NOT_FOUND"`

                        '
                    message:
                      description: 'Details of this error


                        **Example**: `"No bookable items found for the request"`

                        '
                - type: object
                  example:
                    code: NOT_FOUND
                    message: No bookable items found for the request
                    timestamp: '2019-09-17T03:20:45.737043Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /availability/schedules/{product-code}:
    get:
      tags:
      - Availability
      summary: /availability/schedules/{product-code}
      description: 'Get availability and pricing details for all product options of the requested product. The pricing is returned in the supplier''s currency. We recommend using the /exchange-rates endpoint to get the Viator exchange rates and apply them for pricing conversion.


        **Note**: This endpoint **should not** be used for ingesting or updating the availability and pricing details for the entire catalog of Viator products. Instead, please use the /availability/schedules/modified-since endpoint for that purpose.


        (Response sample generated on: 2021-03-12)'
      operationId: availabilitySchedules
      parameters:
      - $ref: '#/components/parameters/accept'
      - name: product-code
        in: path
        description: Retrieve availability details for the product identified by this product code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ProductAvailabilitySchedule'
              examples:
                5010SYDNEY:
                  $ref: '#/components/examples/availability-schedules-5010SYDNEY-example'
                10175P18 (timed entry):
                  $ref: '#/components/examples/availability-schedules-46334P42-example'
                265910P1 (with discount):
                  $ref: '#/components/examples/availability-schedules-265910P1-example'
                128216P66 (extra charges):
                  $ref: '#/components/examples/availability-schedules-128216P66-example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /availability/schedules/bulk:
    post:
      tags:
      - Availability
      summary: /availability/schedules/bulk
      description: 'Get availability and pricing details for all product options of all requested products. The pricing is returned in the supplier''s currency. We recommend using the /exchange-rates endpoint to get the Viator exchange rates and apply them for pricing conversion.


        **Note**: This endpoint **should not** be used for ingesting or updating the availability and pricing details for the entire catalog of Viator products. Instead, please use the /availability/schedules/modified-since endpoint for that purpose.


        (Response sample generated on: 2021-03-12)'
      operationId: availabilitySchedulesBulk
      parameters:
      - $ref: '#/components/parameters/accept'
      requestBody:
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/BulkAvailabilityScheduleRequest'
            example:
              productCodes:
              - 265910P1
              - 5010SYDNEY
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/BulkAvailabilityScheduleResponse'
              examples:
                '1':
                  $ref: '#/components/examples/availability-schedules-bulk-example'
                extra charges:
                  $ref: '#/components/examples/availability-schedules-bulk-extra-charges-example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /availability/schedules/modified-since:
    get:
      tags:
      - Availability
      summary: /availability/schedules/modified-since
      description: 'Get full future availability details for all products modified since the specified time. The pricing is returned in the supplier''s currency. We recommend using the /exchange-rates endpoint to get the Viator exchange rates and apply them for pricing conversion. Initiate a full ingestion only to establish your local copy; this should be a rare occurrence compared to regular updates. Fetch incremental updates through this endpoint on an hourly basis. You are welcome to poll for updates as frequently as every 15 minutes if desired. Be mindful that excessive frequency beyond these recommendations may trigger rate limits.


        (Response sample generated on: 2021-03-12)'
      operationId: availabilitySchedulesModifiedSince
      parameters:
      - name: cursor
        in: query
        description: 'Pagination cursor received from a previous call to **this** endpoint that

          points to the desired starting point for the results.


          **Note**: Pagination will come into play when the number of results

          exceeds the figure given in the `count` parameter. In this case, pass

          the content of the `nextCursor` element for the value of `cursor` to

          receive the next page of results. The final page of results will not

          include the `nextCursor` element. For more information, see: [Ingesting

          and updating availability schedules](#section/Workflows/Ingesting-and-updating-availability-schedules).

          - Example: `''MTYwNTA2ODAwOXw1NjcyUDk=''`

          '
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: "The maximum number of products to be returned in response. \n- Maximum allowed and default value: `500`\n"
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - name: modified-since
        in: query
        description: "Only retrieve availabilty schedules that have been modified since the date and time (UTC) specified by this timestamp\n\n**Note**: \n- As this is a query parameter, colons (i.e., `:`) in the timestamp should be URL-encoded as `%3A`; e.g.: \"`2020-09-30T00%3A00%3A01.737043Z`\"\n- Using this parameter is <u>not recommended</u> as the standard pagination method; rather, use the `cursor` parameter to ensure all availability schedule updates are captured during ingestion.\n"
        required: false
        schema:
          type: string
          format: date-time
          pattern: ^(-?(?:[1-9][0-9]*)?[0-9]{4})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9])T(2[0-3]|[01][0-9])\%3A([0-5][0-9])\%3A([0-5][0-9])(\.[0-9]+)?(Z|[+-](?:2[0-3]|[01][0-9]):[0-5][0-9])?$
      - $ref: '#/components/parameters/accept'
      responses:
        '200':
          description: Success
          headers:
            X-Unique-ID:
              $ref: '#/components/headers/XUniqueId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/AvailabilitySchedulesResponse'
              examples:
                '1':
                  $ref: '#/components/examples/availability-schedules-modified-since-example'
                24380P927 (extra charges):
                  $ref: '#/components/examples/availability-schedules-modified-since-extra-charges-example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  headers:
    RateLimit-Reset:
      required: true
      schema:
        type: string
        description: 'The fixed window in time, in seconds, which represents when a limit is fully replenished. For informational purposes only.

          '
    XUniqueId:
      required: true
      schema:
        type: string
        description: 'Tracking identifier for this response. Please include the value of this field when making help requests.

          - **Example**: `"0A871A13:DE2A_0A8712F9:01BB_5DCCC98C_260DAA:0D5B"`

          '
    Retry-After:
      required: true
      schema:
        type: string
        description: 'The fixed window in time, in seconds, which represents when a limit is fully replenished. For informational purposes only.

          '
    RateLimit-Remaining:
      required: true
      schema:
        type: string
        description: 'Remaining requests for this endpoint for a given window. For informational purposes only

          '
    RateLimit-Limit:
      required: true
      schema:
        type: string
        description: 'Total limit of requests for this endpoint for a given window. For informational purposes only.

          '
