  /bookings/cancel-reasons:
    get:
      tags:
      - Booking services
      description: 'Retrieves a dictionary of unique identification codes (`cancellationReasonCode`) and their associated natural-language descriptions (`cancellationReasonText`).


        For information on how to use this service, see: Cancellation API workflow


        **Note**:


        * This service requires exp-api-key to be included as a header parameter. Please speak to your account manager if you have not yet been issued an exp-api-key.

        * The base URL for the server for this endpoint is different from the older endpoints described in this document. Use `https://api.sandbox.viator.com/partner/cancel-reasons`'
      summary: /bookings/cancel-reasons
      operationId: cancellationReasons
      servers:
      - url: https://api.sandbox.viator.com/partner
        description: Sandbox server (uses test data)
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CancellationReasonsResponse'
              examples:
                '1':
                  $ref: '#/components/examples/cancel-reasons-example'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401_UNAUTHORIZED'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/406_NOT_ACCEPTABLE'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500_INTERNAL_SERVER_ERROR'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503_SERVICE_UNAVAILABLE'
