  /booking/book:
    post:
      tags:
      - Booking services
      summary: /booking/book
      operationId: bookingBook
      description: 'Make a booking


        **Note**:

        - This endpoint is only available to merchant partners.

        - The amount that you will be invoiced for the sale of this tour (in the specified currency) is given in the `totalPrice` element in the response from this endpoint.

        - As some products are booked on external supplier systems, it may take > 90s to receive a response from this endpoint. For this reason, we recommend setting your internal time-out for this service to **120s**. In the event that this service does time-out, or you receive a HTTP 500 error, you should check the status of the booking using the /booking/status endpoint to ensure the booking was not created before you attempt to make the booking again.


        For more information, see:


        - Cancellation policy

        - Booking concepts

        - Booking process flow

        - Making a booking

        - Supplier communications'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      requestBody:
        content:
          application/json:
            examples:
              single_traveler:
                value:
                  demo: true
                  currencyCode: USD
                  partnerDetail:
                    distributorRef: distributorRef100000
                  booker:
                    email: apitest@viator.com
                    homePhone: +61 8 83798517
                    firstname: Homer test
                    surname: Simpson test
                    title: Mr
                    cellPhoneCountryCode: '+61'
                    cellPhone: '0411041041'
                  items:
                  - partnerItemDetail:
                      distributorItemRef: itemRef1000000
                    hotelId: '1091770'
                    pickupPoint: null
                    travelDate: '2020-12-31'
                    productCode: 2280AAHT
                    tourGradeCode: TG1~08:00
                    languageOptionCode: en/SERVICE_GUIDE
                    bookingQuestionAnswers:
                    - questionId: 23
                      answer: 70 kgs
                    specialRequirements: ''
                    travellers:
                    - bandId: 1
                      firstname: Homer test
                      surname: Simpson test
                      title: Mr
                      leadTraveller: true
              per_person_booking_questions:
                value:
                  demo: true
                  currencyCode: USD
                  partnerDetail:
                    distributorRef: distroRef34398534535
                  booker:
                    email: apitest@viator.com
                    firstname: Homer Test
                    surname: Simpson Test
                    title: Mr
                  items:
                  - partnerItemDetail:
                      distributorItemRef: distroItemRef8348234535_1
                    hotelId: null
                    pickupPoint: null
                    travelDate: '2020-12-30'
                    productCode: 100022P1
                    tourGradeCode: TG1
                    languageOptionCode: en/SERVICE_GUIDE
                    bookingQuestionAnswers:
                    - questionId: 5
                      answer: 0123456789, 9876543210
                    - questionId: 4
                      answer: Australia, Fiji
                    - questionId: 3
                      answer: 01 July 2022, 31 May 2022
                    specialRequirements: ''
                    travellers:
                    - bandId: 1
                      firstname: Homer1
                      surname: Simpson Test
                      title: Mr
                      leadTraveller: true
                    - bandId: 1
                      firstname: Homer2
                      surname: Simpson Test
                      title: Mr
                      leadTraveller: true
            schema:
              type: object
              properties:
                demo:
                  type: boolean
                  description: '**specifier**: `true` if this is a *demo* booking only (demos do not send any notifications, are automatically confirmed and OnRequest products become freesale products. Default value is true. Production must have `demo` set to `false`.'
                currencyCode:
                  type: string
                  description: '**currency code** for the currency the booking will be submitted in (you will be billed in this currency)'
                partnerDetail:
                  type: object
                  description: 'Applicable only for extra partner detail for either partner or merchant partner for sending partner specific information

                    '
                  properties:
                    distributorRef:
                      type: string
                      description: '**unique alphanumeric reference code** for the distributor

                        - Merchant API partners must pass a `distributorRef` at the order (A.K.A. ''itinerary'') level in the `partnerDetail` object. The `distributorRef` passed must be alphanumeric and unique to bookings made by the merchant.

                        - Passing an existing `distributorRef`: If an existing `distributorRef` is passed, the booking with the matching `distributorRef` will be returned in the response and a new booking will not be made. The fields in the response are identical to the response for a new booking.

                        '
                booker:
                  type: object
                  description: '**object** containing details about the primary contact (**note**: this contact needn''t be a traveller)'
                  required:
                  - firstname
                  - surname
                  properties:
                    email:
                      type: string
                      description: '**email address** of the primary contact'
                    homePhone:
                      type: string
                      format: ^[+](?s).*[\S].*
                      description: "**phone number** (home) of the primary contact\n**Note**: \n\n  - Must be included to enable CLC communications\n  - You must perform some additional validation to ensure that this field is correctly formatted prior to sending the booking request. It is essential that this string include the plus (`+`) symbol at the beginning, followed by the country code, followed by the remaining numerals. Spaces, hyphens and parentheses can be included or omitted, but the string must start with the plus symbol and country code; e.g. `+61 400 580 860`\n  - See [Supplier communications](#section/Key-concepts/Supplier-communications) for more information\n"
                    firstname:
                      type: string
                      minLength: 1
                      maxLength: 50
                      description: '**first name** of the primary contact

                        '
                    surname:
                      type: string
                      minLength: 1
                      maxLength: 50
                      description: '**surname** of the primary contact'
                    title:
                      type: string
                      description: '**title** of the primary contact'
                    cellPhoneCountryCode:
                      type: string
                      format: ^[+](\d[^A-z]*?)$
                      description: "**country code** for the telephone number of the lead traveler\n\n**Note**: \n\n  - Must be included to enable CLC communications \n  - This string **must** include the plus (`+`) symbol at the beginning, followed by the remaining numerals.\n  - See [Supplier communications](#section/Key-concepts/Supplier-communications) for more information\n"
                    cellPhone:
                      type: string
                      description: "**telephone number** of the lead traveler\n\n**Note**:\n\n  * Must be included to enable CLC communications\n  * See [Supplier communications](#section/Key-concepts/Supplier-communications) for more information\n"
                items:
                  type: array
                  description: '**array** of items to be booked'
                  items:
                    type: object
                    properties:
                      partnerItemDetail:
                        type: object
                        description: '**object** containing partner details at a per-item level'
                        properties:
                          distributorItemRef:
                            type: string
                            description: '**unique alphanumeric code** for the order (''itinerary'') (merchant API partners must pass a `distributorItemRef` into the `partnerItemDetails` object for each item in *this* object

                              - this code can be any alphanumeric string and is defined by the distributor

                              '
                      hotelId:
                        type: string
                        description: "**specifer** of the hotel\nIf [/product](#operation/product) returns `hotelPickup`: `true` and a list of hotels is available for *this* product in [/booking/hotels](#operation/bookingHotels), a `hotelId` must be captured (as per the hotel service id field); or, use an alternative `hotelId`, such as:\n \n - `\"notBooked\"`: the customer has not yet booked their hotel\n - `\"notListed\"`: the customer's hotel is not listed\n\n If the customer chooses one of these options, the product supplier may need to correspond with the user to find out their pick-up location. The best way to do this is by enabling [Closed-Loop-Communication (CLC)](#section/Merchant-APIs/Supplier-communications).\n"
                      pickupPoint:
                        type: string
                        description: '**details** about the hotel pick-up point (must be provided if the `hotelId` selected by the user is `''notListed''` or if no hotels are returned for *this* product in [/booking/hotels](#operation/bookingHotels) where `hotelPickup` is `true`.'
                      travelDate:
                        type: string
                        description: '**date** of travel for the item in format yyyy-mm-dd'
                      productCode:
                        type: string
                        description: '**unique alphanumeric identifier** of the product to be booked'
                      tourGradeCode:
                        type: string
                        description: '**specifier** of the tour grade to be booked (if tour grades are supplied in [/product](#operation/product), you must allow the customer to select a tour grade code. If no tour grades are available for *this* product, set this to `''DEFAULT''`.)'
                      languageOptionCode:
                        type: string
                        description: '**specifier** of language service provided for this product that has been chosen for this booking (usually in the format langcode/Service eg en/SERVICE_GUIDE. If the product details service [/product](#operation/product) for the product returns a langService, this must be provided.)'
                      bookingQuestionAnswers:
                        type: array
                        description: "**array** of objects containing booking questions and the answers provided for them for *this* product\n- If a booking question is available in the `bookingQuestions` array in the response from [/product](#operation/product) for *this* product, the matching `bookingQuestionAnswers` must be passed to *this* service. \n- If a product does not have any booking questions, you can omit the `bookingQuestionAnswers` array in your request. \n- Any invalid or unrequired booking-question answers that are passed to *this* service will be ignored (and, no exceptions will be raised) \n- You will need to include this array if [/product](#operation/product) returns any questions in the `bookingQuestions` array.\n"
                        items:
                          type: object
                          properties:
                            questionId:
                              type: integer
                              description: '**numeric identifier** for the question (**note**: `questionId` can be retrieved from the [/product](#operation/product) service)'
                            answer:
                              type: string
                              description: '**answer** to the question for the `questionId` listed (recommended length for the answer is 500 characters)


                                **Note**: To specify answers for each traveler, separate the values with a comma as in the per_person_booking_questions request example

                                '
                      specialRequirements:
                        type: string
                        description: '**text field** to capture any additional requirements for the booking, such as dietary requirements or if a wheelchair is required'
                      travellers:
                        type: array
                        description: '**array** of traveler names, details and whether they are the lead traveller'
                        items:
                          type: object
                          properties:
                            bandId:
                              $ref: '#/components/schemas/bandId'
                            firstname:
                              type: string
                              description: '**first name** of *this* traveller'
                            surname:
                              type: string
                              description: '**surname** of *this* traveler'
                            title:
                              type: string
                              description: '**title** of the traveler (e.g `''Mr''`, `''Mrs''`, `''Ms''`, `''Miss''`, `''Mstr''`, `''Dr''`)'
                            leadTraveller:
                              type: boolean
                              description: '**indicator**: `true` if this traveler is the lead traveler'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        sortOrder:
                          type: integer
                          description: '**sort order** for *this* object'
                        rulesApplied:
                          type: string
                          description: ignore (Viator only)
                        omniPreRuleList:
                          type: string
                          description: ignore (Viator only)
                        bookingStatus:
                          $ref: '#/components/schemas/bookingStatus_itinerary'
                        itemSummaries:
                          type: array
                          description: '**array** of item summaries'
                          items:
                            type: object
                            properties:
                              sortOrder:
                                type: integer
                                description: '**sort order** of *this* item summary'
                              rulesApplied:
                                type: string
                                description: ignore (Viator only)
                              bookingStatus:
                                $ref: '#/components/schemas/bookingStatus_item'
                              travellerAgeBands:
                                type: array
                                description: '**array** of objects detailing the traveler age bands'
                                items:
                                  type: object
                                  properties:
                                    sortOrder:
                                      type: integer
                                      description: '**sort order** for *this* age band'
                                    count:
                                      type: integer
                                      description: '**numeric** number of travelers in *this* age band'
                                    pluralDescription:
                                      type: string
                                      description: '**natural-language description** (plural) of *this* age band'
                                    description:
                                      type: string
                                      description: '**natural-language description** (singular) of *this* age band'
                                    ageBandId:
                                      $ref: '#/components/schemas/ageBandId'
                              voucherKey:
                                type: string
                                description: Unique reference for the voucher for this booking that can be used as a request parameter to search for existing bookings using the [/booking/mybookings](#operation/bookingMybookings) and [/booking/pastbooking](#operation/bookingPastbooking) endpoints
                              voucherURL:
                                type: string
                                description: '**URL of the voucher** for *this* product (if available). The customer can access this URL to retrieve their voucher.'
                              voucherRequirements:
                                type: string
                                description: '**natural-language description** of the requirements pertaining to this voucher'
                              productPulledDown:
                                type: boolean
                                description: ignore (Viator only)
                              merchantCancellable:
                                type: boolean
