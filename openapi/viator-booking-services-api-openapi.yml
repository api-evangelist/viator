paths:
  /booking/availability:
    post:
      tags:
      - Booking services
      summary: /booking/availability
      operationId: bookingAvailability
      description: 'Get the tour-grade with the lowest price that is available for a product on each day of the specified month


        This service:

        - returns the tour grade with the lowest price that is available for each day

        - is useful when displaying a calendar of available tours


        For more information, see: Availability services


        **Notes:**

        - /booking/availability/dates provides all availability in one call and is more suitable for calendars, etc.

        - Availability data is limited to a period of **12 months** into the future from the present time on the production server and **6 months** on the sandbox server.'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              productCode: 5010SYDNEY
              currencyCode: AUD
              month: '12'
              year: '2020'
              ageBands:
              - bandId: 1
                count: 1
            schema:
              type: object
              properties:
                productCode:
                  type: string
                  description: '**unique alphanumeric identifier** of the product for which you wish to retrieve tour grade availability information'
                currencyCode:
                  type: string
                  description: '**currency code** for the currency in which to display tour grade pricing information'
                month:
                  type: string
                  description: '**month component** (text format) of the start of the date range for which to retrieve tour grade availability information (must be in the future)'
                year:
                  type: string
                  description: '**year component** (text format) of the start of the date range for which to retrieve tour grade availability information (must be in the future)'
                ageBands:
                  type: array
                  description: '**array of objects** specifying the age bands by which to to filter search results'
                  items:
                    type: object
                    properties:
                      bandId:
                        $ref: '#/components/schemas/ageBandId'
                      count:
                        type: integer
                        description: '**number of people** in *this* age band'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      description: '**object** detailing available tourgrades for the specified age bands and date range for this product'
                      properties:
                        productCode:
                          type: string
                          description: '**unique alphanumeric identifer** of the product that was specified in the request'
                        firstAvailableDate:
                          type: string
                          description: '**first available date** (in plain text format) for the tour grade'
                        lastAvailableDate:
                          type: string
                          description: '**last available date** for the tour grade'
                        availability:
                          type: array
                          description: '**array** of tour grade availability objects'
                          items:
                            type: object
                            properties:
                              sortOrder:
                                type: integer
                                description: '**sort order** of this tour grade availability object'
                              bookingDate:
                                type: string
                                description: '**date** on which *this* tour grade is available to be booked'
                              available:
                                type: boolean
                                description: '**indicator** - `true` if *this* tour grade is available to book'
                              currencyCode:
                                type: string
                                description: '**currency code** of the currency in which product pricing is displayed'
                              retailPrice:
                                type: number
                                description: '**numeric suggested retail price** for *this* tour grade

                                  - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                                  '
                              gradeCode:
                                type: string
                                description: '**alphanumeric identifier** for *this* tour grade'
                              unavailableReason:
                                type: string
                                description: '**natural-language explanation** as to why *this* tour grade is not available to be booked'
                              retailPriceFormatted:
                                type: string
                                description: '**currency-formatted suggested retail price** for *this* tour grade

                                  - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                                  '
                              merchantNetPrice:
                                type: number
                                description: '**numeric merchant net rate** for *this* tour grade

                                  - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                                  '
                              merchantNetPriceFormatted:
                                type: string
                                description: '**currency-formatted merchant net rate** for *this* tour grade

                                  - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                                  '
              examples:
                '1':
                  $ref: '#/components/examples/booking-availability-example'
  /booking/availability/dates:
    get:
      tags:
      - Booking services
      summary: /booking/availability/dates
      operationId: bookingAvailabilityDates
      description: 'Get dates on which a product is available


        This service:

        - retrieves all available dates for a product, excluding days it does not operate and blocked-out dates

        - returns a multi-dimensional array of year-month -> days that have any availabile tour grade or traveler mix

        - useful to present the user with a list of dates for selection on which *this* product is available for booking

        - **Notes**:


        - The user''s desired traveler mix may not be eligible for booking; these details can be displayed when you retrieve its list of tour grades

        - Availability data is limited to a period of **12 months** into the future from the present time on the production server and **6 months** on the sandbox server.'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/productCode'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      description: '**dictionary** of month identifiers (e.g., `''2018-12''`) to an array of days-of-the-month (text) specifying which days of the specified month *this* product is available to be booked"

                        - **Note**: see response sample for object structure

                        '
                      additionalProperties:
                        type: array
                        items:
                          type: string
              examples:
                '1':
                  $ref: '#/components/examples/booking-availability-dates-example'
  /booking/availability/tourgrades:
    post:
      tags:
      - Booking services
      summary: /booking/availability/tourgrades
      operationId: bookingAvailabilityTourgrades
      description: 'Get the tour grades of a product that are currently available


        This service reports:

        - all tour grades for the specified product, on the specified day, that are available for the specified age bands

        - the pricing breakdown and the total depending on the travel date and traveler mix


        **Note**: Availability data is limited to a period of **12 months** into the future from the present time on the production server and **6 months** on the sandbox server.'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              productCode: 5010SYDNEY
              currencyCode: AUD
              bookingDate: '2020-12-28'
              ageBands:
              - bandId: 1
                count: 1
            schema:
              type: object
              properties:
                productCode:
                  type: string
                currencyCode:
                  type: string
                  description: '**currency code** for the currency in which to display pricing information'
                bookingDate:
                  type: string
                  description: '**date** to enquire about available tour grades for *this* product (must be in the future)'
                ageBands:
                  type: array
                  description: '**array** of ageBand objects'
                  items:
                    type: object
                    properties:
                      bandId:
                        $ref: '#/components/schemas/bandId'
                      count:
                        type: integer
                        description: '**numeric count** of number of travelers in *this* age band'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          sortOrder:
                            type: integer
                            description: '**sort order** for *this* tour grade availability object'
                          bookingDate:
                            type: string
                            description: '**date** on which *this* tour grade operates'
                          ageBands:
                            type: array
                            description: '**array** of age band objects describing the age bands and respective passenger counts allowed to book *this* tour grade; `null` if `ageBandsRequired` is filled and `available` is `false`'
                            items:
                              type: object
                              properties:
                                bandId:
                                  $ref: '#/components/schemas/bandId'
                                count:
                                  type: integer
                                  description: numeric count of number of travelers in this age band
                                bandTotal:
                                  type: number
                                  description: total price (numeric) for all travelers in this age band
                                pricePerTravelerFormatted:
                                  type: string
                                  description: total price (currency-formatted) per traveler in this age band
                                pricePerTraveler:
                                  type: number
                                  description: total price (numeric) per traveler in this age band
                                bandTotalFormatted:
                                  type: string
                                  description: total price (currency-formatted) for all travelers in this age band
                                currencyCode:
                                  type: string
                                  description: currency code for the currency in which the prices in this object are denominated
                          ageBandsRequired:
                            type: array
                            description: '**array of arrays** of age band objects describing the traveler mixes eligible to book *this* tour grade; `null` if `ageBands` is filled and `available` is `true`

                              - **note**: multiple objects; structure will depend on available tour grades – see response sample for an example, but the exact result you receive will differ

                              '
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  bandId:
                                    $ref: '#/components/schemas/bandId'
                                  minimumCountRequired:
                                    description: '**minimum number** of passengers from *this* age band required for *this* tour grade'
                                    type: integer
                                  maximumCountRequired:
                                    type: integer
                                    description: '**maximum number** of passengers from *this* age band allowable for *this* tour grade'
                          langServices:
                            description: '**object** detailing language services available for *this* product (will be `null` if `available` is `false`)'
                            type: object
                          gradeCode:
                            type: string
                            description: '**alphanumeric identifier** of *this* tour grade'
                          unavailableReason:
                            type: string
                            description: '**enum specifier of reason for product unavailability** (will be `null` if `available` is `true`)'
                          gradeTitle:
                            type: string
                            description: '**natural-language title** of the tour grade'
                          gradeDepartureTime:
                            type: string
                            description: '**time** of *this* product'
                          gradeDescription:
                            type: string
                            description: '**natural-language description** of the tour grade'
                          defaultLanguageCode:
                            type: string
                            description: '**language code for standard language** for *this* product'
                          available:
                            type: boolean
                            description: '**indicator** - `true` if this tour grade is available to be booked according to the traveler mix specified'
                          retailPrice:
                            type: number
                            description: '**numeric suggested retail price** for *this* tour grade

                              **Note**: will be `0` if `available` is `false`

                              - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                              '
                          retailPriceFormatted:
                            type: string
                            description: '**currency-formatted suggested retail price** for *this* tour grade

                              **Note**: (will be '''' if `available` is `false`)

                              - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                              '
                          merchantNetPrice:
                            type: number
                            description: '**numeric merchant net rate** for *this* tour grade

                              **Note**: will be `0` if `available` is `false`

                              - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                              '
                          merchantNetPriceFormatted:
                            type: string
                            description: '**currency-formatted merchant net rate** for *this* tour grade

                              **Note**: will be empty if `available` is `false`

                              - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                              '
                          currencyCode:
                            type: string
                            description: '**currency code for the specified currency** (will be `''ERROR''` if `available` is `false`)'
              examples:
                '1':
                  $ref: '#/components/examples/booking-availability-tourgrades-example'
  /booking/availability/tourgrades/pricingmatrix:
    post:
      tags:
      - Booking services
      summary: /booking/availability/tourgrades/pricingmatrix
      operationId: bookingAvailabilityTourgradesPricingmatrix
      description: 'Get a pricing matrix that includes availability and tour-grades for a product


        Given a month, this service returns days with available tour grades only (i.e., days which have at least one tourgrade available), and the pricing matrix for that tour grade for that day.


        - **Note**: Availability data is limited to a period of **12 months** into the future from the present time on the production server and **6 months** on the sandbox server.'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              productCode: 2280AAHT
              currenctCode: USD
              month: '12'
              year: '2020'
            schema:
              type: object
              properties:
                productCode:
                  type: string
                  description: '**alphanumeric identifier** of product about which to retrieve tour grade and pricing information'
                currencyCode:
                  type: string
                  description: '**currency code** for the currency in which to display pricing details'
                month:
                  type: string
                  description: '**month of year** (as text) by which to filter results (must be in the future)'
                year:
                  type: string
                  description: '**year** (as text) by which to filter results (must be in the future)'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        bookingMonth:
                          type: string
                          description: '**month of year** (as text) by which to filter results'
                        pricingUnit:
                          type: string
                          description: '**natural-language label** for the pricing terms of this tour grade

                            - see [Understanding the pricingUnit field](#section/Using-the-API/Understanding-the-pricingUnit-field) for more information

                            '
                        dates:
                          type: array
                          description: '**array of tour grade pricing objects** each detailing availability on a single day'
                          items:
                            type: object
                            properties:
                              sortOrder:
                                type: integer
                                description: '**sort order** for *this* tour grade pricing object'
                              bookingDate:
                                type: string
                                description: '**date** on which *this* product operates'
                              tourGrades:
                                type: array
                                description: '**array** of tour grade pricing information objects'
                                items:
                                  type: object
                                  properties:
                                    sortOrder:
                                      description: '**sort order** for *this* tour grade pricing object'
                                      type: integer
                                    gradeCode:
                                      type: string
                                      description: '**alphanumeric identifier** of the tour grade'
                                    gradeTitle:
                                      type: string
                                      description: '**title of tour grade**'
                                    pricingMatrix:
                                      type: array
                                      description: '**array of pricing objects** for *this* tour grade'
                                      items:
                                        type: object
                                        properties:
                                          sortOrder:
                                            type: integer
                                            description: '**sort order** for *this* pricing object'
                                          pricingUnit:
                                            type: string
                                            description: '**natural-language description** of the pricing mode

                                              - see [Understanding the pricingUnit field](#section/Using-the-API/Understanding-the-pricingUnit-field) for more information

                                              '
                                          bookingDate:
                                            type: string
                                            description: '**date** on which *this* product operates'
                                          ageBandPrices:
                                            type: array
                                            description: '**array** of pricing objects by age band'
                                            items:
                                              type: object
                                              properties:
                                                bandId:
                                                  $ref: '#/components/schemas/bandId'
                                                prices:
                                                  type: array
                                                  description: '**array** of pricing detail objects'
                                                  items:
                                                    type: object
                                                    properties:
                                                      sortOrder:
                                                        type: integer
                                                        description: '**sort order** *this* pricing detail object'
                                                      currencyCode:
                                                        type: string
                                                        description: '**currency code** of the currency in which pricing details are displayed'
                                                      price:
                                                        description: '**numeric suggested retail price** for *this* age band

                                                          - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                                                          '
                                                        type: number
                                                      minNoOfTravellersRequiredForPrice:
                                                        type: integer
                                                      priceFormatted:
                                                        type: string
                                                        description: '**currency-formatted suggested retail price** for *this* age band

                                                          - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                                                          '
                                                        example: '799'
                                                      merchantNetPrice:
                                                        type: number
                                                        description: '**numeric merchant net rate** for *this* age band

                                                          - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                                                          '
                                                      merchantNetPriceFormatted:
                                                        type: string
                                                        description: '**currency-formatted merchant net rate** for *this* age band

                                                          - For more information, see: [Merchant pricing](#section/Merchant-APIs/Merchant-pricing)

                                                          '
                                                sortOrder:
                                                  type: integer
                                                  description: '**sort order** for *this* tour grade'
                                                minimumCountRequired:
                                                  description: '**minimum number** of participants required for *this* tour grade'
                                                  type: integer
                                                maximumCountRequired:
                                                  type: integer
                                                  description: '**maximum number** of participants allowed for *this* tour grade'
                              callForLastMinAvailability:
                                type: boolean
                                description: ignore (Viator only)
              examples:
                '1':
                  $ref: '#/components/examples/booking-availablility-tourgrades-pricingmatrix-example'
  /booking/calculateprice:
    post:
      tags:
      - Booking services
      summary: /booking/calculateprice
      operationId: bookingCalculateprice
      description: 'Confirm the price of a tour / activity prior to booking


        For more information, see: Calculating prices


        - **Note**: Availability and pricing data is limited to a period of **six months** into the future from the present time'
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              currencyCode: USD
              items:
              - travelDate: 2022-6-28
                productCode: 75659P1
                tourGradeCode: TG1~05:30
                travellers:
                - bandId: 1
                - bandId: 1
            schema:
              type: object
              properties:
                currencyCode:
                  type: string
                  description: '**currency code** for the currency in which to display pricing details'
                items:
                  type: array
                  description: '**array** of travel detail objects'
                  items:
                    type: object
                    properties:
                      travelDate:
                        type: string
                        description: '**date** for which to calculate the total price (must be in the future)'
                      productCode:
                        type: string
                        description: '**unique alphanumeric identifier** of the product the total price for which you which to calculate'
                      tourGradeCode:
                        type: string
                        description: '**alphanumeric identifier** for the tour grade for which to calculate the total price'
                      travellers:
                        type: array
                        description: '**array of objects** detailing the age bands for which to calculate the total price'
                        items:
                          type: object
                          properties:
                            bandId:
                              $ref: '#/components/schemas/bandId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        rulesApplied:
                          description: ignore (Viator only)
                          type: array
                          items:
                            type: string
                        promoCode:
                          type: string
                          description: ignore (Viator only)
                        itinerary:
                          type: object
                          description: '**summary results** for all itinerary items'
                          properties:
                            sortOrder:
                              type: integer
                              description: '**sort order** for *this* itinerary'
                            rulesApplied:
                              type: array
                              description: ignore (Viator only)
                              items:
                                type: string
                            omniPreRuleList:
                              type: integer
                              description: ignore (Viator only)
                            bookingStatus:
                              $ref: '#/components/schemas/bookingStatus_itinerary'
                            itemSummaries:
                              type: array
                              description: '**array** of item summaries'
                              items:
                                type: object
                                properties:
                                  sortOrder:
                                    type: integer
                                    description: '**sort-order** of *this* item summary'
                                  rulesApplied:
                                    type: array
                                    description: '**array** of rules applied to *this* item'
                                    items:
                                      type: string
                                  bookingStatus:
                                    $ref: '#/components/schemas/bookingStatus_item'
                                  travellerAgeBands:
                                    type: array
                                    description: '**array** of age-band objects'
                                    items:
                                      type: object
                                      properties:
                                        sortOrder:
                                          type: integer
                                          description: '**sort order** for *this* age band'
                                        count:
                                          type: integer
                                          description: '**number of travelers in *this* age band'
                                        description:
                                          type: string
                                          description: '**natural-language** description (singular) of *this* age band'
                                        pluralDescription:
                                          type: string
                                          description: '**natural-language** description (plural) of *this* age band'
                                        ageBandId:
                                          $ref: '#/components/schemas/ageBandId'
                                  voucherKey:
                                    type: string
                                    description: Unique reference for the voucher for this booking that can be used as a request parameter to search for existing bookings using the [/booking/mybookings](#operation/bookingMybookings) and [/booking/pastbooking](#operation/bookingPastbooking) endpoints
                                  voucherURL:
                                    type: string
                                    description: '**URL of the voucher** for *this* product (if available). The customer can access this URL to retrieve their voucher.'
                                  voucherRequirements:
                                    type: string
                                    description: '**natural-language description** of the voucher requirements for this tour (**note:** Should agree with value in `voucherOption` field)'
                                  productPulledDown:
                                    description: ignore (Viator only)
                                    type: boolean
                                  merchantCancellable:
                                    type: boolean
                                    description: 'ignore (Viator only)


                                      For cancellation information regarding the booking, please refer to the `merchantTermsAndConditions` object

                                      '
                                  productWidgetList:
                                    description: ignore (Viator only)
                                    type: string
                                  savingAmount:
                                    $ref: '#/components/schemas/savingAmount'
                                  applePassSupported:
                                    type: boolean
                                    description: ignore (Viator only)
                                  supplierName:
                                    type: string
                                    description: '**natural-language name** of *this* product''s supplier'
                                  supplierPhoneNumber:
                                    type: string
                                    description: '**telephone number** of the supplier'
                                  vouchers:
                                    type: string
                                    description: ignore (Viator only)
                                  passbooks:
                                    type: string
                                    description: ignore (Viator only)
                                  termsAndConditions:
                                    description: ignore (Viator only)
                                    type: string
                                  distributorItemRef:
                                    type: string
                                    description: ignore (Viator only)
                                  startingTime:
                                    type: string
                                    description: '**starting time** of the tour in the supplier''s local time zone'
                                  languageServicesLanguageCode:
                                    type: string
                                    description: ignore (Viator only)
                                  price:
                                    description: '**numeric suggested retail price** for *this* product

                                      - For more information, see: [Merchant pricing](#section/Key-concepts/Merchant-pricing)

                                      '
                                    type: number
                                  productCode:
                                    type: string
                                    description: '**unique alphanumeric identifier** of *this* product'
                                  travelDate:
                                    type: string
                                    description: '**date** on which *this* product will operate (in the supplier''s local time zone)'
                                  leadTravellerFirstname:
                                    type: string
                                    description: ignore (Viator only)
                                  tourGradeCode:
                                    type: string
                                    description: '**alphanumeric specifier** of the tour grade'
                                  leadTravellerSurname:
                                    type: string
                                    description: ignore (Viator only)
                                  lastRetailPrice:
                                    type: number
                                    description: ignore (Viator only)
                                  leadTravellerTitle:
                                    type: string
                                    description: '**title** of the lead traveler''s name'
                                  itineraryId:
                                    type: integer
                                    description: ignore (Viator only)
                                  productTitle:
                                    type: string
                                    description: '**natural-language title** of *this* product'
                                  itemId:
                                    type: integer
