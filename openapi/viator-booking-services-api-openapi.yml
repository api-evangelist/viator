ersRequiredForPrice\": 2,\n            \"priceFormatted\": \"$87.70\",\n            \"merchantNetPrice\": 0,\n            \"merchantNetPriceFormatted\": \"$0.00\"\n          }\n        ],\n        \"sortOrder\": 1,\n        \"minimumCountRequired\": 1,\n        \"maximumCountRequired\": 10\n      }\n    ]\n  }\n]\n```\n\n##### Interpretation\n- \"$87.70 per group of up to 10 adults\"\n\n#### Per-vehicle pricing\n\n##### Request object\n```javascript\n{\n  \"productCode\": \"20190P4\",\n  \"currencyCode\": \"USD\",\n  \"month\": \"06\",\n  \"year\": \"2019\"\n}\n```\n\n##### Response snippet\n```javascript\n\"pricingMatrix\": [\n  {\n    \"sortOrder\": 1,\n    \"pricingUnit\": \"per vehicle\",\n    \"bookingDate\": \"2019-06-01\",\n    \"ageBandPrices\": [\n      {\n        \"bandId\": 1,\n        \"prices\": [\n          {\n            \"sortOrder\": 1,\n            \"currencyCode\": \"USD\",\n            \"price\": 250,\n            \"minNoOfTravellersRequiredForPrice\": 1,\n            \"priceFormatted\": \"$250.00\",\n            \"merchantNetPrice\": 186.38,\n            \"merchantNetPriceFormatted\": \"$186.38\"\n          },\n          {\n            \"sortOrder\": 2,\n            \"currencyCode\": \"USD\",\n            \"price\": 250,\n            \"minNoOfTravellersRequiredForPrice\": 2,\n            \"priceFormatted\": \"$250.00\",\n            \"merchantNetPrice\": 0,\n            \"merchantNetPriceFormatted\": \"$0.00\"\n          }\n        ],\n        \"sortOrder\": 1,\n        \"minimumCountRequired\": 1,\n        \"maximumCountRequired\": 7\n      }\n    ]\n  }\n]\n```\n\n##### Interpretation\n- \"$250 per group of up to 7 adults\"\n\n#### Per-car pricing\n##### Request object\n```javascript\n{\n  \"productCode\": \"10175P10\",\n  \"currencyCode\": \"USD\",\n  \"month\": \"06\",\n  \"year\": \"2019\"\n}\n```\n\n#### Response snippet\n\n```javascript\n\"pricingMatrix\": [\n  {\n    \"sortOrder\": 1,\n    \"pricingUnit\": \"per car\",\n    \"bookingDate