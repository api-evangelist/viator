  schemas:
    ageBandId:
      type: integer
      description: '**unique numeric identifier** for the age band

        - See: [Working with age bands](#section/Appendices/Working-with-age-bands)

        '
    bookingStatus_item:
      type: object
      description: '**object** containing item booking status information'
      properties:
        status:
          type: integer
          description: '**numeric identifier** of *this* item''s booking status'
        text:
          type: string
          description: '**natural-language description** of *this* item''s booking status; e.g., ''Waiting to be booked'''
        type:
          type: string
          description: '**specifier** of *this* item''s booking status

            * See: [bookingStatus fields and meanings](#section/Appendices/bookingStatus-field-values-and-meanings)

            '
          enum:
          - WAITING
          - CONFIRMED
          - UNAVAILABLE
          - PENDING
          - FAILED
          - CANCELLED
          - EXPIRED
          - AMENDED
          - PENDING_AMEND
          - REJECTED
          - ON_HOLD
        level:
          type: string
          description: '**level** of *this* item''s booking status'
          enum:
          - ITEM
          - ITINERARY
        confirmed:
          type: boolean
          description: '**indicator**: `true` if *this* item''s booking is confirmed'
        pending:
          type: boolean
          description: '**indicator**: `true` if *this* item''s booking is pending'
        amended:
          type: boolean
          description: '**indicator**: `true` if *this* item''s booking has been amended'
        cancelled:
          type: boolean
          description: '**indicator**: `true` if *this* item''s booking has been cancelled'
        failed:
          type: boolean
          description: '**indicator**: `true` if *this* item''s booking has failed'
    500_INTERNAL_SERVER_ERROR:
      type: object
      properties:
        code:
          type: string
          enum:
          - INTERNAL_SERVER_ERROR
        message:
          type: string
          enum:
          - Internal server error
        timestamp:
          type: string
          description: "Timestamp of the request\n\n  * e.g.: `2019-09-17T03:20:45.737043Z`\n"
        trackingId:
          type: string
          description: Tracking identifier for this error response
    bookingStatus_itinerary:
      type: object
      description: '**object** containing itinerary booking status information'
      properties:
        status:
          type: integer
          description: '**numeric identifier** of *this* itinerary''s booking status'
        text:
          type: string
          description: '**natural-language description** of *this* itinerary''s booking status'
        type:
          type: string
          description: '**specifier** of *this* itinerary''s booking status

            * See: [bookingStatus fields and meanings](#section/Appendices/bookingStatus-field-values-and-meanings)

            '
          enum:
          - WAITING
          - CONFIRMED
          - PENDING
          - FAILED
          - CANCELLED
          - AMENDED
          - PENDING_AMEND
        level:
          type: string
          description: '**level** of *this* itinerary''s booking status'
          enum:
          - ITEM
          - ITINERARY
        confirmed:
          type: boolean
          description: '**indicator**: `true` if *this* itinerary''s booking is confirmed'
        pending:
          type: boolean
          description: '**indicator**: `true` if *this* itinerary''s booking is pending'
        amended:
          type: boolean
          description: '**indicator**: `true` if *this* itinerary''s booking has been amended'
        cancelled:
          type: boolean
          description: '**indicator**: `true` if *this* itinerary''s booking has been cancelled'
        failed:
          type: boolean
          description: '**indicator**: `true` if *this* itinerary''s booking has failed'
    bandId:
      type: integer
      description: '**unique numeric identifier** for the age band

        - See: [Working with age bands](#section/Appendices/Working-with-age-bands)

        '
    RefundDetails:
      type: object
      description: 'Details of the refund


        **Note**: Bookings that have not been confirmed by the supplier and have a status of `"PENDING"` will report an `itemPrice`, `refundAmount` and `refundPercentage` of `0`, as no fees are charged until the booking has been accepted by the supplier and its status is `"CONFIRMED"`.

        '
      properties:
        itemPrice:
          type: number
          description: The merchant net price at the time this product was booked
        refundAmount:
          type: number
          description: Numeric currency amount that will be refunded if this booking is cancelled now
        refundPercentage:
          type: number
          description: Percentage of the item price that will be refunded if this booking is cancelled now
        currencyCode:
          type: string
          description: Three-letter code indicating the currency in which `itemPrice` and `refundAmount` are displayed
    406_NOT_ACCEPTABLE:
      type: object
      properties:
        code:
          type: string
          enum:
          - INVALID_HEADER_VALUE
        message:
          type: string
          description: 'Describes which in-header parameter was not acceptable to this system; e.g., ''Invalid value for header: exp-api-key'''
        timestamp:
          type: string
          description: "Timestamp of the request\n\n  * e.g.: `2019-09-17T03:20:45.737043Z`\n"
        trackingId:
          type: string
          description: Tracking identifier for this error response
    savingAmount:
      type: string
      description: 'Ignore (Viator only)

        '
    401_UNAUTHORIZED:
      type: object
      properties:
        code:
          type: string
          enum:
          - UNAUTHORIZED
        message:
          type: string
          enum:
          - Invalid API key
        timestamp:
          type: string
          description: "Timestamp of the request\n\n  * e.g.: `2019-09-17T03:20:45.737043Z`\n"
        trackingId:
          type: string
          description: Tracking identifier for this error response
    CancelBookingQuoteResponse:
      type: object
      properties:
        refundDetails:
          $ref: '#/components/schemas/RefundDetails'
        bookingId:
          type: string
          description: The booking reference number, prepended with `BR-`
        status:
          type: string
          description: "String indicating the cancellation status of this itinerary item:\n\n  * `CANCELLABLE` - this booking is available to be cancelled\n  * `CANCELLED` - this booking has already been cancelled\n  * `NOT_CANCELLABLE` - this booking cannot be cancelled (because the product's operation date is now in the past)\n"
          enum:
          - CANCELLABLE
          - CANCELLED
          - NOT_CANCELLABLE
    CancelBookingResponse:
      type: object
      properties:
        bookingId:
          type: string
          description: Booking reference number for this booking, prepended with `BR-`
          example: BR-580254558
        status:
          type: string
          description: "String indicating the outcome of the booking cancellation request.\n\n  * `ACCEPTED`: The cancellation was successful\n  * `DECLINED`: The cancellation failed\n"
          enum:
          - ACCEPTED
          - DECLINED
          example: DECLINED
        reason:
          type: string
          enum:
          - ALREADY_CANCELLED
          - NOT_CANCELLABLE
    CancellationReason:
      type: object
      properties:
        cancellationReasonCode:
          type: string
          description: Machine-interpretable identification code for this cancellation
          example: Customer_Service.Weather
        cancellationReasonText:
          type: string
          description: Natural-language description of this cancellation reason
          example: The weather conditions were unsuitable
    basicErrorModel:
      type: object
      properties:
        errorReference:
          type:
          - string
          - 'null'
          description: '**reference number** of *this* error'
        dateStamp:
          type:
          - string
          - 'null'
          description: '**timestamp** of *this* response'
        errorType:
          type:
          - string
          - 'null'
          description: '**code** specifying the type of error'
        errorCodes:
          type:
          - array
          - 'null'
          description: '**array** of error codes pertaining to *this* error

            - See: [Viator API error codes](#section/Appendices/Viator-API-error-codes) for a list of possible error codes

            '
          items:
            type: string
          example: []
        errorMessage:
          type:
          - array
          - 'null'
          description: '**array** of error message strings'
        errorName:
          type:
          - string
          - 'null'
          description: '**name** of *this* type of error'
        extraInfo:
          type:
          - object
          - 'null'
          description: ignore (Viator only)
        extraObject:
          type:
          - object
          - 'null'
          description: ignore (Viator only)
        success:
          type:
          - boolean
          - 'null'
          description: '**boolean indicator** of *this* request''s outcome

            - `true`: the request was successful with no errors

            - `false`: an error was encountered

            '
        totalCount:
          type:
          - integer
          - 'null'
          description: '**number** of results available for *this* service

            '
        errorMessageText:
          type:
          - string
          - 'null'
          description: '**array** of error message strings in plain text'
        vmid:
          type:
          - string
          - 'null'
          description: '**unique numeric id** of the server that processed *this* request'
    bookingEngineId-response:
      type: string
      enum:
      - UF
      - OR
      - FO
      description: '[booking type indicator](#section/Key-concepts/Booking-concepts) that indicates whether the booking will be `CONFIRMED` immediately or if it will remain `PENDING` even after the booking has been made


        *one of* the following:

        - `"UF"` (FreesaleBE and UnconditionalBE) – this booking will be confirmed immediately

        - `"OR"` (DeferredCRMBE) – the booked product is an on-request product, will not be confirmed immediately and will have a `PENDING` status after it is booked, to be confirmed by the supplier within the time specified in the `hoursConfirmed` field available in the booking response and post-booking services

        - `"FO"` (FreesaleOnRequestBE) – the booked product is freesale up until a certain number of days before the travel date, referred to as the *on-request period*.

        '
    503_SERVICE_UNAVAILABLE:
      type: object
      properties:
        code:
          type: string
          enum:
          - SERVICE_UNAVAILABLE
        message:
          type: string
          enum:
          - Internal server error
        timestamp:
          type: string
          description: 'Timestamp of the request

            e.g.: `2019-09-17T03:20:45.737043Z`

            '
        trackingId:
          type: string
          description: Tracking identifier for this error response
    savingAmountFormated:
      type: string
      description: 'Ignore (Viator only)

        '
    CancellationRequest:
      type: object
      properties:
        reasonCode:
          type: string
          description: Machine-interpretable identification code for this cancellation reason, retrieved from [cancellationReasons](#operation/cancellationReasons)
          example: Customer_Service.I_canceled_my_entire_trip
    CancellationReasonsResponse:
      type: object
      properties:
        reasons:
          type: array
          description: Array of cancellation reason codes and their asssociated texts for display to the user
          items:
            $ref: '#/components/schemas/CancellationReason'
  parameters:
    destId:
      name: destId
      in: query
      description: '**unique numeric identifier** of the destination'
      schema:
        type: integer
      example: 123
    productCode:
      name: productCode
      in: query
      description: '**unique alphanumeric identifier** of the product'
      schema:
        type: string
      example: 2280AAHT
    acceptLanguage:
      in: header
      name: Accept-Language
      description: 'Specifies the language into which the natural-language fields in the response from this service will be translated (see [Accept-Language header](#section/Appendices/Accept-Language-header) for available language codes)

        '
      required: true
      schema:
        type: string
        example: en-US
  securitySchemes:
    API-key:
