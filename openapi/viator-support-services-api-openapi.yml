  description: Production server
security:
- API-key: []
- Legacy-API-key: []
tags:
- name: Support services
  description: Support services
paths:
  /support/customercare:
    get:
      tags:
      - Support services
      summary: /support/customercare
      operationId: supportCustomercare
      description: This endpoint returns the URL to the Viator help page.
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        url:
                          type: string
                          description: '**URL** for the Viator help page'
                          example: http://www.viator.com/customer-care?eap=brand-subbrand-16721&aid=vba16721en
              examples:
                '1':
                  $ref: '#/components/examples/support-customercare-example'
