  /product/reviews:
    get:
      tags:
      - Product services
      summary: /product/reviews
      operationId: productReviews
      description: "Get reviews of a product submitted by users\n\n**Note**: \n\n- The number of reviews that you can obtain via this service will depend on\nwhether your account is limited in terms of the number of reviews you are\nentitled to receive. \n\n- The number of reviews available through this service is given in the\n`reviewCount` element in the response from [/product](#operation/product)\n\n- Please speak to your account manager if you wish to receive more reviews.\nIf your account is not limited, you will be able to receive all available\nreviews for this product.\n\n- Only reviews in the language specified in the Accept-Language request\nheader will be returned\n\n**Viator performs checks on reviews**\n\n- For more information, see [Key concepts - Review authenticity](#section/Key-concepts/Review-authenticity)\n\n\n**Example:** \"Get the first three reviews for product `5010SYDNEY` sorted by\nrating in ascending order\":\n\n\n```javascript\n\nhttps://viatorapi.viator.com/service/product/reviews?sortOrder=REVIEW_RATING_A&topX=1-3&code=5010SYDNEY&showUnavailable=false\n\n```\n"
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/sortOrder_REVIEW'
      - $ref: '#/components/parameters/topX'
      - $ref: '#/components/parameters/code'
      - $ref: '#/components/parameters/showUnavailable'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/basicErrorModel'
                - type: object
                  properties:
                    data:
                      type: array
                      description: '**array** of review objects'
                      items:
                        $ref: '#/components/schemas/reviewObject'
              examples:
                '1':
                  $ref: '#/components/examples/product-reviews-example'
    servers:
    - url: https://viatorapi.viator.com/service
      description: Production server
