            submissionDate: '2020-01-16'
            rating: 5
            review: <p>Excellent way of visiting the city! It’s the only way to see atttactions in Sydney as I only have three days to stay . The next day I went back to Bondi beach to spend half of my day for the birthday of my son. Went to Iceberg Club overlooking the beach with surfers. It’s the best view you can get while having lunch! Walked along the coast to enjoy the magnificent view. I plan to go back again to this beautiful city. Spent sometime at the opera house area where there’s plenty of nice cafes to eat while admiring the view!</p>
            publishedDate: '2020-01-16'
            ownerId: 32351278
            reviewId: 67907371
          - sortOrder: 2
            ownerName: tomzak21
            ownerCountry: null
            productTitle: Big Bus Sydney and Bondi Hop-on Hop-off Tour
            productUrlName: Sydney-and-Bondi-Hop-on-Hop-off-Tour
            ownerAvatarURL: http://cache-graphicslib.viator.com/graphicslib/media/f5/tomzak21-account_47925237-45sq.jpg
            sslSupported: false
            productCode: 5010SYDNEY
            submissionDate: '2020-01-09'
            rating: 5
            review: '<p>Love The Big Bus, Hop On / Hop Off Tour Company! This is the way to see just about all the key areas and tourist attractions. You don''t have to rent a car and they are actually comfortable. We also did a Hop On, Hop Off in Budapest, Hungary and that was great also, saw all the major attractions!</p>


              <p>  They provide you with earbuds and there are 6+ languages that you can choose. Being in Sydney, there was Chinese, Korean, Japanese, along with French, Spanish, English and I believe German.</p>


              <p>  There is also a "package deal" in which you can purchase a pass to other attractions along the route.. like Wildlife Sydney Zoo, Madame Tussaud''s, Sydney Eye. You can buy a 2, 3 or 4 attraction pass in which The Big Bus is one of the attractions.</p>


              <p>  Love The Big Bus! If you want a quick tour or spend a couples days of exploring, this is the way to go!</p>


              <p>  Only complaint... the drop off  and  pick up spots could be better labeled. They should put there logo on a sign and make it noticeable. Some stops had some kind of sign, but there were a few stops that we weren''t sure we were in the right spot. It wound up that we were in the correct spot. Addresses are listed in the provided  in the pamphlet / flyer provided.</p>'
            publishedDate: '2020-01-09'
            ownerId: 47925237
            reviewId: 67480203
