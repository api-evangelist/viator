        description: "Surfing is amazing sport with awesome vibes! Let me show you and teach you how to surf, how to read the waves and surf conditions. \n\nWhen I´m teaching my clients surfing I always want them to enjoy it and have fun and I make them feel welcome. Based on my experiences it also help my client not to panic.\n\nI´m offering private lessons with professional and experienced istructor for complete begginers (1 instructor 1 client). This allows me to give you personal attention, safety, feedback for improving your surfind and of course buddy system. \n\nFor intermediate, advanced surfers I´m as well offering to be their guid in different surf spots around Bali. I will show you different types of waves, diffrent breaks and I will teach you how to get behind the breaking point safely and how to catch the waves. If it is necessary I will correct your style. All of that may affect to becoming a better surfer or improving your skills."
