scope: Viator Partner API v2 (demand side)
summary: >-
  The Viator demand-side model has a single spine: productCode. Everything a partner stores hangs
  off it - availability, price, reviews, attractions, bookings and amendments all resolve back to a
  Viator-proprietary opaque product code. There is no customer or account entity: the traveller
  exists only as bookerInfo and communication fields inside a booking. Identifiers are opaque and
  prefixed (BR-, CR-, QR-, PBE-, LOC-, STK-), which makes them recognisable but non-portable - none
  of them means anything to any other marketplace.
entities:
- name: Product
  primary_key: productCode
  id_format: >-
    Viator-proprietary opaque code, no fixed shape. Published examples: 5010SYDNEY, 46334P42,
    265910P1, 2050P348, 3283BWW, 6613GRANDCELE.
  schema: '#/components/schemas/Product'
  operations: [products, productsBulk, productsModifiedSince, productsSearch, productsRecommendations]
  note: The primary key of the whole demand-side model.
- name: ProductOption
  primary_key: productOptionCode
  id_format: 'Viator-proprietary. Published examples: TG2, TG39, 48HOUR, DEFAULT.'
  note: >-
    A bookable variant of a Product with its own pricing and inventory. Formerly called a tour
    grade.
- name: AvailabilitySchedule
  primary_key: productCode
  schema: '#/components/schemas/AvailabilitySchedule'
  operations: [availabilitySchedules, availabilitySchedulesBulk, availabilitySchedulesModifiedSince]
- name: AvailabilityCheck
  primary_key: null
